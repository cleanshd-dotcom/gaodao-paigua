<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<body>
<style>
/* 布局：顶部声明条 + 内容区 + 底部固定四标签；手机竖屏单列 */
:root {
  --bg: #eef0f1; --panel: #f9fafa; --fg: #1f2528; --muted: #5b676d; --line: #c9d0d3;
  --accent: #2f4a6b; --accent-fg: #ffffff; --warn-bg: #f3ece0; --warn-fg: #5a4320; --hit: #e4ecf5;
  --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", STSong, SimSun, serif;
  --sans: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14181b; --panel: #1c2226; --fg: #dfe3e5; --muted: #98a4aa; --line: #333d43;
  --accent: #8fb0d3; --accent-fg: #10171d; --warn-bg: #2a2418; --warn-fg: #e6d3ac; --hit: #223244; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14181b; --panel: #1c2226; --fg: #dfe3e5; --muted: #98a4aa; --line: #333d43;
  --accent: #8fb0d3; --accent-fg: #10171d; --warn-bg: #2a2418; --warn-fg: #e6d3ac; --hit: #223244; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.7 var(--serif); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 84px; }
.wrap { max-width: 640px; margin: 0 auto; }
.notice { background: var(--warn-bg); color: var(--warn-fg); font: 13px/1.5 var(--sans); padding: 8px 12px; margin: 12px 0; border-radius: 6px; }
h1 { font-size: 22px; margin: 8px 0 4px; letter-spacing: .08em; }
h2 { font-size: 18px; margin: 20px 0 8px; }
h3 { font-size: 16px; margin: 14px 0 4px; }
p { margin: 6px 0; }
.sub { color: var(--muted); font: 13px/1.5 var(--sans); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 12px 0; }
button { font: 15px/1.2 var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; min-height: 44px; padding: 8px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
textarea, input, select { font: 16px/1.5 var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.row { display: grid; grid-template-columns: 3.4em 1fr; gap: 8px; align-items: center; margin: 8px 0; }
.row .lab { font: 14px var(--sans); color: var(--muted); }
.btns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.btns button { padding: 6px 2px; font-size: 14px; }
.btns b { display: block; font-size: 17px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.hex { display: inline-flex; flex-direction: column; gap: 6px; padding: 6px 0; }
.ln { display: flex; align-items: center; gap: 8px; height: 14px; }
.yang, .yin span { display: block; height: 12px; background: var(--fg); border-radius: 2px; }
.yang { width: 96px; }
.yin { display: flex; gap: 12px; width: 96px; }
.yin span { flex: 1; }
.mk { font: 15px var(--sans); width: 1.2em; color: var(--accent); }
.figs { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.figs .cap { font: 13px var(--sans); color: var(--muted); margin-bottom: 4px; }
.big { font-size: 22px; }
.sym { font-size: 28px; line-height: 1; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid button { text-align: left; font-family: var(--serif); font-size: 16px; display: flex; align-items: center; gap: 8px; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.yaocard { border-top: 1px solid var(--line); padding: 10px 0; }
.yaocard.hit { background: var(--hit); margin: 0 -12px; padding: 10px 12px; border-radius: 6px; }
.yl { font: 600 15px var(--sans); color: var(--accent); }
.orig { font-size: 17px; }
.tag { font: 12px var(--sans); color: var(--muted); letter-spacing: .08em; display: block; margin-top: 6px; }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin: 8px 0; padding: 0 12px; }
summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font: 15px/1.4 var(--sans); }
details[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 8px; }
details > div { padding-bottom: 10px; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 0 max(0px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(0px, env(safe-area-inset-right, 0px)); }
nav button { border: 0; border-radius: 0; background: transparent; min-height: 56px; font-size: 15px; color: var(--muted); }
nav button[aria-selected="true"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 3px 0 var(--accent); }
/* 平板横屏：左侧竖标签栏，排卦页左右分栏，列表多列 */
@media (min-width: 900px) {
  body { font-size: 18px; padding-block: 0 24px; padding-left: calc(max(16px, env(safe-area-inset-left, 0px)) + 120px); }
  .wrap { max-width: 1180px; }
  nav { top: 0; right: auto; width: calc(104px + env(safe-area-inset-left, 0px)); grid-template-columns: 1fr; grid-auto-rows: 64px; align-content: start;
    border-top: 0; border-right: 1px solid var(--line); padding: 16px 0 0 env(safe-area-inset-left, 0px); }
  nav button { min-height: 64px; font-size: 17px; }
  nav button[aria-selected="true"] { box-shadow: inset 4px 0 0 var(--accent); }
  .btns button { min-height: 56px; font-size: 15px; }
  .btns b { font-size: 20px; }
  #tab-cast { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 24px; align-items: start; }
  #tab-cast > h1, #tab-cast > .sub { grid-column: 1 / -1; }
  #castRows, #tab-cast > .actions { grid-column: 1; }
  #castResult { grid-column: 2; grid-row: 3 / span 2; }
  #castResult .panel { margin-top: 0; }
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #quickList, #quizList { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; align-items: start; }
}
[hidden] { display: none !important; }
.err { color: #b3261e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #ff9a8f; } }
:root[data-theme="dark"] .err { color: #ff9a8f; }
</style>

<div class="wrap">
  <div class="notice" role="note">学习用途，不是预测；卦不替他人决定。博彩、医疗、法律、紧急安全问题不以占卜为依据。本页不保存任何内容，关掉页面即清空。</div>

  <section id="tab-cast">
    <h1>排卦</h1>
    <p class="sub">每行按硬币结果点一下，自下而上：先点初爻。币面约定：10元面为阳，马面为阴。</p>
    <div class="panel" id="castRows"></div>
    <div class="actions"><button id="resetBtn" type="button">重来</button></div>
    <div id="castResult" hidden></div>
  </section>

  <section id="tab-look" hidden>
    <div id="lookList">
      <h1>查卦</h1>
      <div class="filters">
        <input id="q" type="search" placeholder="搜卦名或序号" aria-label="搜卦名或序号">
        <span></span>
        <select id="fUpper" aria-label="上卦"></select>
        <select id="fLower" aria-label="下卦"></select>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div id="lookDetail" hidden></div>
  </section>

  <section id="tab-quick" hidden>
    <h1>速查</h1>
    <p class="sub">取自起卦解读速查册，学习概括，不是高岛逐字原文。</p>
    <div id="quickList"></div>
    <p class="sub">主册第197至203页附有20条高岛短段，资格为待独立确认，本页不收录全文。</p>
  </section>

  <section id="tab-quiz" hidden>
    <h1>练习</h1>
    <p class="sub">20题。先自己想，再点开看答案。进度不保存。</p>
    <div id="quizList"></div>
  </section>
</div>

<nav role="tablist" aria-label="页面">
  <button type="button" role="tab" data-tab="cast" aria-selected="true">排卦</button>
  <button type="button" role="tab" data-tab="look" aria-selected="false">查卦</button>
  <button type="button" role="tab" data-tab="quick" aria-selected="false">速查</button>
  <button type="button" role="tab" data-tab="quiz" aria-selected="false">练习</button>
</nav>

<script>
// 排卦核心：values 为初爻到上爻的六个数（7少阳、8少阴、9老阳、6老阴）。
// keyMap：自下而上六位阴阳（1阳0阴）字符串 -> 卦序号。
(function (root) {
  function lineBit(v) {
    if (v === 7 || v === 9) return 1;
    if (v === 6 || v === 8) return 0;
    throw new Error('爻值只能是6、7、8、9：' + v);
  }
  function isMoving(v) { return v === 9 || v === 6; }
  function divine(values, keyMap) {
    if (!Array.isArray(values) || values.length !== 6) throw new Error('必须六个爻值');
    const ben = values.map(lineBit);
    const zhi = values.map((v, i) => (isMoving(v) ? 1 - ben[i] : ben[i]));
    const moving = [];
    values.forEach((v, i) => { if (isMoving(v)) moving.push(i + 1); });
    return {
      ben: keyMap[ben.join('')],
      zhi: moving.length ? keyMap[zhi.join('')] : null,
      moving: moving,
      benBits: ben,
      zhiBits: zhi
    };
  }
  const api = { divine: divine, lineBit: lineBit, isMoving: isMoving };
  root.Core = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
const DATA = {"hexes":[{"n":1,"name":"乾为天","sym":"䷀","upper":"乾","lower":"乾","guaci":"元亨利贞。","theme":"刚健与时位","summary":"乾以龙的潜藏、出现、跃动、飞腾与过亢，呈现刚健力量在不同位置的用法。全卦有进取精神，却不是任何时候都宜向前：初爻说勿用，上爻说有悔，中间诸爻也保留戒惧。学习重点是能力、时机与分寸能否相配，而非见到纯阳就判诸事大吉。","gt":"元、亨、利、贞在传统解释中有不同分读。本册入门理解为开创、通达、有利与守正，同时保留它们作为占辞的语境；四字不能直接扩写成任何具体愿望都会实现。","focus":"对照六爻的勿用、利见、戒惧与有悔，理解刚健也有使用条件。龙是经文意象，不能直接指认现实中的某个人。","yao":[{"label":"初九","text":"潜龙勿用。","meaning":"龙还潜藏，暂不施展。文字强调处于未宜显用的阶段，并非否定其能力；有潜力与适合立即行动是两回事，不能把等待说成永远无望，也不能略去勿用而催促出头。","focus":"先分清有能力与适宜显用，不把潜藏解释成必然受赏。"},{"label":"九二","text":"见龙在田，利见大人。","meaning":"龙出现在田野，利于见到大人。显现与接触有分量的人物是本爻的有利表达；大人的身份及利见的具体方式仍须结合语境，不能任意指定现实中的贵人或对象。","focus":"保留利见的正向含义，但不保证某人会主动帮助。"},{"label":"九三","text":"君子终日乾乾，夕惕若，厉无咎。","meaning":"君子整日勤勉不息，到夜晚仍警惕谨慎。即使处境有危险，也可无咎；这里的无咎与持续自省、戒惧相连，不能只保留勤奋就会成功的单线结论。","focus":"勤勉与警惕并读，危险没有因无咎二字而消失。"},{"label":"九四","text":"或跃在渊，无咎。","meaning":"龙或将跃起，仍与深渊相联系，无咎。或字保留进退未定的意味，重点是处在可尝试而须审度的位置；不是命令一跃而上，也不等于任何试探都没有代价。","focus":"关注或字的斟酌意味，不把试跃变成强行冒进。"},{"label":"九五","text":"飞龙在天，利见大人。","meaning":"龙飞在天，利于见到大人。这是能力得到充分显现的意象，具有明确有利成分；但飞龙的高位不等于现实职位已获保证，利见仍是本爻要保留的交往条件。","focus":"显用是经文图景，现实是否得位仍须另有事实。"},{"label":"上九","text":"亢龙有悔。","meaning":"龙升得过高，因过亢而有悔。强盛在此达到过度，不能因为同属乾卦就淡化警戒；本爻着眼于超出适宜位置与分寸的后果，并不判定一个人终身失败。","focus":"把过亢与有悔连起来，不用刚健总义掩盖警戒。"}],"extra":{"label":"用九","text":"见群龙无首，吉。","meaning":"见到群龙而无一者争作首领，吉。传统解释常从刚健而不以强力自居理解；用九是乾卦另列的特殊文字，不是第七爻。六爻全动怎样采用它，仍须先声明所用读取约定。","focus":"保留群龙无首的原句语境，不套用现代群体失序的贬义。"}},{"n":2,"name":"坤为地","sym":"䷁","upper":"坤","lower":"坤","guaci":"元亨，利牝马之贞。君子有攸往，先迷后得主，利。西南得朋，东北丧朋。安贞吉。","theme":"承载与守分","summary":"坤的学习主题是承载、顺应与持守，但经文并没有要求无条件服从。牝马、含章、括囊、黄裳等意象，呈现不同位置中的柔顺与分寸；霜至坚冰、龙战玄黄又保留明确警戒。应把配合、方向与冲突一起读，不能凭纯阴便断弱势或凶险。","gt":"通达，利于如牝马那样持守。君子有所前往，先行可能迷失，随后得到主导则有利；西南得伴，东北失伴，安定持守则吉。方位与先后是原文条件，不直接化为个人的搬迁指令。","focus":"柔顺不是放弃判断。留意先后、得朋丧朋与安贞的具体限定，也不把男女称谓当成固定人格等级。","yao":[{"label":"初六","text":"履霜，坚冰至。","meaning":"脚下踏到霜，就应知道坚冰的时节将至。由已出现的小征兆认识后续可能的发展，是本爻的观察线索；它不是凭空预告灾难，也不能把所有细小不顺都解释成大凶前兆。","focus":"征兆须有现实可观察对象，不能事后任意认领。"},{"label":"六二","text":"直方大，不习无不利。","meaning":"以直、方、大描述其品质，接以不习而无不利。不习的具体训释可有讨论，入门可理解为自然具备合宜的承载，不待矫饰；不能据此宣布无需学习、准备或练习。","focus":"品质与无不利相连，不把不习译成可以不做功课。"},{"label":"六三","text":"含章可贞。或从王事，无成有终。","meaning":"含藏美好而可守正；若参与王事，不以独占成果为目标，却能有终。这里强调含蓄、尽职与完成的关系，不等于现实劳动应被抹去，也不能从无成推出事情失败。","focus":"区分不居功与无结果，不把配合变成取消自身权益。"},{"label":"六四","text":"括囊，无咎无誉。","meaning":"扎紧袋口，无咎也无誉。收敛言行使过失得以避免，同时也未获称誉，是明确的取舍；不能只把谨慎包装成必有回报，也不应把暂时不显露理解为永远闭口。","focus":"无咎与无誉并列，收敛的收益与限制都需保留。"},{"label":"六五","text":"黄裳，元吉。","meaning":"黄色的下裳，元吉。黄与裳在传统解释中关联中正、居下与文饰，构成得体而不僭越的吉象；这是经文的象征表达，不是穿某种颜色即可招吉的操作规则。","focus":"保留元吉，不把衣色意象变成服装或身份保证。"},{"label":"上六","text":"龙战于野，其血玄黄。","meaning":"龙在野外交战，流血呈玄黄之色。承顺之卦走到这里仍有剧烈冲突，提醒不能把坤的总义当作全程平顺；血色为原文画面，不能直接诊断疾病或预言伤亡。","focus":"正视冲突意象，不把它转换成具体人身灾祸预告。"}],"extra":{"label":"用六","text":"利永贞。","meaning":"利于长久持守。用六是坤卦另列的特殊文字，不是第七爻；永贞强调持续而合宜的持守，不能解释成永远忍受伤害。六爻全动时是否采用用六，应先声明读取约定。","focus":"长久持守须分辨所守是否合宜，不等于永不改变。"}},{"n":3,"name":"水雷屯","sym":"䷂","upper":"坎","lower":"震","guaci":"元亨利贞，勿用有攸往，利建侯。","theme":"初生与建置","summary":"屯写事物初起时的盘旋、迟滞与条件未齐。卦辞有亨利贞，也明说不宜贸然前往，而以建立组织为有利方向。各爻从居贞、求合到无向导逐鹿与泣血，显示困难中的不同处境；不能将起步艰难圆成迟早必成，也不能只见难字就判全无机会。","gt":"有开创通达、利于守正之意，但不要贸然有所前往，利于建立侯长、形成组织。吉意与行动限制并存，建侯是原文政治语境中的表达，不必机械替换成现代职位。","focus":"先区分暂不宜进与可以建置的方向。婚媾、十年等原文字词不能不经问项核查就套成个人婚期。","yao":[{"label":"初九","text":"磐桓，利居贞，利建侯。","meaning":"盘旋徘徊，利于安居守正，也利于建立组织。行动尚未顺畅时，立足与建置可以并行；本爻并非一概禁止作为，而是把躁进与有秩序的准备区分开来。","focus":"把居贞与建侯一起看，不把徘徊只解释成失败。"},{"label":"六二","text":"屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。","meaning":"困难而回旋，乘马也徘徊；来者不是盗寇，而是求婚者。女子持守而暂不许嫁，十年才许嫁。字在此按婚嫁理解，年数保留为原文，不能据此替现实对象认定意愿。","focus":"匪寇与婚媾是原文转折，十年不能直接当个人期限。"},{"label":"六三","text":"即鹿无虞，惟入于林中。君子几不如舍，往吝。","meaning":"追鹿却没有虞人向导，只是走入林中。君子察觉苗头，不如舍弃，继续前往会有吝。这里的停止有清楚的条件：缺少引导与把握，不是把一切目标都宣告不值得追求。","focus":"识别无向导仍追逐的风险，保留不如舍的止步判断。"},{"label":"六四","text":"乘马班如，求婚媾，往吉无不利。","meaning":"乘马徘徊之际，主动求取婚媾，前往则吉，无不利。与六二的暂不许嫁不同，本爻文字明确支持求合；实际应用仍须分清问项与双方意愿，不能把吉辞当关系许可。","focus":"保留求合的吉意，同时不替任何现实对象表示同意。"},{"label":"九五","text":"屯其膏，小贞吉，大贞凶。","meaning":"膏泽积滞，难以充分施布；小范围持守吉，大规模持守或举事则凶。小贞与大贞的具体译法有讨论，但经文明分尺度，不能把前半吉字推广为任何规模都宜推进。","focus":"重点是尺度不同则判断不同，不抹去大贞凶。"},{"label":"上六","text":"乘马班如，泣血涟如。","meaning":"乘马仍在徘徊，泪血不断流下。文字没有补出脱困或吉利的收束，应如实保留困顿、忧伤的画面；泣血可作深悲意象理解，不能字面预测某人流血。","focus":"不替原文添加转机，也不据悲痛意象断具体伤病。"}],"extra":null},{"n":4,"name":"山水蒙","sym":"䷃","upper":"艮","lower":"坎","guaci":"亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。","theme":"启蒙与求教","summary":"蒙关乎知识未明与启发的关系。卦辞强调由求学者主动求教，初次问筮有所告，再三轻慢则不告，且以守正为条件。各爻同时呈现包容、困蒙、失身与御寇等差异，不应把蒙简单等同愚笨，更不能用教导之名合理化控制他人。","gt":"可以通达。不是我去追求童蒙，而是童蒙来求我；初次问筮给予告示，再三轻慢便不再告示，利于守正。重点在真诚求教与有边界的回应，不是反复问到满意为止。","focus":"区分求教与索取迎合答案。刑人、取女与御寇保留古代语境，不转成现代惩罚或性别评判指令。","yao":[{"label":"初六","text":"发蒙，利用刑人，用说桎梏，以往吝。","meaning":"启发蒙昧，涉及施加约束与解除桎梏，但继续照此推行则吝。说按脱理解；句中刑与脱的关系存在解释分歧，可从约束的目的在解除困蒙入门，不能据此鼓励体罚。","focus":"注意以往吝的限制，启蒙不能被译成无限施罚。"},{"label":"九二","text":"包蒙吉。纳妇吉，子克家。","meaning":"包容蒙昧则吉，纳妇吉，儿子能够承担家事。几种图景共同呈现容纳与担责的可能；包容不等于不辨是非，也不能凭这条判某段现实婚姻必成或认定某人已成熟。","focus":"容纳与承担并读，不把家庭意象当个人关系认证。"},{"label":"六三","text":"勿用取女，见金夫，不有躬，无攸利。","meaning":"不要娶这样的女子：见到金夫便失去自身持守，没有什么有利。金夫所指有富有或强健等释读；警戒重在失其自身，不宜借古代婚嫁语言贬低某个现实女性。","focus":"保留勿用与无攸利，不用性别化标签指认他人。"},{"label":"六四","text":"困蒙，吝。","meaning":"困在蒙昧之中，有吝。文字简短，突出未明而受困的处境，没有自动附带受教即成的承诺；现实中究竟缺知识、渠道还是判断，仍需另外核查而不能凭卦指定。","focus":"承认未明与受困，不替原文补出原因或成功期限。"},{"label":"六五","text":"童蒙，吉。","meaning":"如童蒙般处于可受启发的位置，吉。这里保留初学者虚心的正向意义，并不把幼稚、无知本身当优点；吉辞也不能证明一项未经核查的建议值得全盘接受。","focus":"初学可教与盲从不同，吉意不取消对知识的核查。"},{"label":"上九","text":"击蒙，不利为寇，利御寇。","meaning":"击除蒙昧，不利于自己成为侵扰者，利于防御侵扰。主动侵害与保卫边界在本爻中有明确区别；不能截取击蒙就鼓励强制纠正别人，也不必把寇指为某个现实人物。","focus":"不利为寇与利御寇相对，力度须受目的约束。"}],"extra":null},{"n":5,"name":"水天需","sym":"䷄","upper":"坎","lower":"乾","guaci":"有孚，光亨，贞吉。利涉大川。","theme":"等待与准备","summary":"需的等待不是无条件拖延。卦辞以有孚、贞吉与涉川并列，六爻则从郊外、沙地、泥地推进到血、酒食和穴中来客，显示等待所在的位置与风险不同。是否仍有余地、是否靠险过近、怎样接待意外，是比单说迟早会好更具体的阅读线索。","gt":"有诚信，光明而通达，守正则吉，利于渡过大河。有所等待与可以涉险并不矛盾，但必须连同诚信、持守与所处条件理解，不能翻成只要等候就能如愿。","focus":"对照等待的位置与接近危险的程度。酒食与来客是具体意象，不自动对应聚餐、贵人或确切日期。","yao":[{"label":"初九","text":"需于郊，利用恒，无咎。","meaning":"在郊外等待，利于保持恒常，无咎。尚与危险留有距离时，稳定持守是本爻的条件；这里不是放任所有事情停滞，而是避免因为心急而过早进入风险较高的位置。","focus":"等待有位置与恒常条件，不等于可以无限拖延。"},{"label":"九二","text":"需于沙，小有言，终吉。","meaning":"在沙地等待，会有一些言语议论，最终吉。小有言与终吉同时存在，不能把议论扩大成必有恶意，也不能用最后的吉意抹去等待中需要面对的分歧。","focus":"保留小有言的过程，不将终吉解释成无人反对。"},{"label":"九三","text":"需于泥，致寇至。","meaning":"在泥地等待，招致寇来。等待之地更接近险境，可能因陷滞而引来侵扰；这里的寇是原文风险意象，不能未经证据就认定现实中有人蓄意谋害。","focus":"留意所处位置招险，不凭寇字替现实人物定罪。"},{"label":"六四","text":"需于血，出自穴。","meaning":"在血的危险情境中等待，又从穴中出来。血与穴构成受险、脱出的画面，文字未给出具体伤情或时点；不能因为出现血就预言流血，也不应忽略出自穴的变化。","focus":"危险与脱出并看，不将血象变成身体状况判断。"},{"label":"九五","text":"需于酒食，贞吉。","meaning":"在酒食中等待，守正则吉。能够从容饮食，是与泥、血不同的处境，但吉仍带贞的限定；不能把这一图景推广成任何享乐都无害或所有等待都已经安全。","focus":"从容有守正条件，酒食意象不等于沉溺享乐。"},{"label":"上六","text":"入于穴，有不速之客三人来，敬之终吉。","meaning":"进入穴中，有三位未受邀请的客人到来，恭敬接待则最终吉。意外来客不一定是侵害，如何应对是本爻的重点；不速之客与三人不能直接转为个人将遇贵人的预告。","focus":"最终吉与敬之相连，不替来客补造身份和善意。"}],"extra":null},{"n":6,"name":"天水讼","sym":"䷅","upper":"乾","lower":"坎","guaci":"有孚，窒惕，中吉，终凶。利见大人，不利涉大川。","theme":"争执与止争","summary":"讼不是给所有争议判同一输赢。卦辞写有孚而受阻、戒惧，中途止争吉，争到终局凶；六爻既有退归、改命，也有居中裁断的元吉和反复褫夺的警戒。应区分当事人、处置者与所得是否稳固，不能只见讼字便预告诉讼败北。","gt":"有诚信却受阻，应当警惕；在适当阶段止争可吉，争到底则凶。利于见有判断能力的大人，不利于涉越大河。这里强调争执的边界，不代替具体案件的事实与专业判断。","focus":"先分清是在争执、退让还是裁断的位置。不永所事、安贞与终朝三褫的差别，不可平均成一句有争议。","yao":[{"label":"初六","text":"不永所事，小有言，终吉。","meaning":"不把所争之事长久延续，虽有少许言语，最终吉。止争并不一定让人立刻免于议论，但有助于避免扩大纠缠；不能把不永所事理解为任何权利都不值得维护。","focus":"止争与小有言并存，不承诺退一步即可毫无代价。"},{"label":"九二","text":"不克讼，归而逋其邑人三百户，无眚。","meaning":"争讼不能取胜，退归避让，其邑三百户得以无眚。句读可有差别，基本图景是不能胜而退，保存所属之众；不能因为无眚就把不克讼改译成已赢得争议。","focus":"承认不克讼，理解退归的保存作用而不虚构胜诉。"},{"label":"六三","text":"食旧德，贞厉，终吉。或从王事，无成。","meaning":"安享旧有德业，守正虽有危险，最后吉；若参与王事，不以成就自居。文字强调依凭已有本分而不争功，危险与吉意并列，不等于依靠旧资格就能免除一切责任。","focus":"食旧德不是躺享保证，贞厉与终吉均须呈现。"},{"label":"九四","text":"不克讼，复即命渝，安贞吉。","meaning":"争讼不能取胜，返回接受命分并作改变，安定持守则吉。渝有改变之意，重点是从不克讼转向调整；不能只说认命，也不能抹去行为或判断需要改变这一层。","focus":"吉在返回与改正之后，不把固执争胜当成原意。"},{"label":"九五","text":"讼，元吉。","meaning":"处于讼的情境，元吉。传统阅读常将此爻联系居中得正的裁断位置；吉辞必须保留，但不能让每一位争议当事人都自动代入公正裁判或最终胜者的位置。","focus":"先辨角色与条件，不把元吉分配给争议双方。"},{"label":"上九","text":"或锡之鞶带，终朝三褫之。","meaning":"即使得到赏赐的鞶带，也可能一早晨被多次剥夺。所得反复而不稳，是本爻鲜明的警戒；不能凭曾获赏就保证名位长存，也不能把三次机械当作现实发生次数。","focus":"关注争来所得的脆弱，不把短暂得势写成终局。"}],"extra":null},{"n":7,"name":"地水师","sym":"䷆","upper":"坤","lower":"坎","guaci":"贞，丈人吉，无咎。","theme":"用众与责任","summary":"师以军队和用众为语境，强调纪律、主持者与指挥责任。卦辞的吉有贞与丈人的条件，六爻也明确写出失律、舆尸和误用人员的凶。学习时可观察组织怎样行动、由谁承担后果，不能把师卦解释成个人应当强行攻克他人。","gt":"守正，由有德望和能力的长者主持，则吉而无咎。丈人不是简单的年龄标签，吉辞不能脱离主持与组织条件，直接翻成任何竞争都能获胜。","focus":"分清组织纪律、指挥者与执行者。原文军事情境不构成现代强攻许可，人员称谓也不自动对应亲属排行。","yao":[{"label":"初六","text":"师出以律，否臧凶。","meaning":"军队出动须有纪律；否臧的具体释读有讨论，整体保留失律或处置不善所带来的凶。行动之初的秩序是本爻重点，不能只凭拥有队伍或热情就宣布准备充分。","focus":"先看出师的规则与秩序，不把凶淡化成小麻烦。"},{"label":"九二","text":"在师中，吉无咎，王三锡命。","meaning":"居军中主持事务，吉而无咎，王多次赐命。处在团队之中而能承担指挥责任，构成受到任命的图景；三锡不是现实晋升次数，王命也不自动等同任何领导的支持。","focus":"职责与任命相配，不凭吉辞推定现实已有授权。"},{"label":"六三","text":"师或舆尸，凶。","meaning":"军队可能载尸而归，凶。舆尸也有指挥失当的传统释读，但无论取哪一种，都不能删去严重不利的判断；同时不可把这幅军败图景直接转为个人死亡预言。","focus":"保留失败警戒，军中尸象不等于个人伤亡诊断。"},{"label":"六四","text":"师左次，无咎。","meaning":"军队退至左侧驻扎，无咎。左次通常从退驻、暂避理解，表示退一步也可能是适当部署；无咎并非已获胜，而是在不利或不宜进的情形下保存行动余地。","focus":"退驻可以合宜，但不把无咎写成战局已经获胜。"},{"label":"六五","text":"田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。","meaning":"田中有禽兽，利于执言，无咎；由长子统军，若让弟子载尸或处置失当，则贞凶。执言和舆尸有训释分歧，须保留主持者不同而后果不同的结构，不任意指认现实人物。","focus":"无咎与贞凶各有条件，不截取前半句判全爻吉。"},{"label":"上六","text":"大君有命，开国承家，小人勿用。","meaning":"大君发布命令，封建国邑、承继家业，但小人不可任用。事情告一段落后仍需辨明任人条件，不能把论功或分配视为全无风险；小人不是可随意贴给现实对象的标签。","focus":"成果安排仍须辨人任用，不从称谓直接判他人品行。"}],"extra":null},{"n":8,"name":"水地比","sym":"䷇","upper":"坎","lower":"坤","guaci":"吉。原筮元永贞，无咎。不宁方来，后夫凶。","theme":"亲比与择合","summary":"比讨论亲近、结伴与归属。卦辞有吉，也要求原筮与元永贞，且保留后来者之凶。六爻从有孚、由内亲比、亲比非人到无首，说明关系不是靠靠近便自然可靠。重点是所亲近者、相合依据及聚合方式，不能单凭比字认定两人互相喜欢。","gt":"吉。推原或再次审察所占之事，以元、永、贞的条件免于过失；尚未安定者前来，迟后者凶。原筮有不同解释，不应借此鼓励反复起卦直至得到想要的答案。","focus":"亲近须看信任、对象与秩序。有孚不等于现实对象已诚实，后夫也不宜直接解释为感情中的后来者。","yao":[{"label":"初六","text":"有孚比之，无咎。有孚盈缶，终来有它，吉。","meaning":"以诚信相亲比，无咎；诚信充盈如器皿，最终还会有别的吉利来到。盈缶的器物意象强调充实，不能只靠口头承诺代入有孚，也不能据它指定意外好运的形式。","focus":"信任的充实是条件，不把终来有它写成具体惊喜。"},{"label":"六二","text":"比之自内，贞吉。","meaning":"从内部建立亲比，守正则吉。内可联系自身或内部关系理解，重点在相合有内在依据而不失正；不能仅凭内字就认定亲属、同事或某个圈子必然值得相信。","focus":"由内而合仍需守正，不让亲近关系替代核查。"},{"label":"六三","text":"比之匪人。","meaning":"亲比的对象不合宜。经文没有另加吉凶字，却明确提出所比非人的问题；必须关注相合对象与依据，不凭这一短句就给现实中的某个人定性为骗子或恶人。","focus":"把对象是否合宜列为待核，不直接作人格定罪。"},{"label":"六四","text":"外比之，贞吉。","meaning":"向外建立亲比，守正则吉。它与六二由内相对，说明向外求合本身并非错误；关键仍在正当、合宜，不能把外部关系一概说成机会，也不能因外字断定出行。","focus":"内外都可以有吉，判断落在守正与具体关系上。"},{"label":"九五","text":"显比，王用三驱，失前禽，邑人不诫，吉。","meaning":"公开显明地亲比；王用三驱之礼，放过前方禽兽，邑人不受警诫，吉。图景重在聚合而不强取尽获，不能只抽取捕猎来理解，也不能把自愿归附说成全员服从。","focus":"关注不强求尽获的边界，不把显比变成控制他人。"},{"label":"上六","text":"比之无首，凶。","meaning":"亲比却无首，凶。无首有无所主持、失去开端等释读，均保留关系缺少合宜基础的警戒；不能因为用九也有无首二字，就把不同卦段的语境与吉凶混用。","focus":"同词要依本爻读，不能拿乾用九的吉来冲淡此凶。"}],"extra":null},{"n":9,"name":"风天小畜","sym":"䷈","upper":"巽","lower":"乾","guaci":"亨。密云不雨，自我西郊。","theme":"蓄养与未发","summary":"小畜以密云未雨表现有所积聚而尚未充分施展。全卦有亨通之辞，却不许诺蓄到一定时候必然得到所求；车轮脱落、夫妻反目与末爻征凶也在其中。学习时应观察约束、信任和积蓄怎样形成，分清适当收束与已过其度。","gt":"亨通。云已浓密却尚未降雨，从我西郊而来。云雨是蓄而未发的画面，不能直接当气象预报，也不能据此推定某段关系只是暂缓而最后一定落实。","focus":"把积蓄、牵制与时机一起看。卦辞未雨和上爻既雨形成对照，但不能强排成每件事必经的时间表。","yao":[{"label":"初九","text":"复自道，何其咎？吉。","meaning":"回到自己的道路，哪里会有过咎，吉。返复在此有合宜的意味，重点是回到正当路径而非一味往前；不能因复字便说某个旧人将返回，也不能推定所有退回都正确。","focus":"先问返回的是什么道路，不把复字直接套成复合。"},{"label":"九二","text":"牵复，吉。","meaning":"受到牵引而一同返回，吉。与初爻独自复道相比，这里有相互联系的返复；可以理解为不孤行的调整，但牵引者是否可靠、现实中该不该跟随，仍须实际核查。","focus":"牵复有相联之意，不将跟随本身判为永远有利。"},{"label":"九三","text":"舆说辐，夫妻反目。","meaning":"车的辐或相关部件脱落，夫妻反目。说通脱，古字及器物细节有版本讨论，基本图景是承载失效并出现关系对立；不可据此断任何得卦者都会夫妻失和。","focus":"器具失用与关系冲突并列，不把反目淡化为甜蜜磨合。"},{"label":"六四","text":"有孚，血去惕出，无咎。","meaning":"有诚信，血害离去，戒惧得以脱出，无咎。这里的信与脱险相连，不能只把有孚当成对某人的品行认证；血的意象也不能直接用来判断健康或实际伤势。","focus":"保留原文脱险的条件，不凭有孚证明他人可靠。"},{"label":"九五","text":"有孚挛如，富以其邻。","meaning":"以诚信紧密相联，并与邻人分享或共同拥有富足。富以其邻可有不同句意处理，均强调富足与相邻关系并置；不能据此推定现实邻居、朋友会提供金钱支持。","focus":"诚信与联结是主题，不把邻人意象变成借贷依据。"},{"label":"上九","text":"既雨既处，尚德载。妇贞厉，月几望，君子征凶。","meaning":"雨已落，积蓄暂得安处，崇尚德行的承载；随后又写妇贞厉、月将满、君子出征凶。完成与戒止同在，不能把既雨既处译成一切大功告成，更不能删除后半警戒。","focus":"达到一定程度后仍宜辨明止境，特别保留君子征凶。"}],"extra":null},{"n":10,"name":"天泽履","sym":"䷉","upper":"乾","lower":"兑","guaci":"履虎尾，不咥人，亨。","theme":"践履与涉险","summary":"履以踩虎尾而未被咬的图景，讨论临近风险时的行动方式。卦辞有亨，六爻却明确区分素履、幽人、逞能、戒惧与决然履行的不同后果。不能把有险最终无事当作普遍保证，重点应放在能力是否相称、态度与位置是否合宜。","gt":"踩到虎尾而虎没有咬人，亨通。句中既有涉险，也有未受伤害的结果；它不是现实中可以冒险的许可证，具体条件还需连同爻辞辨认。","focus":"本卦不只是谨慎二字，六三的逞能、九四的戒惧和九五的决履须分别理解，不能相互代替。","yao":[{"label":"初九","text":"素履，往无咎。","meaning":"以朴素的方式践履，前往无咎。素履可从不加矫饰、守本分入门理解；它支持合宜前往，而非要求夸大姿态。无咎也不是保证事情必成或行动没有现实成本。","focus":"朴素而合宜是重点，不把无咎等同无风险或必成。"},{"label":"九二","text":"履道坦坦，幽人贞吉。","meaning":"所走道路平坦，幽静自处之人守正则吉。幽人不是固定职业或性格标签，文字将平坦、安静自守与吉相连；不能只因自己不爱社交就自动代入全部有利条件。","focus":"守正与处境须相配，不用幽人称谓自认必吉。"},{"label":"六三","text":"眇能视，跛能履，履虎尾咥人，凶。武人为于大君。","meaning":"视力有缺却自以为能看，腿有缺却自以为能行，踩虎尾而被咬，凶；又写武人居大君之位。能力与所承担位置不相称，是可读线索，不应用身体差异羞辱现实人物。","focus":"警戒在逞能与位能失配，不是对残障者作价值评判。"},{"label":"九四","text":"履虎尾，愬愬终吉。","meaning":"踩到虎尾，战战兢兢，最终吉。与六三同样临险，回应方式却不同；戒惧不是装饰性的情绪，而与结果相联系。不能把终吉抽离出来，鼓励忽视危险继续冒进。","focus":"有戒惧才可读终吉，不能用结尾消除开头的险。"},{"label":"九五","text":"夬履，贞厉。","meaning":"决然地践履，守正仍有危险。夬有决断之意，说明意志坚定不自动免险；即使认为自己正当，也须保留贞厉的提醒，不能将决断等同绝对正确或没有反作用。","focus":"坚定与危险可以同在，不把贞厉改写成必胜。"},{"label":"上九","text":"视履考祥，其旋元吉。","meaning":"回看自己的行履，考察所致征象；其旋元吉。旋的解释有回转、周全等讨论，重点是完成后仍须检视行为与后果，不能只凭自我感觉良好就宣布得到验证。","focus":"以行履及后果作检视，不把祥字直接当好运证明。"}],"extra":null},{"n":11,"name":"地天泰","sym":"䷊","upper":"坤","lower":"乾","guaci":"小往大来，吉亨。","theme":"相通与防变","summary":"泰呈现交往相通、条件舒展的局面，但并非永久的好卦标签。九三已经提醒无平不陂、无往不复，上六则写城复于隍。阅读重点既是通畅怎样建立，也包括如何容纳、联结与辨识变动，不能因当前有利就忽略局势会改变。","gt":"小的离去，大的到来，吉而亨通。大小在传统解释中可联系阴阳或势力消长，不宜直接等同某笔钱或某个人；经文表达顺畅之意，但没有永久成功的承诺。","focus":"保留泰的正向总意，同时逐爻看通畅的条件。帝乙归妹是历史性意象，不能直接保证个人婚恋落实。","yao":[{"label":"初九","text":"拔茅茹，以其汇，征吉。","meaning":"拔起茅草，根相牵连，同类一起前行，征吉。茹与汇呈现相连相聚的图景，进展不只靠孤身行动；但同伴是否有共同基础，不能仅凭此象就推定已经同心。","focus":"看共同基础与连带，不把结群本身当作吉的保证。"},{"label":"九二","text":"包荒，用冯河，不遐遗，朋亡，得尚于中行。","meaning":"包容荒远，能够涉河，不遗漏远处，也不拘于朋党，因而合于中行。冯河、朋亡等字句有释读差异，本册取宽容而有中道的整体线索，不译成鲁莽涉险或背弃朋友。","focus":"包容要与中行相配，不从冯河推出可以冒险。"},{"label":"九三","text":"无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。","meaning":"没有永远平坦而不转斜的局面，也没有只往不返的变化；艰难中持守可无咎，不必忧虑其信，饮食有福。变化与福分并列，不应只保留忧患或只保留享福。","focus":"顺境中保留转变意识，不能把周期语句当精确时间表。"},{"label":"六四","text":"翩翩，不富以其邻，不戒以孚。","meaning":"翩翩而来，不凭财富而与邻人相联，不待警戒已有信任。文字呈现联结不全靠财力与强制的图景；不能据此断现实同伴无需沟通、契约或核验便自然可靠。","focus":"信任不以富强取，但现实合作仍需明确约定。"},{"label":"六五","text":"帝乙归妹，以祉元吉。","meaning":"帝乙嫁妹，以此得福，元吉。经文用王室婚嫁呈现有利的结合，但其具体历史指涉有讨论；不能把原有婚嫁吉辞删去，也不能直接许诺现实对象将与你结婚。","focus":"保留婚嫁元吉的原意，个体关系仍不由卦代作同意。"},{"label":"上六","text":"城复于隍，勿用师，自邑告命，贞吝。","meaning":"城墙倒回城壕，不宜用兵，应从自己的邑中发布命令，守正仍有吝。原本的防护与秩序发生逆转，回应须受限；不能因本卦称泰就把这一明确警戒解释成继续强攻。","focus":"正视失守与勿用师，不能借泰名掩盖末爻限制。"}],"extra":null},{"n":12,"name":"天地否","sym":"䷋","upper":"乾","lower":"坤","guaci":"否之匪人，不利君子贞，大往小来。","theme":"闭塞与转否","summary":"否的主题是交往闭塞、条件不通，卦辞对君子守正提出不利处境。六爻并非全写绝望：守正、受命、休否与倾否各有不同位置和条件。学习时既不淡化阻隔，也不把否当作永远失败，更不能从闭塞推出他人已经蓄意欺骗。","gt":"闭塞之世，不合宜的人事使君子持守正道不利，大的离去、小的到来。匪人的训释有讨论，宜保留不利的人事环境之意，不拿它直接给某个现实人物定性。","focus":"先承认闭塞，再看各爻应对。休否与倾否不是由卦名即可保证发生的转机，须保持各自的位置条件。","yao":[{"label":"初六","text":"拔茅茹，以其汇，贞吉亨。","meaning":"拔茅连根，同类相牵，守正则吉而亨。与泰初爻相似的图景，在这里落于贞而非征；因此相连不一定是立即出进，重点是共同守持合宜的原则与立足点。","focus":"注意本爻是贞吉亨，不把泰初爻征吉直接移用。"},{"label":"六二","text":"包承，小人吉，大人否亨。","meaning":"包容承顺，小人可得吉，大人处否而亨。句中不同角色的吉亨不能混成同一个评价；传统常从不同处世方式理解，大人的不合流也可能保全其道，不等于现实身份高便必吉。","focus":"角色与取舍不同，不把小人与大人贴给具体对象。"},{"label":"六三","text":"包羞。","meaning":"包藏或承受羞耻。文字极短，突出羞的处境，没有给出确定转机与时间；可以保留行为、位置不相称的反思，但不能据此编造某人暗藏丑事或内心羞愧。","focus":"只说明包羞的警戒，不把短辞扩成隐情侦查结论。"},{"label":"九四","text":"有命无咎，畴离祉。","meaning":"有所受命而无咎，同类也相随得福。命与祉构成取得正当依据后分享福分的画面；这里不是自行冒称受命，也不能以卦辞代替现实的授权、同意或合法程序。","focus":"命须有依据，不能用无咎替未经授权的行动背书。"},{"label":"九五","text":"休否，大人吉。其亡其亡，系于苞桑。","meaning":"使闭塞止息，大人吉；仍反复警觉将亡，如系在丛生桑树上一般求其牢固。转好时也须维持警戒，不能只截休否的吉意，说障碍已永久解除或无需再检验。","focus":"休否与其亡其亡应当一起读，转好后仍须警醒巩固。"},{"label":"上九","text":"倾否，先否后喜。","meaning":"闭塞被倾覆，先有否塞，后来有喜。原文有明确由阻转喜的表达，应保留其正向变化；但它没有指定发生日期，也没有证明现实问事一定已经走到本爻的位置。","focus":"保留后喜而不保证时点，更不把任何等待都称将成。"}],"extra":null},{"n":13,"name":"天火同人","sym":"䷌","upper":"乾","lower":"离","guaci":"同人于野，亨。利涉大川，利君子贞。","theme":"同道与公合","summary":"同人并非只指亲密关系，而是人与人如何在共同目标下相合。卦辞强调于野、涉川与君子贞，爻辞却有宗族局限、伏兵相疑、攻而不克和先哭后笑。共同体可能开放也可能排他，不能单凭卦名就断两人相爱、合作无碍。","gt":"在旷野与人相同，亨通；利于渡大河，利于君子守正。于野可读作超出私门的开阔结合，涉川仍需合宜条件，不能把同人解释成只要结伴就能成功。","focus":"分别观察门、宗、莽、墉与郊的范围。相合的对象与方式会改变判断，不能将所有同人都视为同样有利。","yao":[{"label":"初九","text":"同人于门，无咎。","meaning":"在门外与人相合，无咎。门作为内外交界，呈现由私内走向交往的开端；原文未指定双方的情感或利益，不能从一次接触便推断对方已经认同长期关系。","focus":"无咎的交往开端不等于已形成稳定的共同承诺。"},{"label":"六二","text":"同人于宗，吝。","meaning":"只在宗族或同宗范围中求同，有吝。亲近者相合未必错误，但范围过窄会有局限；不能据此全面否定家庭，也不能以同宗之名认定某群体天然更可靠。","focus":"看到求同范围的局限，不把熟悉误作充分信任。"},{"label":"九三","text":"伏戎于莽，升其高陵，三岁不兴。","meaning":"兵戎埋伏在草莽中，又登高窥望，三年不能兴起。相疑与对抗使行动难发，不能只用同人总义包装成合作在即；三岁是原文时段，不直接作为个人事件倒计时。","focus":"承认潜伏敌意的文本图景，不据此认定现实阴谋。"},{"label":"九四","text":"乘其墉，弗克攻，吉。","meaning":"登上城墙，却不能攻取，吉。攻势受止在此获得吉的评价，可从停止不合宜争夺理解；不能把弗克攻说成已经战胜，也不能从吉字推出所有攻击都应继续。","focus":"注意此处的吉可能来自停止攻击，而非取得原先所求。"},{"label":"九五","text":"同人先号啕而后笑，大师克相遇。","meaning":"相合之人先大哭，后来欢笑，大军克服阻碍而相遇。聚合经历阻隔是经文图景，喜意应保留；但不能将武力意象用于强迫关系，也不能保证现实两人终将重逢。","focus":"先哭后笑不等于所有关系必先苦后甜，仍有条件。"},{"label":"上九","text":"同人于郊，无悔。","meaning":"在郊外与人相合，无悔。郊是较外远的范围，可能带有有限而疏远的相合意味；无悔不同于元吉，不能自动扩成亲密无间、事事一致或共同事业必获成功。","focus":"保留有限相合与无悔，不把它提升为完全同心。"}],"extra":null},{"n":14,"name":"火天大有","sym":"䷍","upper":"离","lower":"乾","guaci":"元亨。","theme":"丰有与承载","summary":"大有呈现拥有较多条件与资源的局面，总体有明显通达之意。六爻关注避免交害、大车承载、德量是否足以胜任，以及诚信与威仪怎样相配。吉意不应被抹去，但拥有不等于可以任意挥霍，更不能从大有直接推定已经拥有他人的感情或同意。","gt":"大为亨通。原文简短而正向，说明本卦具有通达的总意；具体事项仍须看实际爻位与条件，不能把元亨翻译为每一种愿望都会实现。","focus":"先看所拥有之物是否能承载、怎样使用，再看信任与分寸。九三的小人不是对现实某人的自动品行判决。","yao":[{"label":"初九","text":"无交害，匪咎，艰则无咎。","meaning":"尚未与害相交，并无过咎；知道艰难、谨慎处置，才可无咎。艰字让顺境仍保留警惕，不能把未受害写成绝对安全，也不能只见大有便忽略对资源与关系的管理。","focus":"无交害不等于无风险，艰的自警条件不可删。"},{"label":"九二","text":"大车以载，有攸往，无咎。","meaning":"大车能够承载，适宜有所前往，无咎。载重与前行相配，是本爻的具体线索；有条件推进不同于保证抵达，不能据此证明某段关系已经具备双方的投入与意愿。","focus":"承载能力与有所前往并读，不把无咎写成结果必成。"},{"label":"九三","text":"公用亨于天子，小人弗克。","meaning":"公侯得以在天子处参与宴享或贡献，小人不能胜任。亨在此涉及享的读法，重点是所处礼遇与承担能力相称；不能把天子、公侯直接替换为恋爱中的男女角色。","focus":"保留胜任条件与小人弗克，不凭人设指定谁属小人。"},{"label":"九四","text":"匪其彭，无咎。","meaning":"不以盛大自居，无咎。彭通常从盛、多理解，也有其他训释；入门可抓住丰有而不夸张显势的分寸，不把收敛误读成必须放弃所有资源或机会。","focus":"有而不自盛是学习线索，歧义字不作唯一训诂。"},{"label":"六五","text":"厥孚交如，威如，吉。","meaning":"诚信可以交相感通，又有合宜威仪，吉。亲和与威不是相互排斥，重点在信任中仍有秩序与分寸；不应译成靠强势使人服从，也不能凭有孚认定现实对象诚实。","focus":"信与威并存，不把尊重边界改写成控制他人。"},{"label":"上九","text":"自天佑之，吉无不利。","meaning":"得到天的佑助，吉而无不利。原文吉意很强，应完整呈现；但天佑是经文的表达方式，不构成现实可验证的安全担保，也不能用它取消同意、准备与事实核查。","focus":"保留强吉辞，同时区分经文表达与现实结果保证。"}],"extra":null},{"n":15,"name":"地山谦","sym":"䷎","upper":"坤","lower":"艮","guaci":"亨，君子有终。","theme":"谦抑与合宜","summary":"谦讨论有能力而不自满、处事有分寸。卦辞称君子有终，六爻也多有吉利文字，却同时存在侵伐、行师等不只是退让的表达。不能把谦概括为对任何人都低头，也不能把军事语句变成强制他人的许可；重点是谦德与合宜行动怎样相成。","gt":"亨通，君子能够有终。谦抑与完成相连，保留明确正向意义；有终不等于所有目标必达，更不是承受不公平便自然得到补偿的保证。","focus":"谦有主动施行与承担的一面，不是取消自主。行师、侵伐须留在古代语境中理解，不直接用于现实关系。","yao":[{"label":"初六","text":"谦谦君子，用涉大川，吉。","meaning":"谦而又谦的君子，可以用这样的态度涉越大川，吉。谦不是毫无行动能力，而可与承担困难同行；涉川的支持仍以其人其行为条件，不能推成任何风险都值得尝试。","focus":"谦抑可以支持行动，不把它理解为永远退避。"},{"label":"六二","text":"鸣谦，贞吉。","meaning":"谦德有所表达、为人知闻，守正则吉。鸣谦可从谦意外显理解，并非只准沉默；但声称自己谦虚不等于已经有谦德，吉仍保留贞的条件。","focus":"表达谦意与自我标榜不同，不能只靠称谓代入。"},{"label":"九三","text":"劳谦，君子有终，吉。","meaning":"有功劳而谦抑，君子能有终，吉。功与谦同时保留，不要求否认已经完成的工作；本爻的重点是有劳不自满，而非做事者不应获得承认或合理报酬。","focus":"谦抑不抹去已有功劳，也不意味着应当放弃合理权益。"},{"label":"六四","text":"无不利，撝谦。","meaning":"没有什么不利，应施行谦抑。撝有挥施、发挥等释义，可从将谦落实在行为中理解；不能只保留无不利，忽略行动方式，也不宜把撝字裁定为唯一现代动作。","focus":"无不利连着施行谦抑，具体做法仍须体现行为分寸。"},{"label":"六五","text":"不富以其邻，利用侵伐，无不利。","meaning":"不凭富有而与邻人相联，利于侵伐，无不利。谦卦在这里并不排斥必要处置，但原文军事语境不能直接授予现代行动正当性，更不能拿来强迫关系对象服从。","focus":"谦有处置的一面，使用权力仍须现实合法依据。"},{"label":"上六","text":"鸣谦，利用行师，征邑国。","meaning":"谦意有所声闻，利于出师，征伐邑国。行动指向的范围在原文中受到具体限定，不能抽象成对外强攻皆宜；谦也不是要求对失序永远不作回应。","focus":"保留原有行动范围，不用谦名掩盖或扩大战争语句。"}],"extra":null},{"n":16,"name":"雷地豫","sym":"䷏","upper":"震","lower":"坤","guaci":"利建侯行师。","theme":"悦豫与动员","summary":"豫有悦豫、预备与响应的学习线索，卦辞所说建侯行师又带组织动员的语境。六爻不把快乐一概判吉：鸣豫凶、盱豫悔、冥豫须改变，九四则有大有得。重点在悦豫是否有节、能否及时辨别，而不是将兴奋当作事情必成的证据。","gt":"利于建立侯长、出师行动。原文支持有组织的建置与动员，不等于个人一兴奋就可推进，更不意味着现实冲突可以用武力解决。","focus":"分辨众人响应与个人沉溺。六五的疾与不死是经文处境描述，不能用作疾病诊断或生死保证。","yao":[{"label":"初六","text":"鸣豫，凶。","meaning":"把悦豫张扬出来，凶。喜悦的表达在这一位置受到警戒，不应拿全卦豫字为它开脱；但这不等于任何公开高兴都错，仍须分清本爻所示过早或自满的处境。","focus":"喜悦不自动等于有利，原文凶字需如实保留。"},{"label":"六二","text":"介于石，不终日，贞吉。","meaning":"坚介如石，不到一日便能辨明应对，守正则吉。介有坚贞、辨界的意味，重点是清醒而不迟疑；不终日不是给任何现实事项规定一天以内见结果。","focus":"及时辨识而有持守，不把不终日机械当应期。"},{"label":"六三","text":"盱豫，悔。迟有悔。","meaning":"仰望他人而求悦豫，有悔；迟疑拖延也有悔。盱的具体释义可有讨论，但两处悔都须保留，不能把及时与否简单翻成越快越好，重点仍是依附与判断失当。","focus":"不要只从迟有悔推出立即行动，前半同样有悔。"},{"label":"九四","text":"由豫，大有得，勿疑。朋盍簪。","meaning":"成为悦豫与响应的由来，大有所得，不要疑惧，朋友聚合如簪。朋盍簪有聚合的意象，显示能形成共同响应；不能把勿疑扩大成无需核查任何人或承诺。","focus":"共同聚合有其依据，勿疑不等于取消必要的事实检验。"},{"label":"六五","text":"贞疾，恒不死。","meaning":"长久处于病困，却仍不死。贞疾的贞也有不同解释，宜保留受困而延续的图景，不把恒不死视为医学保证，也不反向据疾字认定当事人正在患病。","focus":"困而未绝不等于健康安全，不用经文预测生死。"},{"label":"上六","text":"冥豫，成有渝，无咎。","meaning":"昏沉于悦豫之中，事情已经形成，若能改变，可无咎。渝是本爻转折，不能只抓无咎继续沉溺；同时允许纠正，不应因为已经失误便宣称无法挽回。","focus":"无咎依赖改变，不以最终宽缓掩盖昏沉问题。"}],"extra":null},{"n":17,"name":"泽雷随","sym":"䷐","upper":"兑","lower":"震","guaci":"元亨利贞，无咎。","theme":"随从与取舍","summary":"随讨论跟随什么、怎样随时而动。卦辞保留亨利贞与无咎，爻辞则以系小子失丈夫、系丈夫失小子展示选择的排他性；有所获也可能贞凶。学习重点不是一味服从，而是跟随对象、诚信与道路是否合宜，不能用随字要求别人顺从自己。","gt":"有开创通达、利于守正的意味，无咎。随的有利以合宜持守为条件，不是任何追随、迁就或从众都会得到好结果。","focus":"关注选择一种联结同时失去什么。有获与贞凶可同时出现，不能仅凭获得关注或利益就判断正确。","yao":[{"label":"初九","text":"官有渝，贞吉。出门交有功。","meaning":"所主之事有所改变，守正则吉；出门交往有所成就。官有渝可有职事或主持方式转变的理解，重点是改变中仍有正当依据，不可直接据官字预测调职或升迁。","focus":"变化与交往都有条件，不把出门交直接当贵人运。"},{"label":"六二","text":"系小子，失丈夫。","meaning":"牵系于小子，就失去丈夫。人物称谓呈现不同依附之间的取舍，不宜未经语境就认作年龄较小与较大的恋人；本爻没有说所有关系都能兼得。","focus":"抓住取舍结构，不以年龄或性别标签指认对象。"},{"label":"六三","text":"系丈夫，失小子。随有求得，利居贞。","meaning":"牵系于丈夫，失去小子；跟随而有所求可以得到，利于安居守正。与六二相对，获得仍有失去和居贞条件；不能只读求得便保证所有期待都能满足。","focus":"所得与所失应当并列呈现，利于居贞的条件也不可省略。"},{"label":"九四","text":"随有获，贞凶。有孚在道，以明，何咎。","meaning":"跟随而有所获得，守占却凶；若有诚信、行于正道并明察，又有什么过咎。此爻有明确的条件转换，不能把获利等于吉，也不能删去后半可以无咎的要求。","focus":"获利不自动证明正当，须逐项看信、道与明。"},{"label":"九五","text":"孚于嘉，吉。","meaning":"诚信依于美善，吉。嘉所指是值得信从的善，而非自己偏爱的东西；这里的吉需与所信对象是否合宜相连，不能凭本爻就宣布某个现实对象或观点已被认证。","focus":"信要有所善，不把偏爱当成值得相信的证据。"},{"label":"上六","text":"拘系之，乃从维之。王用亨于西山。","meaning":"将其拘系，又维系跟从；王在西山行享祭。亨在此可按享理解，拘系与从维的关系有不同释读，宜保留紧密系属与祭享图景，不转成控制他人的行动指令。","focus":"承认系属语境的歧义，不将拘系合理化为关系控制。"}],"extra":null},{"n":18,"name":"山风蛊","sym":"䷑","upper":"艮","lower":"巽","guaci":"元亨，利涉大川。先甲三日，后甲三日。","theme":"积弊与整治","summary":"蛊关乎积久而成的问题及其修整。卦辞有亨与涉川，也要求围绕甲日前后作准备，六爻用父母之蛊呈现承接旧事的不同方式。干蛊、宽纵与不事王侯并非同一路径；不能只见整治便宣布旧问题必可恢复，也不应把责任一律归咎父母。","gt":"大为亨通，利于涉越大河；甲日前三日、甲日后三日。甲日与前后的具体历法、象征解释有分歧，本册保留整治需顾及前后程序的线索，不据此替现实问事计算日期。","focus":"把修整的对象、力度与承接方式分开。父母称谓是原文脉络，不自动证明家庭中确有过错或遗留隐情。","yao":[{"label":"初六","text":"干父之蛊，有子，考无咎，厉终吉。","meaning":"整治父辈留下的问题，有子能承接，父辈可免咎；虽然危险，最终吉。考通常指父，重点是后继者承担修整，而非证明现实父亲有罪，也不能省略整治过程的厉。","focus":"承担修整而非简单追责，厉与终吉都需保留。"},{"label":"九二","text":"干母之蛊，不可贞。","meaning":"整治母辈留下的问题，不可贞。此处传统常理解为不宜固执刚硬，须有合宜方式，并非许可不正；对母之蛊不能直接套性别性格判断，也不能取消必要的事实核查。","focus":"不可贞不等于可以不正，关注修整方式的分寸。"},{"label":"九三","text":"干父之蛊，小有悔，无大咎。","meaning":"整治父辈的问题，可能有少许悔，但没有大的过咎。改革并非全无代价，较小遗憾与避免大错并列；不能把无大咎理解成无需复查，亦不必因小有悔就否定全部修整。","focus":"小悔与无大咎有层次，不夸成完美也不全盘否定。"},{"label":"六四","text":"裕父之蛊，往见吝。","meaning":"对父辈的问题宽缓放任，继续前往会显出吝。裕在此不只是善意宽容，还可能使积弊未得处理；不能拿亲情或和气解释为越拖越好，也不凭本爻指定谁是过错方。","focus":"宽纵可能延续问题，不能把不处理美化成包容。"},{"label":"六五","text":"干父之蛊，用誉。","meaning":"整治父辈的问题，因而得到称誉。与前爻宽纵不同，本爻保留积极修整的正向评价；誉是经文的结果表达，不保证现实所有人都会赞同，也不等于不必审视方法。","focus":"称誉不能替代修整成效，勿只追求名声而漏实事。"},{"label":"上九","text":"不事王侯，高尚其事。","meaning":"不为王侯效事，以自己的事业或志行为高尚。它呈现不进入权势事务的另一选择，不等于所有退隐都高尚，也不能据此轻率否定现有责任或要求他人放弃工作。","focus":"不事王侯是一种取舍，不是逃避一切责任的通行证。"}],"extra":null},{"n":19,"name":"地泽临","sym":"䷒","upper":"坤","lower":"兑","guaci":"元，亨利贞。至于八月有凶。","theme":"临近与省察","summary":"临有接近、临察与临民的学习线索。卦辞先给出亨利贞，又提醒至于八月有凶；六爻区分真诚感通、甜言求临、切近、知临与敦临。重要的是接近方式与局面变化，不宜把临直接理解成某人即将到来，也不能将八月未经解释套为当年公历八月。","gt":"有开创通达、利于守正之意；到了八月有凶。八月的历法及卦气解释有讨论，学习时保留盛时仍须防变的警戒，不擅自换算为个人应期。","focus":"吉意与将来的警戒同时保留。临近不等于双方愿意，甜言与知临、敦临之间的差别比卦名更具体。","yao":[{"label":"初九","text":"咸临，贞吉。","meaning":"以相感的方式临近，守正则吉。咸有感通之意，也有其他训读，本册取相感入门；相感的经文意象不证明现实两人互有好感，仍须保留贞的条件。","focus":"感通须合宜，不把咸临直接当双方心意已确定。"},{"label":"九二","text":"咸临，吉无不利。","meaning":"相感而临近，吉，无不利。本爻吉意明确，应如实保留，但它并未列出具体人物与事件；不能只凭相感之象就许诺所有合作、感情或求取都会顺利落实。","focus":"保留明确吉辞，同时不补造特定对象与现实结果。"},{"label":"六三","text":"甘临，无攸利。既忧之，无咎。","meaning":"以甜美言辞临近，没有什么有利；若已为这种做法忧虑、警醒，可以无咎。转折在发现问题并改变，不能仅因言辞动听就判断可靠，也不能删去可改的余地。","focus":"此处无咎来自忧虑警醒，不是替甜言求合自动开脱。"},{"label":"六四","text":"至临，无咎。","meaning":"切近而到位地临察，无咎。至临强调接近与所处位置合宜，不能只从至字猜某人即将到场；现实中是否真正了解情况，仍需具体接触、观察和核查。","focus":"到位是理解线索，不把临字误当必然赴约信号。"},{"label":"六五","text":"知临，大君之宜，吉。","meaning":"以明智来临察，是大君适宜的方式，吉。知临关注判断与任用的合宜，不只是亲自包办；大君是原文角色，不能将自认有权或聪明直接视为具备本爻条件。","focus":"角色与判断能力要相配，不让职位替代实际认识。"},{"label":"上六","text":"敦临，吉无咎。","meaning":"敦厚而临近，吉，无咎。厚实、持续的关切与临察是可读线索，不是只凭热情表态；原文吉辞也不证明现实对象一定接受这种接近，仍须尊重对方边界。","focus":"敦厚不等于越靠近越好，关系中的边界仍需确认。"}],"extra":null},{"n":20,"name":"风地观","sym":"䷓","upper":"巽","lower":"坤","guaci":"盥而不荐，有孚颙若。","theme":"观察与自省","summary":"观既可指观看，也涉及被观看与示范。卦辞借盥洗而尚未荐祭的肃敬图景，六爻从童观、窥观展开到察己、观国与观其生，形成视野及责任不同的层次。学习重点是看见的范围与依据，不能把观解释成能够窥知他人未表露的内心。","gt":"盥洗之后、尚未进献祭品之时，有诚信而显出肃敬的样子。颙若是庄敬仰望的神态，句意着重仪式中的专诚，不是要求采用祭祀便能获得事实答案。","focus":"先辨观察的范围和自身位置。观我生与观其生的所指有解释空间，不可将任何一种释读当作读心工具。","yao":[{"label":"初六","text":"童观，小人无咎，君子吝。","meaning":"像童子一样观看，小人无咎，君子则吝。相同的有限视野，因角色责任不同而评价不同；不能把小人、君子直接等同人格高低，也不能据此轻视儿童或初学者。","focus":"判断关乎责任与视野是否相称，不是固定身份标签。"},{"label":"六二","text":"窥观，利女贞。","meaning":"从狭窄处窥看，利于女子守正。古代角色语境限制了视野的评价，现代学习应保留其局限而非推广性别规定；窥观也不能被美化为已经掌握全局。","focus":"狭窄视野应被识别，不用古代性别表达限制现代权利。"},{"label":"六三","text":"观我生，进退。","meaning":"观察自己的生活、作为或所生之效，以此决定进退。生的具体指向有不同释读，重点是反看自身而非只猜别人；进退应依观察结果，不是先定想法再找征兆印证。","focus":"先察己与所作后果，不把进退固定成一进一退。"},{"label":"六四","text":"观国之光，利用宾于王。","meaning":"观察国中的光彩与礼制，利于以宾客身份见王。它表达接触更广阔制度与文化的可能，不等于现实必有贵人或职位；是否值得参与，仍需考察实际内容与条件。","focus":"观其光还需辨其实，不用宾王意象保证受赏。"},{"label":"九五","text":"观我生，君子无咎。","meaning":"观察自己的生活、施为及其影响，君子无咎。处在较高位置时，自省也涉及所作对他人的结果，不能只靠自我感觉良好便宣布无咎，更不能拿卦替代反馈。","focus":"自省须含行为影响，无咎不由自我评价独自决定。"},{"label":"上九","text":"观其生，君子无咎。","meaning":"观察其生活、作为或所生之效，君子无咎。其所指可有不同解释，本册不作唯一裁定；重点仍是有依据地观察，不是凭卦猜他人动机，也不保证观察者没有偏差。","focus":"承认其字指向的歧义，观察不等于读心或定罪。"}],"extra":null},{"n":21,"name":"火雷噬嗑","sym":"䷔","upper":"离","lower":"震","guaci":"亨，利用狱。","theme":"辨明与除隔","summary":"噬嗑以咬合、咬开硬物为图景，联系阻隔的处理与刑狱。亨通不是说没有障碍，而是需要辨清、处置，使之能通。六爻同时写遇毒、艰贞与灭耳之凶，不能把任何冲突都解释成好事，更不能用刑罚语句代替现实法律程序。","gt":"亨通，利于处理刑狱之事。经文将辨明与处置置于重要位置，不能由此保证诉讼胜败，也不能直接说得此卦就一定会争吵或卷入案件。","focus":"咬除阻隔仍须分辨力度和层次。身体刑具意象是古代文本，不能当个人伤病预言或现代惩罚许可。","yao":[{"label":"初九","text":"屦校灭趾，无咎。","meaning":"脚上加了刑具，遮没脚趾，无咎。图景是初期以约束制止过失，不等于伤害越重越有利；本册只解释古文，不据此认可体罚，也不直接对应现实肢体损伤。","focus":"刑具语境须与现代行动分开，无咎不是施暴许可。"},{"label":"六二","text":"噬肤灭鼻，无咎。","meaning":"咬柔软的肉，深入到遮没鼻子的程度，无咎。灭鼻的具体取象可有讨论，基本呈现处理虽易却用力深入；不能只凭肉软就认定事情全无难度，也不预测鼻部受伤。","focus":"处理程度与对象相连，不把身体词句机械当病象。"},{"label":"六三","text":"噬腊肉，遇毒，小吝无咎。","meaning":"咬腊肉而遇到毒，有小吝但无咎。处理积久或不易入口之物时遭遇问题，是本爻的障碍；毒不必译成现实中毒，更不能因为结尾无咎就说过程完全没有代价。","focus":"小吝与无咎并读，不把遇毒扩成具体谋害事实。"},{"label":"九四","text":"噬干胏，得金矢，利艰贞吉。","meaning":"咬带骨的干肉，得到金属箭头；利于在艰难中守正，吉。硬物难处理，所得也不能脱离艰贞条件；金矢的象征解释另有讨论，不据此预言捡到财物。","focus":"此处吉与艰难守正相连，不把得金矢简单改成发财。"},{"label":"六五","text":"噬干肉，得黄金，贞厉无咎。","meaning":"咬干肉而得到黄金，守正仍有危险，无咎。黄金的中正等象征解释属进一步读法，入门先保留所得、贞厉与无咎的层次，不能用获利抵消处置中的责任与风险。","focus":"有所获得并非全无危险，贞厉的限定仍须完整呈现。"},{"label":"上九","text":"何校灭耳，凶。","meaning":"肩负刑具，遮没耳朵，凶。与初爻的较早约束相比，末爻呈现严重后果，不能将全卦亨通借来冲淡凶意；也不能因耳字就作健康诊断或预言现实受刑。","focus":"保留严重警戒，但不把古代刑罚图景当具体预报。"}],"extra":null},{"n":22,"name":"山火贲","sym":"䷕","upper":"艮","lower":"离","guaci":"亨，小利有攸往。","theme":"文饰与质实","summary":"贲讨论装饰、礼文与质实的相配。卦辞只说小利有所往，六爻从修饰足趾、胡须到丘园束帛，最后以白贲无咎收束。文饰不是天然虚假，朴素也不是必然高贵；应辨外在表达能否与实际内容相称，不凭外观便认定人品或结果。","gt":"亨通，小有利于有所前往。小利限定了推进的尺度，不能删去小字而扩大成任何大事皆宜；贲的主题在文饰，不是对华美外表的无条件赞许。","focus":"分辨装饰的对象、所处阶段与实质。婚媾、白马与束帛保留原文语境，不直接转换为个人婚期或礼物。","yao":[{"label":"初九","text":"贲其趾，舍车而徒。","meaning":"修饰自己的足趾，舍弃车辆而步行。文饰首先落在自身的行履，并出现舍与取的选择；不能只按贫富判断步行的意义，也不据此给现实出行方式规定吉凶。","focus":"装饰落实于行履，舍车而徒不等于出行禁令。"},{"label":"六二","text":"贲其须。","meaning":"修饰胡须。原文极简，传统常联系须随颐而动，说明文饰有所依附；这一层属于学习解释，不能从两三个字补出具体身份、容貌、恋情或将来的吉凶结局。","focus":"短辞不扩写隐情，依附关系只是可供理解的线索。"},{"label":"九三","text":"贲如濡如，永贞吉。","meaning":"文饰润泽，长久守正则吉。美好外观本身不被否定，但要有持久而合宜的内容支持；不能只看一时光鲜，也不能因重视装饰便预设其内在必定空虚。","focus":"长久守正是条件，不把润饰外观直接等同虚假。"},{"label":"六四","text":"贲如皤如，白马翰如，匪寇婚媾。","meaning":"文饰中见洁白，白马飞疾而来；并非盗寇，而是求婚者。原文有误认与辨明的转折，不宜把白马直接套成心仪对象，也不能据此否定现实中合理的安全核查。","focus":"看清匪寇婚媾的转折，不凭象认定来者身份。"},{"label":"六五","text":"贲于丘园，束帛戋戋，吝终吉。","meaning":"在丘园中作礼饰，束帛不多，虽有吝，最终吉。戋戋可有少薄等训释，重点是礼物与朴素情境的相配；不能把礼薄必吉推广成现实礼节和关系的一条定律。","focus":"吝与最终的吉意并存，不以礼物贵贱直接判断诚意。"},{"label":"上九","text":"白贲，无咎。","meaning":"以素白为文饰，无咎。经过诸种修饰而见朴素，是可供学习的收束，不等于所有颜色与装饰都错误；无咎也并非只要采用白色便可得到好运的形式规则。","focus":"白贲指向质实之美，不是颜色招吉的操作法。"}],"extra":null},{"n":23,"name":"山地剥","sym":"䷖","upper":"艮","lower":"坤","guaci":"不利有攸往。","theme":"剥落与保存","summary":"剥呈现基础逐步受损的处境，卦辞明确不利有所前往。床足、床辨、及肤把损害由外而近的程度写得具体，但六三、六五与上九又各有不同评价。应保留受损的警戒与有限保存，不把全卦解释成人人灾难，也不能淡化为必有新生。","gt":"不利于有所前往。文字清楚表示推进受到限制；它并未指定灾祸形式，也没有直接给出停止多久或何时转好的期限。","focus":"辨别受损的位置、范围与剩余基础。床及肤等意象不能直接用于疾病诊断，末爻也非保证剥尽必复。","yao":[{"label":"初六","text":"剥床以足，蔑贞凶。","meaning":"床从足部被剥损，正固受到侵蚀，凶。蔑贞有不同释读，本册先保留基础受损而不利的结构；不能因为损伤尚在下部就说问题微不足道，也不直接预告家宅事故。","focus":"基础处受损也须正视，不把凶美化成无害小变动。"},{"label":"六二","text":"剥床以辨，蔑贞凶。","meaning":"床的边框或床身部分被剥损，正固受损，凶。辨的器物所指可有细节分歧，仍可看出损害向上扩展；不宜凭此指定现实某个器物、人际关系或身体部位必将损坏。","focus":"损害范围较前深入，勿将器物位置硬套现实部位。"},{"label":"六三","text":"剥之，无咎。","meaning":"处于剥的过程而无咎。原文简短，没有附上具体修复方法；传统爻位解释可帮助讨论脱离剥损的一面，但不能由无咎直接补出所有损失可挽回或现实对象会相助。","focus":"保留局部无咎，不擅加未写的解决过程与结局。"},{"label":"六四","text":"剥床以肤，凶。","meaning":"剥损床铺已到肌肤，凶。损害已迫近自身，警戒比仅在床足更直接；本爻没有提供可将凶转吉的条件，不应迎合性淡化，也不能据肤字诊断疾病或预报伤亡。","focus":"正视迫近之害，不将凶改成只是成长的代价。"},{"label":"六五","text":"贯鱼，以宫人宠，无不利。","meaning":"鱼贯成列，以宫人受宠的方式相从，无不利。原文用秩序与宫人关系作图景，不宜直接转为现代后宫或性别等级主张；这是剥中另一个位置的评价，不能泛化全卦皆吉。","focus":"无不利仅属本爻语境，不以宫人意象评判现实女性。"},{"label":"上九","text":"硕果不食，君子得舆，小人剥庐。","meaning":"硕大的果实未被吃掉，君子得到车舆，小人剥去屋庐。仍有保存之物，但不同承接方式导致不同结果；不能只读硕果就保证最后全获补偿，也不能自行认定谁是小人。","focus":"保存与失所并列，勿用硕果意象承诺所有损失会补回。"}],"extra":null},{"n":24,"name":"地雷复","sym":"䷗","upper":"坤","lower":"震","guaci":"亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。","theme":"返回与改过","summary":"复以返回、复始为主题，卦辞有出入无疾、朋友来与利有所往。六爻把不远而复、反复而复、独复、敦复与迷复区分开，说明返回并非天然正确。它可以用于理解修正方向，却不能单凭卦名保证旧人回头，也不能把七日来复直接作为复合日期。","gt":"亨通，出入没有疾害，朋友前来无咎；往返有其道路，七日而复，利于有所前往。七日的周期与象征解释有分歧，保留原文，不擅自套为个人事件的精确期限。","focus":"先问返回的是道路、行为还是旧习，不能把所有回头都称吉。尤其不远复与迷复的评价截然不同。","yao":[{"label":"初九","text":"不远复，无祗悔，元吉。","meaning":"走得还不远就返回，不至于形成大的悔失，元吉。祗有不同训读，基本线索是早察早改；不能据此说错误无关紧要，也不能只因对方再次联系就认定已经改正。","focus":"返回须有纠正内容，不把重新出现当作真正转变。"},{"label":"六二","text":"休复，吉。","meaning":"以美好、安和的方式返回，吉。休在此可从美善理解，文字支持合宜的回归；它没有说明是某个人回到身边，也没有保证回到原状态便自然优于作出新选择。","focus":"复的对象要核实，不把吉辞直接套成旧情复燃。"},{"label":"六三","text":"频复，厉无咎。","meaning":"频繁失而复返，有危险，但可无咎。反复中的危险仍在，不能把允许改正理解为可以不断犯同样错误；无咎也不证明多次道歉已足以恢复现实中的信任。","focus":"频繁反复需要识别原因，原文的厉不因无咎而消失。"},{"label":"六四","text":"中行独复。","meaning":"在众人同行之中，独自返回。经文没有另列吉凶，重点是虽处群体仍能作不同取向；不能把独行自认清醒当证据，返回是否合宜还须检验所据原则与事实。","focus":"独复不等于孤立的选择必然正确，须说清返回依据。"},{"label":"六五","text":"敦复，无悔。","meaning":"敦厚诚实地返回，无悔。转回不只是表面姿态，还应有稳定、切实的内容；不能从无悔推出所有后果均可取消，也不能将一个承诺当成已经完成的行为改变。","focus":"敦复要看持续行为，不以一句保证认定已经落实。"},{"label":"上六","text":"迷复，凶，有灾眚。用行师，终有大败，以其国君凶，至于十年不克征。","meaning":"迷失了返回的方向，凶，有灾眚；若用以行师，将有大败，国君亦凶，十年不能出征。警戒强烈，不能改成只需耐心；十年与军败仍属原文语境，不作个人灾难倒计时。","focus":"保留严重不利，不把迷复包装成注定先苦后甜。"}],"extra":null},{"n":25,"name":"天雷无妄","sym":"䷘","upper":"乾","lower":"震","guaci":"元亨利贞。其匪正有眚，不利有攸往。","theme":"不妄与意外","summary":"无妄涉及真实、不妄为，也容纳无端之灾的情境。卦辞有亨利贞，却紧接匪正有眚、不利前往；六爻也不是一概支持行动。学习重点在行动是否合宜、哪些后果并非完全由本人造成，不能把真诚等同免受损失，更不能将勿药解释成医疗建议。","gt":"有通达、利于守正之意；若不合正道则有灾眚，不利有所前往。无妄不能只译作什么都不用担心，卦辞自己已经保留了偏离与行动受限的警戒。","focus":"将正当性、可控行动与外来意外分开。六二耕获语句有歧义，不据此鼓励不劳而获或投机。","yao":[{"label":"初九","text":"无妄往，吉。","meaning":"无妄地前往，吉。正向行动与不妄为相连，不等于只要自认真诚便可行动；现实中是否尊重事实、同意与边界，仍需核查，不能拿本爻免去这些条件。","focus":"不妄的条件要具体，不以主观善意替代合宜性。"},{"label":"六二","text":"不耕获，不菑畬，则利有攸往。","meaning":"经文把不耕而获、不菑而畬与有所往相连，句读及否定范围有分歧。可从不预设获利而从事实事理解，但不裁定唯一训诂，更不能读成无需耕作便必有收获。","focus":"保留耕获训释分歧，不把它当不劳而获的承诺。"},{"label":"六三","text":"无妄之灾，或系之牛，行人之得，邑人之灾。","meaning":"无妄而遭灾：有人系着牛，被路人取走，邑人反受其灾。得与失落在不同主体，说明无辜也可能受牵连；不能反推受损者必有过错，也不凭此指认现实盗取者。","focus":"区分获利者与受灾者，不以结果倒推道德责任。"},{"label":"九四","text":"可贞，无咎。","meaning":"可以持守，无咎。原文没有增加特定动作与期限，宜理解为合宜的持守能够免咎；不能扩成什么都不做才对，也不能说所有既有决定无需复查。","focus":"所守的内容需要合宜，无咎不免除必要的复查与纠错。"},{"label":"九五","text":"无妄之疾，勿药有喜。","meaning":"无妄而有疾，不用药则有喜。经文保留特定处境下不妄加干预的图景，但不能据此推断实际病因或停药；现实治疗必须依医学事实与专业指导，勿药不能直接照做。","focus":"古文勿药不是现代医嘱，不能据卦停止治疗。"},{"label":"上九","text":"无妄行，有眚，无攸利。","meaning":"在此仍无妄而行动，会有灾眚，没有什么有利。与初爻往吉不同，位置与处境改变后行动受限；不能仅凭自己无恶意就断行动必对，也不宜淡化无攸利。","focus":"善意不保证时机合宜，原文不利行动须完整保留。"}],"extra":null},{"n":26,"name":"山天大畜","sym":"䷙","upper":"艮","lower":"乾","guaci":"利贞，不家食吉，利涉大川。","theme":"蓄养与节制","summary":"大畜关注力量、能力与资源的积蓄，也关注怎样适时约束。卦辞有涉川与不家食的吉意，爻辞却先言有厉利已、车部件脱落，后来才见训练与通衢。蓄养并非越压抑越好，而是停止、准备、释放各有位置，不能直接当作事业升迁保证。","gt":"利于守正，不在家中自食则吉，利于渡大河。不家食可联系出而任事、受养于外等语境理解，并非居家就凶；有利行动仍需积蓄与准备的条件。","focus":"辨清止、练与通的不同阶段。牛牿与豕牙是制约力量的古代意象，不构成支配他人或惩罚动物的建议。","yao":[{"label":"初九","text":"有厉利已。","meaning":"有危险，利于停止。已按止理解，原文对行动的限制明确；不能用全卦利涉川盖过本爻的停止，也不能把利已误认成只有自己的利益才重要。","focus":"先读有厉利止，不用总卦吉意冲淡当前止步条件。"},{"label":"九二","text":"舆说輹。","meaning":"车辆下部的輹脱落，行动不能正常承载。輹与其他车部件有器物训释问题，重点是暂停而未能前行；不把器具意象直接化为现实车祸，也不补出立即修复的保证。","focus":"未能前行不等于车祸，器物细节须保留解释限度。"},{"label":"九三","text":"良马逐，利艰贞。曰闲舆卫，利有攸往。","meaning":"良马追逐，利于艰难中持守，并练习车辆驾御与防卫，利于有所前往。闲在此有训练之意，能行与能控相配；不能只看良马便略过训练和艰贞的准备。","focus":"推进以训练与控制为条件，不把有能力等同准备齐全。"},{"label":"六四","text":"童牛之牿，元吉。","meaning":"幼牛戴上牿木，元吉。用在角力尚未强盛之时的约束，可作为及早立界的学习线索；本爻不是现代控制人的许可，也不能说任何限制越早越严就一定正确。","focus":"节制的方式需要合宜，早立边界不等于可以无限控制。"},{"label":"六五","text":"豮豕之牙，吉。","meaning":"被阉割的猪仍有牙，吉。豮豕之牙常被解释为消解冲动根源而非徒制外形，属进一步释读；本册保留原有动物图景，不将其转成伤害身体或支配他人的建议。","focus":"分清意象解释与现实行动，不能照字面施加伤害。"},{"label":"上九","text":"何天之衢，亨。","meaning":"达到天之通衢，亨通。何的具体训读有讨论，整体呈现由蓄止到道路开阔的变化；它没有指明个人何时通达，也不能反过来保证此前任何积压最终都会释放成功。","focus":"保留通达之意，不把积蓄必成当作普遍规律。"}],"extra":null},{"n":27,"name":"山雷颐","sym":"䷚","upper":"艮","lower":"震","guaci":"贞吉。观颐，自求口实。","theme":"取养与自求","summary":"颐从口与养的图景讨论如何供养、接受什么、依赖什么。卦辞要求观颐与自求口实，六爻则出现舍己羡人、拂经、颠颐与由颐等不同情形。不能因养字就一概判营养、健康或获利有利；取养的来源、方式与承担责任才是阅读重点。","gt":"守正则吉。观察养的方式，自己求得口中之食。自求不是否定一切互助，而是要求辨明所养、所求及其来源，不能把欲望本身当作正当依据。","focus":"区分欲求、供给者与受养者的角色。颠颐在不同爻评价不同，不能凭同一个词作统一吉凶判断。","yao":[{"label":"初九","text":"舍尔灵龟，观我朵颐，凶。","meaning":"舍弃你自己的灵龟，却看着我鼓动腮颐求食，凶。图景是舍己所具而羡求他养，不能只看食物本身；灵龟为古代意象，不据此判断现实人物有无灵性或天赋。","focus":"看舍己逐外的失衡，不把原文变成神秘能力评定。"},{"label":"六二","text":"颠颐，拂经于丘颐，征凶。","meaning":"取养方向颠倒，违背常道，又向丘上求养，前往凶。具体的取养关系有爻位释读，入门保留失其常而求的不利；不能把一切向外求助都等同此凶。","focus":"求助是否失当须有具体依据，不以依赖一词全盘否定。"},{"label":"六三","text":"拂颐，贞凶，十年勿用，无攸利。","meaning":"违背养的常道，守占凶，十年不可用，没有什么有利。原文警戒严厉，不能安慰性改成很快就好；十年与勿用保留原文范围，不作为个人禁食、停工等决定。","focus":"不淡化无攸利，也不把年数变成现代行动禁令。"},{"label":"六四","text":"颠颐，吉。虎视眈眈，其欲逐逐，无咎。","meaning":"颠倒常位而受养，吉；如虎专注而视，欲求持续，无咎。与六二同有颠颐而评价不同，需看位置与承担关系；不能把强烈欲望本身当成正当或必得的理由。","focus":"同词异爻不可串用，欲望强不证明所求应得。"},{"label":"六五","text":"拂经，居贞吉。不可涉大川。","meaning":"有所违于常道，安居守正则吉，不可涉越大河。此爻既给有限可守，也明确限制远涉，不宜用全卦养的总意扩大行动范围，更不能删去不可涉川而只说吉。","focus":"守处有吉不等于远行有利，限制须与吉辞同列。"},{"label":"上九","text":"由颐，厉吉，利涉大川。","meaning":"成为养的来源，虽有危险却吉，利于渡大河。由颐涉及承担供养之责，不是只有接受好处；厉与吉并存，不能因可涉川便断定不用准备或毫无代价。","focus":"供养者有责任与风险，不把由颐只读成获利。"}],"extra":null},{"n":28,"name":"泽风大过","sym":"䷛","upper":"兑","lower":"巽","guaci":"栋桡，利有攸往，亨。","theme":"过重与承载","summary":"大过写超过常度、承载过重的局面。卦辞以栋梁弯曲开篇却仍说利往亨，六爻在枯杨生根与开花、栋桡与栋隆之间作对照，末爻又有凶而无咎。应分清实际后果和责任评价，不能把大过只解释成大错，也不能把过度冒险美化成必有突破。","gt":"栋梁弯曲，利于有所前往，亨通。承载失衡与需要行动并列，不是说危险不存在；行动的方式与能否重新支撑，仍须看具体爻辞及现实条件。","focus":"观察支持是否足够、更新是否扎根。婚配与年龄是原文图景，不据此推荐或否定某种现实年龄组合。","yao":[{"label":"初六","text":"藉用白茅，无咎。","meaning":"用白茅铺垫承托，无咎。面对过重之物，先加柔洁的衬垫，是谨慎承接的意象；不能把白茅变成招吉物件，也不能认为形式上小心就无需检查真正的承载能力。","focus":"重在承托与慎始，不在某种材料或颜色自带吉力。"},{"label":"九二","text":"枯杨生稊，老夫得其女妻，无不利。","meaning":"枯杨重新长出根芽，年长男子得到年轻妻子，无不利。稊的具体所指有讨论，本册取新生枝芽的线索；原文婚配图景不能直接证明现实年龄差关系一定合宜。","focus":"关注仍有再生基础，不用婚配意象替双方作选择。"},{"label":"九三","text":"栋桡，凶。","meaning":"栋梁弯折，凶。承载结构无法支撑，是明确不利的画面，不能因为卦辞利往就要求继续加压；现实具体哪处失衡仍需检查，不能直接预言建筑或身体出事。","focus":"停止用总卦吉意掩盖支撑不足，不编具体灾祸。"},{"label":"九四","text":"栋隆，吉，有它吝。","meaning":"栋梁隆起、支撑稳固，吉；若另有牵连，则有吝。与九三相对，支撑改善有利，但后半仍保留额外问题；不能只看到栋隆就断所有隐患已清除。","focus":"吉仍带有它吝的限制，不能截去后半求确定。"},{"label":"九五","text":"枯杨生华，老妇得其士夫，无咎无誉。","meaning":"枯杨开花，年长女子得到年轻男子，无咎也无誉。与九二再生图景有所不同，评价只是无咎无誉；不应擅自升级大吉，也不能用古代婚配语句贬低现实女性。","focus":"无咎无誉有明确分寸，不把它改成凶或盛吉。"},{"label":"上六","text":"过涉灭顶，凶，无咎。","meaning":"涉水过度，水没过头顶，凶，却无咎。结果不利与责任上无可责咎可以同时成立，不能因为无咎便说安全，也不能拿这种图景鼓励现实中舍身冒险。","focus":"区分结果凶与责任无咎，后者不能消除实际危险。"}],"extra":null},{"n":29,"name":"坎为水","sym":"䷜","upper":"坎","lower":"坎","guaci":"习坎，有孚，维心亨，行有尚。","theme":"重险与守信","summary":"习坎呈现险中又险的处境，卦辞仍保留有孚、心亨与行动可尚的成分。六爻从陷入深坑、求小得到简约相通、险近平复，最后又见拘系不脱，不能把坎一概说成必有灾难，也不能因为有信便保证所有困难都会自行化解。","gt":"重重险陷中，有诚信，内心得以通达，行动有所可尚。行有尚不等于任意涉险有利，诚信也不是能够避开现实风险的护符。","focus":"先辨陷险的程度与可求取的尺度。小得、终无咎与三岁不得分别有语境，不可合并为迟早必好。","yao":[{"label":"初六","text":"习坎，入于坎窞，凶。","meaning":"重重险陷，又进入深坑，凶。坎窞强调险中更深的陷处，不能把它仅说成锻炼机会；同时它是处境意象，不足以预测某人会落水、坠落或遭遇特定事故。","focus":"保留深陷之凶，不将困难浪漫化为必有收获。"},{"label":"九二","text":"坎有险，求小得。","meaning":"险中仍有危险，只求小有所得。行动尺度受到限制，不能因求可得就扩大目标；小得究竟指何物、是否已具备现实条件，要回到实际问项而不能凭空补全。","focus":"先限求取尺度，不把小得扩张成大事皆可推进。"},{"label":"六三","text":"来之坎坎，险且枕，入于坎窞，勿用。","meaning":"往来都处险陷，危险又难安，深入坎窞，不宜有所作为。险且枕的细释有分歧，整体不利仍清楚；不能用习险的学习意义为继续冒进辩护。","focus":"勿用是当前限制，不把熟悉风险等同有能力化险。"},{"label":"六四","text":"樽酒簋贰，用缶，纳约自牖，终无咎。","meaning":"以少量酒食、简朴陶器，经窗纳入约信，最终无咎。器物和句读细节可有不同释法，重点可从简约而真诚地相通理解，不据此保证小礼物便能化解任何困局。","focus":"简约与通诚相连，不能把器物礼数当作必效办法。"},{"label":"九五","text":"坎不盈，祗既平，无咎。","meaning":"险坑尚未盈满，已达到平处，无咎。祗等字有不同训读，可先把握险逐渐趋平的图景；无咎不是全部目标已完成，也不能据此断现实风险已经清零。","focus":"趋平与圆满不同，无咎不等于可以停止核查。"},{"label":"上六","text":"系用徽纆，寘于丛棘，三岁不得，凶。","meaning":"被绳索拘系，置于丛棘之中，三年不能解脱，凶。困束持续且难脱，是严厉的警戒；年数保留原文，不能据此给现实人定罪或预测具体拘禁时长。","focus":"不淡化长久困束，也不把三岁直接当法律结果。"}],"extra":null},{"n":30,"name":"离为火","sym":"䷝","upper":"离","lower":"离","guaci":"利贞，亨。畜牝牛，吉。","theme":"附丽与明察","summary":"离有附丽、光明的主题，光亮也依赖所附的条件。卦辞要求利贞并以畜牝牛为吉，六爻既有黄离元吉，也有日昃忧嗟、骤来焚弃与出征。不能因为火明便一概判热情、美好，重点是依附是否合宜、明察与节制是否相配。","gt":"利于守正，亨通；畜养牝牛，吉。牝牛可作为柔顺持守的学习意象，也保留养畜原语境；不能把吉意转成特定养殖或购买行为的收益保证。","focus":"光明不是无条件的正向标签。日昃与骤来均提示变化，血泪和战争语句须留在原文语境，不作现实灾祸预报。","yao":[{"label":"初九","text":"履错然，敬之无咎。","meaning":"行履交错纷然，以敬慎相待，无咎。起始处未必整齐，关键是敬而不乱；不能从错字直接断定已犯错，也不能凭无咎说复杂局面可以不经整理自行解决。","focus":"以敬慎态度回应纷杂，而非只凭无咎便放任局面混乱。"},{"label":"六二","text":"黄离，元吉。","meaning":"黄色的光明或附丽，元吉。黄在传统解释中常关联中，入门可从明而得中理解；这里不是颜色占验法，不能因穿黄、用黄或见黄便宣称已经符合本爻。","focus":"保留元吉的明中之意，不把颜色当作招吉条件。"},{"label":"九三","text":"日昃之离，不鼓缶而歌，则大耋之嗟，凶。","meaning":"日已偏西，若不敲缶而歌，便为年老而叹，凶。面对光景将晚的态度是学习线索，不能因此贬低真实悲伤，也不能据日昃、大耋判断寿命或死亡日期。","focus":"暮景与忧嗟是文本主题，不作生死和年龄预言。"},{"label":"九四","text":"突如其来如，焚如，死如，弃如。","meaning":"突然而来，如焚烧、死亡、弃置般骤烈。原文集中呈现猛烈而不能久处的图景，没有可直接转吉的句子；不应淡化其不利，但也不能照字面预告火灾或伤亡。","focus":"正视突烈失序，不把凶险意象当具体事故报告。"},{"label":"六五","text":"出涕沱若，戚嗟若，吉。","meaning":"眼泪不断流下，忧戚叹息，却吉。忧惧与吉意同在，显示承认问题、保持忧省可能有价值；不能说哭泣就会带来好运，也不能因为吉而否定当事人的痛苦。","focus":"情绪与吉凶不是简单对应，忧省不等于装作乐观。"},{"label":"上九","text":"王用出征，有嘉折首，获匪其丑，无咎。","meaning":"王用兵出征，有嘉功，折其首而所获并非一概同类，无咎。获匪其丑的句意有歧义，宜保留辨首恶、不滥及的传统线索，不扩成现实攻击或惩罚他人的许可。","focus":"军事处置须有范围，不能将折首意象转为报复建议。"}],"extra":null},{"n":31,"name":"泽山咸","sym":"䷞","upper":"兑","lower":"艮","guaci":"亨，利贞，取女吉。","theme":"感应与持守","summary":"咸以身体由足趾、腿肚、大腿到脢、口舌的感应，讨论影响如何发生与回应。卦辞有取女吉，婚嫁意味应保留；但各爻仍区分冲动追随、持守与言语之感。不能把相感直接当成对方已经动心的证据，也不能从婚嫁吉辞替双方作出同意。","gt":"亨通，利于守正，娶女吉。原文有明确婚嫁有利之辞，不需抹去；它仍是经文情境中的判断，不能单凭一次起卦确定现实对象的心意与关系结果。","focus":"把受到触动、采取行动与形成承诺分开。身体部位是感应层次的图景，不对应健康诊断或心理读数。","yao":[{"label":"初六","text":"咸其拇。","meaning":"感应发生在脚拇趾。文字尚未明说吉凶，只呈现细小而初起的触动；不能由此补出对方暗恋、将主动联系等情节，也不能把一点好感等同已经形成关系。","focus":"初起触动不是完整承诺，短辞不能承担读心结论。"},{"label":"六二","text":"咸其腓，凶，居吉。","meaning":"感应到小腿肚，凶；安居则吉。受触动而欲行，与暂时持守的评价不同，不能只取感应便催促立即行动；居吉也不是要求任何关系问题都永久等待。","focus":"行动与安居在本爻评价不同，勿把触动等同宜进。"},{"label":"九三","text":"咸其股，执其随，往吝。","meaning":"感应到大腿，执着追随，前往有吝。股随足动的图景可帮助理解随人而动，但不可凭此判断现实某人缺乏主见；重点是自身行动是否只是被牵引。","focus":"检视被动跟随，不把越在意越追随美化为诚意。"},{"label":"九四","text":"贞吉悔亡，憧憧往来，朋从尔思。","meaning":"守正则吉，悔意消失；若憧憧往来，朋友随你的思虑而动。后句存在不同解释，可从心念纷扰与有限感通理解，不能当作意念能操控别人或吸引指定对象的证据。","focus":"守正与纷扰分开，不把朋从尔思理解成意念控制。"},{"label":"九五","text":"咸其脢，无悔。","meaning":"感应到背部近脊的肉，无悔。脢的具体部位解释略有差异，本册不作解剖学裁定；文字没有补出热烈回应或承诺，不能据无悔推定感情已达深处。","focus":"无悔不等于强烈相爱，身体意象不用于测量情感。"},{"label":"上六","text":"咸其辅颊舌。","meaning":"感应落在辅、颊与舌，呈现口头表达的层面。经文未直接列吉凶，可反思是否停于言说，但不能由此断现实对象的每句话都虚假，也不能凭口舌推出欺骗动机。","focus":"言语与落实需另核，不从口舌意象直接判骗子。"}],"extra":null},{"n":32,"name":"雷风恒","sym":"䷟","upper":"震","lower":"巽","guaci":"亨，无咎，利贞，利有攸往。","theme":"恒常与适度","summary":"恒重在持续，但不是越久、越执着越好。卦辞说亨、利贞、利有所往，六爻却警戒求恒过深、德行不恒、徒劳无获与振动不安。学习应分清稳定原则和僵硬方式，既不因恒字保证关系长久，也不把改变一概理解为背弃。","gt":"亨通，无咎，利于守正，利于有所前往。持久与行动可以并行，恒不是停滞；正当持守的对象与方式必须明确，不能靠持续时间本身证明正确。","focus":"持续应看所守之德与可观察行为，而非只有承诺和次数。六五的男女角色保留古文语境，不作现代性别规范。","yao":[{"label":"初六","text":"浚恒，贞凶，无攸利。","meaning":"一开始就求取过深、过度的恒常，守占凶，没有什么有利。浚有深求之意，警戒是基础未立便要求长久不变；不能拿坚持的美名遮盖不合时宜的强求。","focus":"长久需有基础，不把过早索要承诺当成恒德。"},{"label":"九二","text":"悔亡。","meaning":"悔意消失。原文没有详列事件与行动，传统可结合爻位讨论持中与合宜，但不能将短辞扩成所有遗憾都会解决、某人一定回头或此前错误已获原谅。","focus":"保留悔亡而不补造事件，解释与原文长度须相称。"},{"label":"九三","text":"不恒其德，或承之羞，贞吝。","meaning":"德行不能恒常，可能承受羞辱，守占有吝。持续性在这里指向行为与品德，而非单纯重复做同一动作；不能用一次失误判人终身，也不能忽略反复失信的警戒。","focus":"看行为是否稳定合宜，不以口头坚持替代恒德。"},{"label":"九四","text":"田无禽。","meaning":"田猎却没有禽兽可得。可能投入与所处之地不相应，是可读的反思线索；经文未直接给出原因与修正方法，不能强行说只要继续坚持就迟早有收获。","focus":"没有收获须允许检视方向，不把持久当必得。"},{"label":"六五","text":"恒其德，贞，妇人吉，夫子凶。","meaning":"恒守其德，守占之下妇人吉、夫子凶。原文反映古代角色对持续方式的不同评价；学习可辨同一种守法因责任而异，不能推广成现代女性应服从、男性应主导的规定。","focus":"保留原文角色差异，明确不据此设现代性别等级。"},{"label":"上六","text":"振恒，凶。","meaning":"恒久处于振动不安之中，凶。振恒将表面不断行动与真正稳定区分开，不能以忙碌、频繁联系或反复承诺证明恒常；本爻也未给出无需改变便可转吉的保证。","focus":"持续躁动不等于恒定，凶意不能包装成热情加倍。"}],"extra":null},{"n":33,"name":"天山遁","sym":"䷠","upper":"乾","lower":"艮","guaci":"亨，小利贞。","theme":"退避与保全","summary":"遁讨论不宜久留时怎样退出，并不把退出等同失败。六爻从落在退路末端、受到牵系，逐步写到能够合宜而从容地远离。关键是辨明所处位置、牵连和退出条件，而不是仅凭卦名要求所有事情立即停止。爻中的吉凶仍须分别保留。","gt":"退避可以通达；小处有所利，宜守正。小利贞也有不同断句理解，不宜扩大成无条件有利。","focus":"比较各爻的牵系与自由程度，留意退出是否过迟、是否仍被关系或职责束缚；从容退出不等于忽视应尽责任。","yao":[{"label":"初六","text":"遁尾，厉，勿用有攸往。","meaning":"退避却处在队尾，容易落后而遇到危险，所以不宜再有所前往。这里写的是位置不利、行动受限的处境，不能把退字本身理解成安全已经得到保证。","focus":"重点是退路末端的危险，不把勿往改写成放心前进。"},{"label":"六二","text":"执之用黄牛之革，莫之胜说。","meaning":"用黄牛皮牢牢系住，没有谁能使它解脱。坚固的束缚与坚定的持守都可成为理解线索；究竟是谁执谁，经文本句没有把现实人物身份写明。","focus":"先保留牢固牵连的意象，不据此认定某人舍不得离开。"},{"label":"九三","text":"系遁，有疾厉，畜臣妾吉。","meaning":"想退却被牵住，像有病般难以自处，存在危险；畜养臣妾则吉。后句属于古代家内管理语境，不能直接转成控制伴侣或支配他人的许可。","focus":"区分受牵系的危险与特定事务的吉，不把后句覆盖全爻。"},{"label":"九四","text":"好遁，君子吉，小人否。","meaning":"能够离开所好、所亲近之物，君子吉，小人不能。好遁有喜好退避与舍弃所好等理解，此处保留能否合宜退出的差别，不用它给现实人物贴品格标签。","focus":"看退出所需的自制和取舍，不据君子小人给对方定性。"},{"label":"九五","text":"嘉遁，贞吉。","meaning":"退避得合宜而可嘉，守正则吉。这里不只是走开，还强调退出的方式和原则；吉建立在所退合宜、能够守正的条件上，不能扩成所有放弃都会获益。","focus":"把嘉与贞作为条件，辨认是合宜退避还是逃避问题。"},{"label":"上九","text":"肥遁，无不利。","meaning":"退避从容而宽裕，没有不利。肥遁可理解为余裕充足、不再牵系的退出状态；文字十分有利，但须先确认所谈确是这种状态，不能省略前提套给所有事。","focus":"有利指从容无系的退避，不等于许诺退出后的全部结果。"}],"extra":null},{"n":34,"name":"雷天大壮","sym":"䷡","upper":"震","lower":"乾","guaci":"利贞。","theme":"力量与分寸","summary":"大壮写力量增长后的使用问题。卦辞极简，只强调利贞，并没有说越强、越快就越好。爻辞反复出现脚趾、羊角、篱笆和车辆，呈现冒进受困与有承载能力的差别。学习重点是让力量与位置、规则和实际条件相配，不以强势代替可行性。","gt":"强盛之时，宜守正。","focus":"对照初九、九三、上六的冲撞与九二、九四的守正，理解力量增长为何仍需要界限和退路。","yao":[{"label":"初九","text":"壮于趾，征凶，有孚。","meaning":"力量首先用在脚趾，急于迈进，出征有凶，这一点可信。强盛刚开始就抢先行动，并不等于已具备整体条件；不可只取壮字而忽略征凶。","focus":"辨认急于迈步的冲动，原文征凶应明确保留而不淡化。"},{"label":"九二","text":"贞吉。","meaning":"守正则吉。此爻没有繁复场景，也没有给出具体结果或期限，重点在强盛之中仍能持守合宜的原则，不因为手中有力量就越过应守的范围。","focus":"不替短爻辞补造事件，应说明有利表达附着于贞。"},{"label":"九三","text":"小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。","meaning":"小人逞强，君子用罔，守持也有危险；公羊撞篱笆，羊角被缠住。罔字有不同解释，不能径定一种；明确的警示是凭力量硬碰可能反被困住。","focus":"保留用罔的解释分歧，着重羊角受困的具体风险。"},{"label":"九四","text":"贞吉悔亡，藩决不羸，壮于大舆之輹。","meaning":"守正则吉，悔恨消失；篱笆打开，不再缠住羊角，力量用于大车的承载部件。与前爻硬撞不同，此处条件疏通，力量有了可以发挥作用的结构。","focus":"注意通路打开和承载条件，不把结果只归因于更用力。"},{"label":"六五","text":"丧羊于易，无悔。","meaning":"在易处失去羊，却没有悔恨。易有容易、场所等不同理解；可以确定的是丧羊与无悔并列，放下某种强劲冲力未必构成应当懊悔的损失。","focus":"不把丧失机械判坏，也不擅定易是某地或某种性格。"},{"label":"上六","text":"羝羊触藩，不能退，不能遂，无攸利，艰则吉。","meaning":"公羊撞上篱笆，既退不回又进不去，没有利益；艰难自处则吉。前面的困局不能被末尾吉字抹去，转机与正视困难、克制处置相关。","focus":"先说明进退皆困，再读艰则吉，不用吉字遮住困局。"}],"extra":null},{"n":35,"name":"火地晋","sym":"䷢","upper":"离","lower":"坤","guaci":"康侯用锡马蕃庶，昼日三接。","theme":"推进与显现","summary":"晋以康侯受到赏赐、一天多次接见呈现被看见和向前发展的场景。六爻并非一律顺利，既有受挫、忧愁，也有众人认可和不必忧虑得失；九四、上九仍带危险与吝。理解晋应连同推进方式、承受位置及回应条件，而不是把卦名直接等同升职或感情成功。","gt":"康侯受到众多马匹的赏赐，一天之中多次获得接见。是受到礼遇、向前进展的场景描写。","focus":"比较推进受挫、获得信任与强势推进的不同状态；不要把本卦写成对方过去心意的事实证明。","yao":[{"label":"初六","text":"晋如摧如，贞吉。罔孚，裕无咎。","meaning":"想前进又受到挫折，守正则吉；尚未得到信任时，宽裕自处可以无咎。此爻不是否认阻力，而是在受阻与未被信任中，仍保留适当应对的可能。","focus":"同时呈现受挫和守正之吉，不把未信任推成蓄意欺骗。"},{"label":"六二","text":"晋如愁如，贞吉。受兹介福，于其王母。","meaning":"前进时怀有忧愁，守正则吉，并从王母那里获得大的福泽。王母是古代叙事中的身份，不宜自动套成现实某位女性或据此预言必有贵人帮助。","focus":"忧愁并未被抹去，福泽的古代身份不自动对应现实人物。"},{"label":"六三","text":"众允，悔亡。","meaning":"得到众人的认可，悔恨消失。这里的允着重信任、认可，说明推进与群体回应有关；没有直接给出私人关系中某一个人的完整意愿或最终承诺。","focus":"辨明众与个人的范围，不以群体认可替代当事人同意。"},{"label":"九四","text":"晋如鼫鼠，贞厉。","meaning":"前进像鼫鼠，守持这种状态有危险。鼫鼠的具体动物解释有分歧，可保留畏缩、贪占或不相称的警示，不应凭动物比喻给现实某人判品行。","focus":"保留危险表达与动物词疑义，不把比喻直接当人物指控。"},{"label":"六五","text":"悔亡，失得勿恤，往吉无不利。","meaning":"悔恨消失，不必因失去、得到而忧虑；向前吉，没有不利。吉意很明确，应如实保留，同时这仍是本爻的文字，不等于对所有问项作无条件保证。","focus":"不能因之卦不利而抹掉此爻吉辞，也不能据此保证成恋。"},{"label":"上九","text":"晋其角，维用伐邑，厉吉无咎，贞吝。","meaning":"以角般的强势推进，只宜用于讨伐自己的邑，处境危险而可获吉、无咎，持续如此则吝。可用的范围很窄，不能把伐邑扩大成对他人的攻击许可。","focus":"保留维用的范围和贞吝，勿把强硬推进解释成普遍可取。"}],"extra":null},{"n":36,"name":"地火明夷","sym":"䷣","upper":"坤","lower":"离","guaci":"利艰贞。","theme":"受损时的自处","summary":"明夷讨论光明受到伤害时的处境，卦辞强调在艰难中守正。爻辞以飞鸟受伤、左腿受伤、出门远离和箕子的故事展开不同自处方式，也写到先高后坠。它提示处境受抑与显露风险，却不能单凭受伤意象认定有人欺骗，更不能据此诊断现实伤病。","gt":"在艰难处境中守正有利。","focus":"看清受伤、救助、离开和晦藏分别出现在哪里；解释可讨论自处，不替经文补造加害者或具体阴谋。","yao":[{"label":"初九","text":"明夷于飞，垂其翼。君子于行，三日不食。有攸往，主人有言。","meaning":"光明受伤，如飞鸟低垂翅膀；君子行路，三日不能进食；有所前往，主人有所言说或议论。原句描写受损、远行与他人言语，不按三日推定当前应期。","focus":"据BUS p504／书498补足末句；主人身份须看语境，不指控现实人物。"},{"label":"六二","text":"明夷，夷于左股，用拯马壮，吉。","meaning":"受伤在左大腿，用强壮的马来救援，吉。受损与有效援助同时存在，吉并不说明没有受伤；此处可读为能采取适当救助，而非现实医疗结果预测。","focus":"保留先伤后救的结构，不从部位意象作健康诊断。"},{"label":"九三","text":"明夷于南狩，得其大首，不可疾贞。","meaning":"向南狩猎，获得大的首领或主要目标，但不宜急迫地求正。可见行动触及根本问题，同时有不可疾的限制；南和大首不可不经现实依据直接套人。","focus":"重点在不可急切，避免补定方向行动或具体敌对人物。"},{"label":"六四","text":"入于左腹，获明夷之心，出于门庭。","meaning":"进入左腹，得到明夷的心意，走出门庭。身体与门户组成深入而后离开的意象；可讨论了解关键后退出，不据此宣称已经读懂他人的真实内心。","focus":"心在古语场景中，不构成透视当事人动机的事实证据。"},{"label":"六五","text":"箕子之明夷，利贞。","meaning":"如箕子身处光明受损的境遇，守正有利。它引用古代人物来说明受抑环境中的自守，不等于要求所有人长期忍受伤害，更不证明忍耐必有回报。","focus":"区分艰难自守与无条件忍受，人物典故不是现实身份映射。"},{"label":"上六","text":"不明晦，初登于天，后入于地。","meaning":"不再明亮而趋于昏暗，起初升到天上，后来落入地中。前后落差明显，呈现高起而后衰败的情景，不能将其柔化成只是一点暂时的不顺。","focus":"保留由高而坠的警示，但不直接推成具体灾祸日期。"}],"extra":null},{"n":37,"name":"风火家人","sym":"䷤","upper":"巽","lower":"离","guaci":"利女贞。","theme":"家内秩序与责任","summary":"家人以家庭内部的秩序和角色为中心。爻辞从预先设防、饮食供给，写到宽严失度、家用丰足、信实与威仪。其男女与君王等表达属于古代社会语境，学习时可分析责任和边界，但不能直接搬成现代家庭中谁必须服从谁，也不凭卦名保证将来成家。","gt":"有利于女子守正。女字保留原来的家庭角色语境，不扩为只由女性承担家庭责任。","focus":"理解古代家内分工，再区分可借鉴的责任、信实与不宜直接移用的身份安排；家人卦不替代双方意愿。","yao":[{"label":"初九","text":"闲有家，悔亡。","meaning":"在家庭形成之初就设立防闲、边界，悔恨消失。闲在此与防范、约束相关，意在及早建立秩序，不应解成无事可做或允许一方过度监控另一方。","focus":"边界应先明确，不能把防闲借作监控和控制的正当理由。"},{"label":"六二","text":"无攸遂，在中馈，贞吉。","meaning":"不独自追求外面的成就，而在内主持饮食供给，守正吉。这是古代家内分工叙述；现代学习可看见基础供给的重要，不把旧分工强加给特定性别。","focus":"供给是责任主题，原有性别分工不是现代必须照搬的规范。"},{"label":"九三","text":"家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。","meaning":"家中严厉训诫，虽有悔与危险而可吉；妇子嬉笑失节，终会有吝。原文把过严与过松相对照，不能从中推出暴力有益，吉也不抹去悔厉。","focus":"呈现宽严两端的代价，不把严厉教育简化为越严越好。"},{"label":"六四","text":"富家，大吉。","meaning":"使家庭丰足，大吉。此处对家内资源与生活的充实有明确肯定，但未说明具体财富数字、取得方式和现实收益，不应据此作投资或发财保证。","focus":"丰足的对象是家，不自动扩成个人高风险获利判断。"},{"label":"九五","text":"王假有家，勿恤吉。","meaning":"王来到或达到有家的境地，不必忧虑，吉。假有至的读法，场景可联系家内和合与有序；君王身份不能机械换成某个现实男性或婚约对象。","focus":"保留假字的古义，不能从王家场景推出必然结婚。"},{"label":"上九","text":"有孚威如，终吉。","meaning":"有诚信，又有端肃的威仪，最后吉。信实与可敬的边界相配，不是只凭严厉获得秩序，也不是为了和气取消原则；终吉仍须连同前面的条件来读。","focus":"信实和威仪并读，勿把威如等同恐吓或无条件服从。"}],"extra":null},{"n":38,"name":"火泽睽","sym":"䷥","upper":"离","lower":"兑","guaci":"小事吉。","theme":"差异中的相处","summary":"睽是相背、分歧，卦辞把可行范围限定在小事。爻辞既有丧失、受阻与孤立，也有相遇、交信和误认消解；并非见到睽字就只有永远决裂。学习时宜分辨差异是否能澄清、合作范围多大，不把后面的和解意象变成每段关系都能复合的承诺。","gt":"在分歧的处境中，小事吉。","focus":"从孤立到交信，从误认到辨明，观察条件怎样变化；小事吉不是大事可成，更不能代替双方实际回应。","yao":[{"label":"初九","text":"悔亡，丧马勿逐，自复。见恶人，无咎。","meaning":"悔恨消失，马走失了，不追也会自行回来；见到恶人，没有过失。此为特定丧复与接触场景，不可将自复普遍移成某人一定回头或不用采取任何措施。","focus":"保留勿逐的具体对象，不把马的返回当作恋人返回保证。"},{"label":"九二","text":"遇主于巷，无咎。","meaning":"在巷中遇见主人，没有过失。相遇不循宏大的正式场面，也可能消除隔阂；但主人的现实身份、相遇日期和两人的私下关系，经文并未交代。","focus":"接触渠道是学习线索，不补定偶遇时间或所谓命定人物。"},{"label":"六三","text":"见舆曳，其牛掣，其人天且劓，无初有终。","meaning":"车被拖住、牛被掣住，人又受髡发割鼻的刑伤，开始不顺，最终有结果。阻碍与伤损写得很重，不能因为有终就将前半段说成无关紧要的小阻力。","focus":"先保留受阻与损害，再解释无初有终的前后差别。"},{"label":"九四","text":"睽孤，遇元夫，交孚，厉无咎。","meaning":"因分歧而孤立，遇到善良或相合的人，彼此交信，虽危险而无咎。由孤立到相交依赖实际信任的形成，不是仅凭卦意认定新认识的人必可信任。","focus":"交孚是关键条件，危险没有因遇人而自动完全消失。"},{"label":"六五","text":"悔亡，厥宗噬肤，往何咎。","meaning":"悔恨消失，同宗者咬开柔软的肉，前往还有什么过失？咬合较易的意象可提示隔阂有疏通机会，但宗亲身份和具体可行行动仍需依问项说明。","focus":"读清关系与通达条件，不把往何咎扩成任何行动均无风险。"},{"label":"上九","text":"睽孤，见豕负涂，载鬼一车。先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。","meaning":"孤立时见到泥猪和满车鬼怪，先拉弓，后放下弓；原来不是盗寇，而是婚媾，前往遇雨吉。重点是误认得到澄清，不证明现实中已有敌人或婚约。","focus":"把先疑后明作为解释结构，不把鬼怪意象当超自然事实。"}],"extra":null},{"n":39,"name":"水山蹇","sym":"䷦","upper":"坎","lower":"艮","guaci":"利西南，不利东北。利见大人，贞吉。","theme":"受阻与求助","summary":"蹇写行进艰难，卦辞提出方向、见大人与守正等条件。六爻反复对照往与来，呈现继续硬进受阻、返回联结或获得帮助的不同可能。它不等于所有行动都必须取消，也不等于任何退回都会转好；要结合阻碍、职责和可获得的支持来理解。","gt":"往西南有利，往东北不利；宜见有德位的人，守正吉。方位是原文条件，不自动成为现实出行指令。","focus":"区别往、来、反、连的变化，明确阻力属于哪一件事；经文方位与大人身份不可未经核实便落实到地图人物。","yao":[{"label":"初六","text":"往蹇，来誉。","meaning":"前往遇到艰难，返回得到称誉。行动方向不同，评价也不同；此处肯定能认清阻势而回转，不是说凡是后退都正确，更不是让人回到任何旧关系中。","focus":"对照往与来，不将返回机械套成复合或重走旧路。"},{"label":"六二","text":"王臣蹇蹇，匪躬之故。","meaning":"王臣一再经历艰难，不是为了自己的私利。重点在承担职责所遭遇的困苦；它没有说困难可以忽略，也没有要求现代个人无边界地替所有人牺牲。","focus":"识别非私利的职责语境，不把忠勤叙事用成无限承担。"},{"label":"九三","text":"往蹇，来反。","meaning":"前进遇到艰难，返回原处。反是回转，提示行路受阻时重新调整，而经文本句没有给出明确吉凶结果、成功日期或返回以后具体会发生什么。","focus":"保留仅有回转的信息，不从短句补出必然转好。"},{"label":"六四","text":"往蹇，来连。","meaning":"前往有阻，回来与他人联结。连可从联结、相连理解，显示独自推进与借助联系的差异；联结谁、以何种方式合作，需要现实材料进一步辨认。","focus":"联系不是无条件求助任何人，仍须确认支持是否真实。"},{"label":"九五","text":"大蹇朋来。","meaning":"遭遇大的艰难，朋友前来相助。困难并未因为帮助出现就被否定，朋来是有支持的场景，不能据此保证在现实中某位朋友一定会承担问题。","focus":"同时保留大蹇与朋来，别只抽取贵人相助而删掉困难。"},{"label":"上六","text":"往蹇，来硕，吉，利见大人。","meaning":"前往仍受阻，返回则获得大的成效或支持，吉，宜见大人。硕的具体所指有解释空间；有利部分仍与返回和寻求合适支持相关，不能越过条件。","focus":"保留硕字的宽泛意义，不直接补成财富或关系结果。"}],"extra":null},{"n":40,"name":"雷水解","sym":"䷧","upper":"震","lower":"坎","guaci":"利西南，无所往，其来复吉。有攸往，夙吉。","theme":"解除与及时收束","summary":"解讨论阻结得到疏解之后怎样行动。卦辞区分已经无事可往时应返回，与确有待办事项时宜及早前行，不能只取解除便一味向前。爻辞还涉及辨别、解除牵连和处置高处隐患，提醒化解需要对象明确，解并不固定等于分手，也不保证问题自行消失。","gt":"西南有利；没有必须前往的事，返回吉。有应当去办的事，及早前往吉。","focus":"先分清有无待办事项，再读返回与早行；讨论解除哪种阻结，不仅凭解字认定某段关系该结束。","yao":[{"label":"初六","text":"无咎。","meaning":"没有过失。爻辞非常简短，没有说明具体事件、期限或结果，因此学习时应保留无咎的有限评价，不把它扩成百事顺遂或完全没有任何现实风险。","focus":"无咎不是必成，短句没有交代的条件不凭空补齐。"},{"label":"九二","text":"田获三狐，得黄矢，贞吉。","meaning":"田猎捕获三只狐狸，得到黄色的箭，守正吉。捕获与得箭呈现辨清、取得的意象；三狐不能随意对应三个现实坏人，黄矢也不直接证明某种职业。","focus":"不把动物和数字落成现实名单，守正条件须同时保留。"},{"label":"六三","text":"负且乘，致寇至，贞吝。","meaning":"肩负货物却又乘坐车辆，引来盗寇，守持这样的状态有吝。身份、所负与所乘不协调，是警示重点；不能倒过来指责遭受侵害的人必然有错。","focus":"分析位置与行为不相称，不以卦辞归罪现实受害者。"},{"label":"九四","text":"解而拇，朋至斯孚。","meaning":"解除拇指般的牵连，朋友到来，于是有信任。拇可作亲近牵系的比喻，但具体指什么不能无据认定；信任的形成应与解除不当牵连一并理解。","focus":"牵连需先辨明，不能据此要求用户随意切断某个人。"},{"label":"六五","text":"君子维有解，吉，有孚于小人。","meaning":"君子有所解除，吉，其效果可在小人身上见到信验。小人的语义属于原文价值区分，不可直接给现实对象贴标签，也不能改成对任何人的打击都会吉。","focus":"解释解除的作用与信验，不预设被解除者是某个坏人。"},{"label":"上六","text":"公用射隼于高墉之上，获之，无不利。","meaning":"公在高墙之上射中隼，捕获它，没有不利。经文呈现对明确目标的有效处置，不是模糊地鼓励强硬，更不构成现实攻击、报复或执法成功的保证。","focus":"对象明确、处置奏效是场景条件，勿扩作进攻许可。"}],"extra":null},{"n":41,"name":"山泽损","sym":"䷨","upper":"艮","lower":"兑","guaci":"有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享。","theme":"减损与适量","summary":"损讨论减少什么、为谁减少，以及诚意与形式的关系。卦辞肯定有孚，指出简薄的祭品也可用于享祭；六爻则把酌量减损、不可自损、同伴增减和获得帮助并列。它并不是损失必坏或吃亏必有福，而是要求逐项理解所减是否合宜、是否保有应守的基础。","gt":"有诚信，大吉，无咎，可以守正，宜有所往。用什么祭享？两簋简薄的祭品也可用来供奉。","focus":"把酌损、弗损与益之放在一起读，区分适量减少、无谓自耗和实际助益；不能把牺牲本身当作成功条件。","yao":[{"label":"初九","text":"已事遄往，无咎，酌损之。","meaning":"结束自己的事情，迅速前往相助，没有过失，但要酌量减损。已事有停止或完成事务的理解，关键是及时与酌量并在，不是无限牺牲自己去满足他人。","focus":"及时帮助仍要衡量损益，不删除酌字所保留的分寸。"},{"label":"九二","text":"利贞，征凶，弗损益之。","meaning":"宜守正，贸然前进有凶；不减损自己而使对方受益。弗损益之的主客关系有解释空间，可以确定的是不能把征凶忽略而只宣传奉献有利。","focus":"守正与征凶并读，避免把自我耗损直接包装成必得回报。"},{"label":"六三","text":"三人行，则损一人；一人行，则得其友。","meaning":"三个人同行会减少一人，一个人独行反得到同伴。爻辞讨论组合与关系的调整，不是现实三角关系的证明，也不能用人数断定某人另有交往对象。","focus":"看组合怎样变化，不把三人一人当作现实名单证据。"},{"label":"六四","text":"损其疾，使遄有喜，无咎。","meaning":"减去自身的疾患或弊病，使喜事很快来到，没有过失。疾可作疾病或问题的比喻理解；当代引申可谈修正缺点，不能据此保证具体疾病会痊愈。","focus":"减的对象是疾弊，不把文字有喜作为医疗结果承诺。"},{"label":"六五","text":"或益之十朋之龟，弗克违，元吉。","meaning":"有人增益以十朋之龟，大吉。弗克违可读赠予难辞，也有龟占不可违等解释，暂不唯一确定。朋与龟属于古代体系，不直接折算现代金额或投资收益。","focus":"保留受益场景，不给十朋换算现代钱数或中奖数字。"},{"label":"上九","text":"弗损益之，无咎，贞吉，利有攸往，得臣无家。","meaning":"不再减损而给予增益，无咎，守正吉，宜前往；得臣无家。末句可从获得无家私之臣等角度理解，仍有异解，不据此推出现实家庭破散或招人结果。","focus":"保留得臣无家的解释空间，不把古代臣属关系硬套当事人。"}],"extra":null},{"n":42,"name":"风雷益","sym":"䷩","upper":"巽","lower":"震","guaci":"利有攸往，利涉大川。","theme":"增益与受益方式","summary":"益不是简单的利益增加表，而是资源如何投入、助益如何被承接的讨论。经文既肯定大作、守正与惠心，也说明凶事中可以得到帮助，以及求益失当会招来打击。理解时要辨明受益对象、投入条件和持续的心意，不因卦名有益就保证任何行动获利。","gt":"宜有所前往，宜渡过大河。表达行动与涉难的有利方向，仍须结合各爻条件。","focus":"从施助与受助两面阅读，特别比较九五惠心与上九无益被击，避免把增益等同无条件索取。","yao":[{"label":"初九","text":"利用为大作，元吉，无咎。","meaning":"有利于开展大的事务，大吉，没有过失。此爻明确肯定适当的大作，但没有给出哪种工程、投入额度或现实成功率，不能把任何冒险都装进大作二字。","focus":"大作须与问项及条件对应，不是扩大投入或风险的许可证。"},{"label":"六二","text":"或益之十朋之龟，弗克违，永贞吉。王用享于帝，吉。","meaning":"有人增益以十朋之龟，长久守正吉；王祭享上帝也吉。弗克违有赠予不可辞、龟占等异解，不作唯一解释；古代助益与祭祀不能直接推成现代财富或神意。","focus":"助益仍与永贞相连，勿凭赠龟叙事认证现实收益。"},{"label":"六三","text":"益之用凶事，无咎。有孚中行，告公用圭。","meaning":"在凶险事务中得到助益，没有过失；有诚信，行中道，以圭向公报告。危机处理、合宜行事与正式告知共同出现，不能只看无咎就说没有困难。","focus":"凶事与正式告知都应保留，不把有帮助等同无需应对。"},{"label":"六四","text":"中行，告公从，利用为依迁国。","meaning":"行事合乎中道，向公报告后得到采纳，有利于依托此事迁移国都。它呈现有秩序的重大调整，不能把迁国直接换成个人应当搬家或跳槽。","focus":"报告、采纳和依托是场景条件，不凭迁字替用户决定迁移。"},{"label":"九五","text":"有孚惠心，勿问元吉。有孚惠我德。","meaning":"心怀诚信和施惠，不必再问便是大吉；别人也以诚信回应这种德行。文字肯定内在施益的取向，不是说只要自认真诚，就有权要求别人回报或爱上自己。","focus":"惠心不是交易筹码，不能用自身善意替代对方实际回应。"},{"label":"上九","text":"莫益之，或击之，立心勿恒，凶。","meaning":"没有人帮助，反有人攻击，立心不能恒定，凶。此爻与益的总体有利表达形成反差，提醒失当的求益方式有代价；不能把凶改成暂时的小阻力。","focus":"保留无助、受击与不恒的警示，不把益卦一概判吉。"}],"extra":null},{"n":43,"name":"泽天夬","sym":"䷪","upper":"兑","lower":"乾","guaci":"扬于王庭，孚号有厉。告自邑，不利即戎，利有攸往。","theme":"公开决断的分寸","summary":"夬讨论需要决断时怎样公开表达和处理。卦辞有扬告与危险提示，又明确不利于诉诸武力；六爻多写前进过急、戒备、犹疑和最终失声。它不是随意断绝或强硬取胜的许可，应把公开说明、戒惧和行动范围一起读，区分决断与情绪化冲撞。","gt":"在王庭公开宣告，诚信地呼号，仍有危险；先告知自己的邑，不宜立即动武，宜有所前往。","focus":"公开辨明不等于羞辱或攻击；对照不利即戎与各爻厉凶，理解果断仍需合宜程序和充分准备。","yao":[{"label":"初九","text":"壮于前趾，往不胜为咎。","meaning":"力量集中在向前迈出的脚趾，贸然前往却不能胜任，构成过失。此处警惕冲在条件前面，不能因为属于决断之卦，就鼓励凡事立刻行动。","focus":"前进的冲动不等于胜任，关注往不胜所写的能力差距。"},{"label":"九二","text":"惕号，莫夜有戎，勿恤。","meaning":"警惕而呼号，夜晚可能有兵戎，也不必忧虑。莫夜可读暮夜，戒备与勿恤并行；不是说外部风险绝不会出现，而是不能删除已经警惕的前提。","focus":"勿恤建立在惕号场景中，不可解释成解除所有防备。"},{"label":"九三","text":"壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。","meaning":"强势显露在颧面，有凶；君子坚决，独行遇雨，被淋而有怨恼，却无咎。风险、坚定与处境不快同在，不能把一个无咎覆盖前面的凶警。","focus":"区分逞强与坚决，不据独行遇雨预言现实天气或同行人。"},{"label":"九四","text":"臀无肤，其行次且。牵羊悔亡，闻言不信。","meaning":"臀部受损，行走迟疑；牵羊则悔恨可消，但听见劝告却不相信。行动不便与不纳意见构成紧张关系，不宜只谈退让，也须留意听而不信。","focus":"看身体不安和拒信劝告的组合，不对实际病症作推断。"},{"label":"九五","text":"苋陆夬夬，中行无咎。","meaning":"像处理苋陆那样坚决，行中道则无咎。苋陆植物所指及取象有不同理解，不必硬定其药性；可以确定的是决断须合中，而非以激烈程度证明正确。","focus":"不补造植物药效或人身映射，中行是无咎的重要限定。"},{"label":"上六","text":"无号，终有凶。","meaning":"没有呼号，最后有凶。与卦辞要求告知、呼号相对，末爻留下失声或不能求援的警示；文字没有说明灾难具体类型，不能据此虚构事故细节。","focus":"终有凶必须保留，不因全卦主决断就保证结果向好。"}],"extra":null},{"n":44,"name":"天风姤","sym":"䷫","upper":"乾","lower":"巽","guaci":"女壮，勿用取女。","theme":"遇合与边界","summary":"姤是相遇，卦辞却以女壮、勿用取女提示某种结合不宜直接成立。六爻有系止、包鱼、失鱼、含章和角端相遇，讨论接触之后的限制与承接。古代婚娶与性别用语应如实交代，但不能据此给现实女性贴强势或危险标签，更不能当作命定姻缘的证明。","gt":"女子强盛，不宜用来娶为妻。这是原文特定的婚娶警示，不是对所有女性或所有相遇的一般评价。","focus":"同时读相遇与不宜结合的边界，保留性别古语的时代语境；不从女壮推出现实对象人格或隐瞒动机。","yao":[{"label":"初六","text":"系于金柅，贞吉。有攸往，见凶，羸豕孚蹢躅。","meaning":"用金属止车器系住，守正吉；若有所往，见凶，瘦弱的猪也会躁动。止与动的警示并存，羸豕是意象，不用它影射某人外弱内险的真实品格。","focus":"先读系止与见凶的界限，不把动物比喻变成人格指控。"},{"label":"九二","text":"包有鱼，无咎，不利宾。","meaning":"包中有鱼，没有过失，但不利于宾客。持有之物与对外分享之间存在范围，不能只取无咎而忽略不利宾，也不把鱼直接认作某个恋爱对象。","focus":"无咎与不利宾是不同范围，不把有鱼机械等同已有伴侣。"},{"label":"九三","text":"臀无肤，其行次且，厉无大咎。","meaning":"臀部没有皮肤，行路迟疑，虽危险却无大咎。描写难以安坐和行动不稳的窘境，不能把无大咎误写为无危险，也不以此诊断真实皮肤或肢体疾病。","focus":"保留厉与无大咎的层次差别，不将风险轻描淡写。"},{"label":"九四","text":"包无鱼，起凶。","meaning":"包中没有鱼，引起凶。与九二有鱼相比，关键在应当承接的条件缺失，结果不利；但经文本句没有交代谁离去、是否背叛及原因，不能补成关系剧情。","focus":"承接落空是可读主题，具体人物行为仍无事实依据。"},{"label":"九五","text":"以杞包瓜，含章，有陨自天。","meaning":"用杞木包护瓜果，内含文采，有从天而降之物。字物与取象存在解释空间，宜保留包护、含蓄和外来变化的意象，不将陨定成天灾或意外横财。","focus":"有陨自天不自动等于灾难或好运，先保留语义未定。"},{"label":"上九","text":"姤其角，吝，无咎。","meaning":"相遇到角上，有吝，却无咎。角是高而偏的相接位置，可呈现接触不易融洽的局面；吝与无咎并存，不宜改成一定成或一定完全无事。","focus":"区分不快与过失，不从角端意象编造双方性格。"}],"extra":null},{"n":45,"name":"泽地萃","sym":"䷬","upper":"兑","lower":"坤","guaci":"亨。王假有庙，利见大人，亨，利贞。用大牲吉，利有攸往。","theme":"聚合与可信秩序","summary":"萃写人众聚集，卦辞通过宗庙、见大人和祭牲说明共同秩序的重要。爻辞并不把聚集自动等同和乐，也有诚信不终、叹息、未被信任和涕泣。学习可关注聚合的目标、引导与信任基础，不只数身边有多少人，更不凭聚字认定关系一定复合。","gt":"通达；王来到宗庙，宜见大人，亨通而宜守正。用大的祭牲吉，宜有所前往。","focus":"把聚集的人、共同目标与可信安排分开观察；群体暂聚不等于长期稳定，仪式形式也不能代替诚信。","yao":[{"label":"初六","text":"有孚不终，乃乱乃萃。若号一握为笑，勿恤，往无咎。","meaning":"有诚信却不能坚持到底，于是纷乱而聚集；若呼号求援，短暂之后可转为笑，不必忧虑，前往无咎。一握的训释有分歧，不将其硬定为具体时长。","focus":"信不终的混乱须保留，不从转笑一语保证所有误会消除。"},{"label":"六二","text":"引吉，无咎，孚乃利用禴。","meaning":"受到引导、牵引则吉，无咎；有诚信，便有利于举行简薄的禴祭。关键是诚意与合宜引导，不能从祭礼推出必须进行某种仪式才会获得现实好结果。","focus":"孚是祭礼可用的条件，不把古代礼仪变为操作要求。"},{"label":"六三","text":"萃如嗟如，无攸利。往无咎，小吝。","meaning":"聚集时叹息，没有什么利益；前往无咎，但有小吝。群体中的失落与继续接触的有限可行性并存，既不能说全然有利，也不应把无咎写成必被接纳。","focus":"无利、无咎和小吝各有层次，别合并成一个笼统吉凶。"},{"label":"九四","text":"大吉无咎。","meaning":"大吉，没有过失。此爻措辞简短而积极，宜保留原有吉意，同时没有具体叙明聚集对象、规模和现实事项，不能自行补成婚姻事业全部成功。","focus":"吉辞如实保留，短句未给的现实结果不借题发挥。"},{"label":"九五","text":"萃有位，无咎。匪孚，元永贞，悔亡。","meaning":"聚集而有其位，没有过失；仍有人未信，要长久守正，悔恨才消失。位置合法或组织成形并不等于信任已经齐备，匪孚正是不能省略的一层。","focus":"分清有位与被信任，元永贞是持续要求而非一次表态。"},{"label":"上六","text":"赍咨涕洟，无咎。","meaning":"叹息忧伤，流泪流涕，没有过失。悲伤是真实的文字内容，无咎只说明不构成过失，不代表情绪会立刻结束，也不是聚集必然和乐的证据。","focus":"允许悲伤而不强圆成喜，不把无咎误作没有痛苦。"}],"extra":null},{"n":46,"name":"地风升","sym":"䷭","upper":"坤","lower":"巽","guaci":"元亨，用见大人，勿恤，南征吉。","theme":"渐进与凭阶而上","summary":"升写从下而上的发展，卦辞有见大人与南征之吉，爻辞则从获准上升、简祭和入虚邑，写到升阶与冥升。主线是发展怎样获得支持、经过什么阶次，末爻还留下过度上升的警示。它不保证升职、成绩或关系升级，具体结果仍要依现实条件判断。","gt":"大为通达，宜见大人，不必忧虑，向南前进吉。方向与身份保留在原文语境，不直接替现实行程作决定。","focus":"比较有支持、有阶次的上升与冥升，关注发展所凭借的基础；不能把升字当作必然得到更高职位的承诺。","yao":[{"label":"初六","text":"允升，大吉。","meaning":"得到认可或信任而上升，大吉。允可从信、允许理解，显示起步有承接条件；它不是说只要自己决定向上就必然得到他人允许或现实资源。","focus":"认可需在现实中有回应，不以自信替代实际支持。"},{"label":"九二","text":"孚乃利用禴，无咎。","meaning":"有诚信，可以举行简薄的禴祭，没有过失。上升过程中，重心不在夸大形式或投入，而在真实与相称，不能将祭祀描述当作求升职的必要仪轨。","focus":"保留诚实与简约的关系，不把古礼改成求结果的方法。"},{"label":"九三","text":"升虚邑。","meaning":"上升进入空虚的邑。场景看似通路少阻，却没有直接标出吉凶，也没有解释邑为何空；可讨论阻碍较少，不应补成一路无人竞争、必然轻松获胜。","focus":"虚邑只是一种场景，不能补造竞争对手缺席的事实。"},{"label":"六四","text":"王用亨于岐山，吉无咎。","meaning":"王在岐山祭享或举行相应礼事，吉，无咎。亨在此有祭享的读法，保留古代地域与仪礼背景，不把岐山直接换成现实可求好运的出行地点。","focus":"注明祭享古义和地名背景，不将场景转成旅行指令。"},{"label":"六五","text":"贞吉，升阶。","meaning":"守正则吉，沿着阶梯上升。升阶强调次序和可以承接的层级，有利于理解逐级发展；但经文没有给阶数、时间或每一步必然得到的现实奖励。","focus":"阶次是发展方式，不是日历或职位级别的自动对应。"},{"label":"上六","text":"冥升，利于不息之贞。","meaning":"昏暗中仍向上升，有利于不停止的守正。冥升提示看不清仍求升的状态，不息之贞则转向持续原则，不能解释成无论处境怎样都必须不断扩张。","focus":"区分坚持原则与盲目追高，不把不息误读为不准停下。"}],"extra":null},{"n":47,"name":"泽水困","sym":"䷮","upper":"兑","lower":"坎","guaci":"亨，贞，大人吉，无咎。有言不信。","theme":"受限中的持守","summary":"困面对资源、行动和表达受到限制的处境，卦辞虽有亨和大人吉，也直言有言不信。爻辞呈现幽谷、荆棘、车阻与缠绕，并不都是短暂小波折；后段有徐徐解脱与行动之吉。学习应先承认限制，再看哪些条件可能松动，不靠乐观话语抹去困境。","gt":"在困境中仍可通达，守正；大人吉，无咎。但即使说话，也可能不被相信。","focus":"区分困境本身与应对评价，保留表达不被信任的限制；三岁等叙事数字不直接换算当前事件的等候时间。","yao":[{"label":"初六","text":"臀困于株木，入于幽谷，三岁不觌。","meaning":"臀部受困于树桩，进入幽深山谷，三年不见。形象非常闭塞，不能只因卦辞有亨就把此爻说成顺遂；三岁是原叙事时间，不自行作为问事应期。","focus":"呈现深困与隔绝，不从不觌认定某人失踪或不再爱谁。"},{"label":"九二","text":"困于酒食，朱绂方来，利用享祀。征凶，无咎。","meaning":"受困于酒食，穿朱绂的人将来，可用于祭享；出征凶，无咎。供给与身份场景并未取消行动风险，应分别解释征凶与无咎，不混成全面吉利。","focus":"宴食、祭享、征行各有范围，尤其不可删去征凶。"},{"label":"六三","text":"困于石，据于蒺藜，入于其宫，不见其妻，凶。","meaning":"被石头困住，又倚在荆棘上，回到家中见不到妻子，凶。所依不当与内外落空都很鲜明，但不能把古代情景直接当成现实婚姻背叛的证据。","focus":"保留凶与无所依的警示，不以不见妻编造感情隐情。"},{"label":"九四","text":"来徐徐，困于金车，吝，有终。","meaning":"缓慢地到来，受金属车阻隔，有吝，却有结局。进程迟滞与最终有终并存，不应许诺马上转好；金车可能指阻碍或所乘，不宜硬套财富人物。","focus":"迟缓与有终同时记录，不给未知结局补成必然圆满。"},{"label":"九五","text":"劓刖，困于赤绂，乃徐有说，利用祭祀。","meaning":"遭受割鼻断足般的困苦，又受赤绂所困，后来逐渐解脱，有利祭祀。刑伤和服饰属于古代场景，重点是艰难中缓解，不用其诊断或预报身体伤害。","focus":"徐有说表示逐渐松脱，先前严重困苦不能被省略。"},{"label":"上六","text":"困于葛藟，于臲卼，曰动悔有悔，征吉。","meaning":"被葛藤缠困，处于摇摆不安之地；说行动会后悔，确有可悔之处，但前往吉。警惕与行动并非简单对立，可读为认识束缚后谋求脱困的转折。","focus":"把不安、悔与征吉分层，不将末尾吉解释成无须准备。"}],"extra":null},{"n":48,"name":"水风井","sym":"䷯","upper":"坎","lower":"巽","guaci":"改邑不改井，无丧无得，往来井井。汔至亦未繘井，羸其瓶，凶。","theme":"供给与真正可用","summary":"井以长期供水的设施讨论公共供给。城邑可变，井仍在；但井存在不等于水已经能用，汲水将成而器具损坏仍凶。六爻依次出现泥井、漏瓮、清井未用、修砌、寒泉与开放取用，学习重点在维护、取用和承接，不以有潜能代替已经产生作用。","gt":"改换城邑而不改井，井的供给无所谓增减，人来人往取水。将要汲到却未完成，弄坏水瓶，凶。","focus":"沿泥、漏、清、修、食、开放的不同状态阅读；有能力但未被采用与已实际供给必须区分，不从井字自动判断关系稳定。","yao":[{"label":"初六","text":"井泥不食，旧井无禽。","meaning":"井底有泥，水不能饮用，旧井连禽鸟也不来。问题在供给失去实际价值，不是只因年代久便有用；不能把无人取用直接等同某个现实人物毫无价值。","focus":"评价设施能否供用，不将物的失效变成人格价值判决。"},{"label":"九二","text":"井谷射鲋，瓮敝漏。","meaning":"井谷与小鱼构成供用有限的图景，盛水的瓮又破漏。射鲋训释有分歧，不定为主动捕鱼；可以确定供给和承接存在问题，但不能推成具体破产预言。","focus":"用途偏离与容器破漏是两层问题，不只笼统说运气差。"},{"label":"九三","text":"井渫不食，为我心恻，可用汲。王明，并受其福。","meaning":"井已疏通却无人饮用，令人心痛，实际上可以汲取；若王明察，人们共同受福。可用与被采用有距离，明察采用是关键条件，不能省略若的意味。","focus":"识别可用而未用，不把潜能直接当成已经获得认可。"},{"label":"六四","text":"井甃，无咎。","meaning":"用砖石修砌井壁，没有过失。此时重点在维护设施，不一定正在供水；修复和暂停使用可以同属必要过程，不能从无咎补成维修后必得何种收益。","focus":"维护有其价值，仍须区别正在修复与已经可供使用。"},{"label":"九五","text":"井冽寒泉食。","meaning":"井水清冽，寒泉可供饮用。此爻已从设施潜能走到实际取用，是明确可用的状态；但它没有给出财富、品行认证或某段关系的最终结果。","focus":"可饮用是实际功能的表达，不将清泉比喻变成事实鉴定。"},{"label":"上六","text":"井收勿幕，有孚元吉。","meaning":"井成可汲，不遮盖，有诚信，大吉。开放、可靠的供给受到肯定，不只是自己拥有资源；此处勿幕也不能扩成任何私人边界都应取消。","focus":"公共供给与私人隐私不同，开放不等于无限索取。"}],"extra":null},{"n":49,"name":"泽火革","sym":"䷰","upper":"兑","lower":"离","guaci":"巳日乃孚，元亨利贞，悔亡。","theme":"改变的时机与信任","summary":"革讨论旧安排需要改易时，如何取得信任与合适的行动条件。六爻从巩固约束、适时改动，经过反复商议，到改命与虎豹之变，末爻又说征凶、居贞吉。变革并非越快越彻底越好，理解时应同时保留时机、可信根据与停止推进的边界。","gt":"到了所说的日子才取得信任，大为通达，宜守正，悔恨消失。整理稿作巳；BUS p674／书668脚注主张读己，注明为一家之见，暂不落实日期。","focus":"本稿保留巳字，BUS p674脚注的读己意见不等于跨版本统一校定；学习重点在信任和反复确认，不把革名当作必须分手或换工作的命令。","yao":[{"label":"初九","text":"巩用黄牛之革。","meaning":"用黄牛皮牢牢巩固、约束。爻辞没有直接说发动改变，反以坚固束缚开场；可理解为尚须守住条件或控制行动，不能补成越早打破现状越吉。","focus":"革的开始也可强调约束，不能见变革主题就立即主张行动。"},{"label":"六二","text":"巳日乃革之，征吉，无咎。","meaning":"到了所说的日子才进行改变，前行吉，无咎。本稿保留巳；BUS p679／书673日名近形，须连同章首读己意见理解。保留适时而动的条件，不硬定具体日期。","focus":"字面与训读分开记录，适时改变不等于任何时候改变都吉。"},{"label":"九三","text":"征凶，贞厉。革言三就，有孚。","meaning":"出征凶，守持也有危险；变革之言反复三次达成，才有信任。前半段警示明确，后半段强调反复确认，不能挑有孚便忽略贸然前进的凶。","focus":"革言三就先作反复商定理解，不机械数三次聊天或三天。"},{"label":"九四","text":"悔亡，有孚改命，吉。","meaning":"悔恨消失，有诚信而改变命令，吉。改命是古代政令或命令变更的语境，强调改变要有可信基础，不等于个人可以凭意愿改写命运。","focus":"保留有孚条件，改命不自动等同命运翻转或必得新生。"},{"label":"九五","text":"大人虎变，未占有孚。","meaning":"大人的改变像虎的纹理那样鲜明，未占问就有信任。虎变可说明变化显著而有文理，未占有孚不应改成这套占法无需证据就能保证正确。","focus":"变化可辨与取得信任是主题，不将虎变当权势成功保证。"},{"label":"上六","text":"君子豹变，小人革面。征凶，居贞吉。","meaning":"君子的变化像豹纹，小人改变面貌；继续前进凶，安居守正吉。不同层次的变化并列，尤其指出变革后需收束，不是把表面顺从当内心认同。","focus":"征凶和居贞吉分别保留，革面不能认证他人已经真心改变。"}],"extra":null},{"n":50,"name":"火风鼎","sym":"䷱","upper":"离","lower":"巽","guaci":"元吉，亨。","theme":"承载与更新秩序","summary":"鼎是烹饪和供养的器具，卦辞有明确吉亨。六爻围绕鼎足、内容物、耳和铉展开，说明清除旧秽、充实内容与承载结构都很重要；九四折足覆食仍凶。学习可借此观察新秩序是否能真正运作，而不是只因换了形式就认定更新已经成功。","gt":"大吉，亨通。","focus":"从内容与器具两方面阅读，清理、装载、提举各需相配；不要用全卦吉亨掩盖九三受阻和九四覆食的明确风险。","yao":[{"label":"初六","text":"鼎颠趾，利出否，得妾以其子，无咎。","meaning":"鼎足翻转，便于倒出污秽；得到妾而因其子受益，无咎。后句属于古代家庭制度，保留其历史语境，不把它改成现代纳妾、生育或关系安排建议。","focus":"清除旧秽的作用与古代身份叙事分开，不推成行为规范。"},{"label":"九二","text":"鼎有实，我仇有疾，不我能即，吉。","meaning":"鼎中有实物，对方或所匹者有疾，不能靠近我，吉。仇有匹偶等古义，不能自动解释为敌人；有实与不受侵扰相连，不宜编造对方患病事实。","focus":"说明仇字古义有别，不以爻辞给现实他人作健康判断。"},{"label":"九三","text":"鼎耳革，其行塞，雉膏不食。方雨亏悔，终吉。","meaning":"鼎耳发生变化，行动受阻，野鸡膏不能享用；将下雨，悔恨减轻，最后吉。条件失配使内容虽好却用不上，后面的终吉不能被说成当下已经顺畅。","focus":"先解释有物而难用，再保留方雨及终吉的转变意象。"},{"label":"九四","text":"鼎折足，覆公餗，其形渥，凶。","meaning":"鼎足折断，倾覆公家的食物，形体沾污，凶。所承载事务与支撑能力失配导致损害，是明确的不利；不能因鼎为更新之卦就把事故说成必要的小成长。","focus":"承载失败的风险应直说，不把公餗直接套成现实公职事故。"},{"label":"六五","text":"鼎黄耳金铉，利贞。","meaning":"鼎有黄色的耳、金属的提举杠，宜守正。器具的受力与提举结构相配，利贞不是具体结果保证；颜色和材质不宜脱离语境变成择物或幸运色要求。","focus":"着重结构相配和守正，不从黄耳金铉编出饰物开运法。"},{"label":"上九","text":"鼎玉铉，大吉，无不利。","meaning":"鼎以玉为铉，大吉，无所不利。此为器具完成、提举合宜的理想场景，吉意应保留，但不能直接扩成只要占得此爻，所有现实问题都会解决。","focus":"保留充分吉辞，同时说明其器具完善的场景范围。"}],"extra":null},{"n":51,"name":"震为雷","sym":"䷲","upper":"震","lower":"震","guaci":"亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。","theme":"震动后的反应","summary":"震写突如其来的惊动与随后的秩序。卦辞从恐惧写到笑语，并以震动中不失祭器突出持守；爻辞则有逃避、受阻、往来危险和邻处受震。惊动本身不固定是好消息或坏消息，重点在真实影响、反应方式和能否稳住应守的事务。","gt":"亨通。雷震来到令人恐惧，随后笑语和乐；震惊百里，仍不失手中的匕与鬯等祭器祭酒。","focus":"惊惧、恢复与保持职责要同时阅读；七日等数字属原文情景，不直接换成当前事件的精确时间表。","yao":[{"label":"初九","text":"震来虩虩，后笑言哑哑，吉。","meaning":"震动到来，先恐惧戒惧，后来笑语和乐，吉。此爻包含先后变化，不是从头到尾都轻松；其可取之处在惊醒后的调适，不等于所有意外最终都带好结果。","focus":"先惧后笑的过程不可省略，不为现实突发事强作吉兆。"},{"label":"六二","text":"震来厉，亿丧贝，跻于九陵，勿逐，七日得。","meaning":"震动来临有危险，估计失去财贝，登上高处；不追逐，七日可得。亿与九陵有古义差异，重点保留避险与勿逐，不把七日认作一切损失的返还期限。","focus":"保留厉、失与避让条件，不能用七日得保证失物找回。"},{"label":"六三","text":"震苏苏，震行无眚。","meaning":"震动使人惊惧不安，因震而行动，没有灾咎。惊惧并非终点，此处给出行动无眚的评价，但未说任何仓促动作都正确，仍应看所应对的具体问题。","focus":"行动与惊惧相接，不把无眚推广成任意动作都安全。"},{"label":"九四","text":"震遂泥。","meaning":"震动陷在泥中。遂泥的具体训释有余地，但明确呈现动而受滞、难以伸展的状态；经文没有标出确定期限或救援来源，不补成很快会有人拉一把。","focus":"只保留受滞状态，勿凭震为动就说行动一定顺利。"},{"label":"六五","text":"震往来厉，亿无丧，有事。","meaning":"震动往来都有危险，估量没有重大丧失，仍有事务需要处理。风险与守住核心事务并存，不能只读无丧就否认危险，也不能把有事说成一定发生灾祸。","focus":"往来厉与无丧并列，分别说明风险和可能保有的部分。"},{"label":"上六","text":"震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。","meaning":"震动使人畏缩、眼神不安，前往凶；震尚在邻处而未及自身，可以无咎，但婚媾有议论。警醒与行动边界很强，不把邻处震动当现实灾害预报。","focus":"保留征凶及婚媾有言，不将邻震解释成必有邻人出事。"}],"extra":null},{"n":52,"name":"艮为山","sym":"䷳","upper":"艮","lower":"艮","guaci":"艮其背，不获其身。行其庭，不见其人，无咎。","theme":"应止处止","summary":"艮讨论停止与位置的关系，卦辞写止于背、不见其身与庭中无人，并非只倡议不做事。六爻由脚趾、小腿、腰背到身体、口颊和敦厚之止，展示局部止住、强行僵止与言语有序的差别。学习应辨明止什么、为何止，不能把一概停摆当作稳重。","gt":"止于背部，不觉其自身；行在庭中，不见其人，无咎。文字意象凝练，具体身心解释有不同传统。","focus":"以身体各部位对照不同止法，尤其保留九三强止的危险；不把不获其身直接当心理状态诊断或修炼步骤。","yao":[{"label":"初六","text":"艮其趾，无咎，利永贞。","meaning":"止住脚趾，没有过失，有利于长久守正。行动尚在起步处就能约束，体现及早辨明边界；不是说今后一切事情都不能迈出第一步。","focus":"在起步处识别应止的行动，不把永贞改成永久不动。"},{"label":"六二","text":"艮其腓，不拯其随，其心不快。","meaning":"止住小腿，不能拯救或制止它所跟随的部分，心中不快。身体上下相随使局部难以独立控制，可见止也有无能为力的一面，不宜强圆成自控成功。","focus":"保留不拯其随与不快，勿把局部停住说成整体已经安稳。"},{"label":"九三","text":"艮其限，列其夤，厉薰心。","meaning":"止在腰际，撕裂背脊肌肉，危险熏心。表达僵硬强止带来的痛苦与危险，不是教人实际伤身；也不能根据部位字词推断现实腰椎或心脏疾病。","focus":"强止的危险应保留，不把艮概括成越僵越好。"},{"label":"六四","text":"艮其身，无咎。","meaning":"止住身体，没有过失。此爻从局部进入整体自处，评价有限而平稳；经文没有要求控制他人行动，也未写出停止之后必定获得的现实奖赏。","focus":"止的对象是自身，不拿来要求别人按自己的意愿停下。"},{"label":"六五","text":"艮其辅，言有序，悔亡。","meaning":"止于口颊，使言语有次序，悔恨消失。这里不是永远不说话，而是对表达有节度、有条理；也不是压抑所有疑问或为了维持和气隐瞒关键事实。","focus":"节制表达与拒绝表达不同，重点是言有序而非沉默。"},{"label":"上九","text":"敦艮，吉。","meaning":"以敦厚的方式止定，吉。最后的吉与敦艮相连，可理解为安定而有根基的停止，不是硬压或短促恐惧；不能由此认定某件事拖得越久越有利。","focus":"敦厚之止重在根基和分寸，不把久拖当作必然吉利。"}],"extra":null},{"n":53,"name":"风山渐","sym":"䷴","upper":"巽","lower":"艮","guaci":"女归吉，利贞。","theme":"有次序的进展","summary":"渐以鸿雁逐步迁移的场景说明有次序的发展，卦辞涉及女子出嫁与守正。六爻的落脚处不同，有安稳饮食，也有不归、不育的凶与终得其所的吉。缓慢本身并不保证成功，须看每一步是否有可停留的位置、现实承接与合宜的关系安排。","gt":"女子出嫁吉，宜守正。保留古代婚嫁场景，不据卦名保证某个现实对象愿意建立关系。","focus":"逐爻辨认鸿雁的落脚处与承接条件，九三不利不可被全卦婚嫁吉覆盖；数字不直接转成现代婚育时间预测。","yao":[{"label":"初六","text":"鸿渐于干，小子厉，有言，无咎。","meaning":"鸿雁渐进到水边，小子有危险，有议论，却无咎。初步接近仍不稳，不能只取渐进就说已站稳；小子的具体所指应保留，不据此判现实儿童会遭遇危险。","focus":"起步的危险和议论都要留住，无咎不等于没有压力。"},{"label":"六二","text":"鸿渐于磐，饮食衎衎，吉。","meaning":"鸿雁逐渐到达磐石，饮食和乐，吉。落脚处稳固，并能得到适当供养，是此爻有利场景；不能仅凭饮食愉快就推断某段现实感情必定稳定。","focus":"安稳落脚与供给相连，不把一次愉快相处等同长期结果。"},{"label":"九三","text":"鸿渐于陆，夫征不复，妇孕不育，凶。利御寇。","meaning":"鸿雁到陆地，丈夫出征不回，妇人怀孕不能生育，凶，但利于防御盗寇。亲属与生育是古代场景，不可用作具体失联、流产或背叛的预测事实。","focus":"明确保留凶与防御可用的范围，勿把不利场景美化。"},{"label":"六四","text":"鸿渐于木，或得其桷，无咎。","meaning":"鸿雁渐进到树上，或能找到可栖的平枝，无咎。树未必适合雁，关键是得到足以承接的枝条，或字保留了条件性，不能将临时可栖说成永久安定。","focus":"或得其桷是有条件承接，不把可能性改写为确定结果。"},{"label":"九五","text":"鸿渐于陵，妇三岁不孕，终莫之胜，吉。","meaning":"鸿雁到达丘陵，妇人三年不孕，最终没有什么能胜过或阻止，吉。迟延与终吉并在，不能删掉前段，也不能据此向现实婚育问题许诺三年后必成。","focus":"保留等待与终吉的叙事，不按三岁替用户设医学期限。"},{"label":"上九","text":"鸿渐于陆，其羽可用为仪，吉。","meaning":"鸿雁渐进到陆地，羽毛可用作仪饰，吉。本稿作陆，BUS p735／书729爻题与释文同作陆；其他版本异文尚未校定，不擅改另一地形或许诺地位提升。","focus":"羽仪表示可供礼仪之用，不能直接换成名气或奖项。"}],"extra":null},{"n":54,"name":"雷泽归妹","sym":"䷵","upper":"震","lower":"兑","guaci":"征凶，无攸利。","theme":"婚嫁安排与合宜性","summary":"归妹以古代婚嫁制度讨论关系中的时机、身份与形式，卦辞明确征凶、无攸利，不能因婚嫁卦名便称吉。六爻则各有不同条件，既写能力受限、迟归待时，也写礼仪空有外形。学习可看见安排是否相称，但不能照搬娣妾制度作为现代关系规范。","gt":"前行有凶，没有什么利益。","focus":"全卦警示与单爻局部之吉须分别呈现；原文娣、须等身份字有训释分歧，不直接套成现实第三者的证据。","yao":[{"label":"初九","text":"归妹以娣，跛能履，征吉。","meaning":"以娣的身份随嫁，如跛者仍能行走，前往吉。它是在受限身份下评价局部可行，并非对古代婚制的现代认可，更不意味委屈自己就能获得爱情。","focus":"局部可行不等于身份安排适当，不把受限说成必然幸福。"},{"label":"九二","text":"眇能视，利幽人之贞。","meaning":"一眼受损仍能看见，有利幽居之人守正。能力并非完整但仍可自守，是此爻层次；不能从眇字诊断现实眼疾，也不把幽人理解成永远不与人交往。","focus":"保留受限与自守，不为用户编造伴侣缺陷或健康问题。"},{"label":"六三","text":"归妹以须，反归以娣。","meaning":"以须的身份出嫁，又返回作为娣随嫁。须有待、贱役身份等不同解释，关系安排发生降退或重整是可读线索，不确定部分应保留而非补出人物故事。","focus":"须字不强定一种身份，更不能据它认证婚外关系。"},{"label":"九四","text":"归妹愆期，迟归有时。","meaning":"出嫁错过预定日期，延迟出嫁仍有合适的时候。迟并不直接等于无望，也不保证无限期等待终有结果；经文未说何时，不能代填某月某日。","focus":"保留迟归有时的余地，不把未给日期变成无限等待承诺。"},{"label":"六五","text":"帝乙归妹，其君之袂，不如其娣之袂良。月几望，吉。","meaning":"帝乙嫁女，主嫁者的衣袖不如陪嫁娣者华美，月将满，吉。内在安排与外在华饰有别，古代王室故事不直接指现实家境或财力高低。","focus":"勿以服饰比较推财富等级，月几望也不自动作应期。"},{"label":"上六","text":"女承筐无实，士刲羊无血，无攸利。","meaning":"女子捧筐却没有实物，男子杀羊却没有血，没有利益。礼仪所需的实质缺席，是明确落空，不应说只是流程稍慢；也不凭空指定谁在现实中作假。","focus":"形式无实是核心，保留无攸利而不编造欺骗动机。"}],"extra":null},{"n":55,"name":"雷火丰","sym":"䷶","upper":"震","lower":"离","guaci":"亨，王假之，勿忧，宜日中。","theme":"盛大与遮蔽","summary":"丰讨论盛大、充足的时刻，卦辞以日中说明宜把握明盛而不必忧虑。爻辞却多次写日中见斗、见沫和屋大而人空，显示外在丰盛也可能伴随遮蔽。学习应同时检查亮处与看不见处，不能把丰机械等同发财，也不把衰落预先宣布为已经发生的事实。","gt":"亨通，王来到盛大之境，不必忧虑，宜像日正当中。","focus":"把日中与被遮蔽的天光对照，留意资源丰厚是否真的转成清晰与可用；不要把盛极必衰当无需事实的固定时间预言。","yao":[{"label":"初九","text":"遇其配主，虽旬无咎，往有尚。","meaning":"遇到相配的主人，虽旬无咎，前往受到推重。旬有相等或十日等训释，宜保留分歧；可以确定的是遇到相配承接与向前有尚，不强行落实十日期限。","focus":"匹配与承接是场景条件，旬字不直接换成十天应期。"},{"label":"六二","text":"丰其蔀，日中见斗，往得疑疾，有孚发若，吉。","meaning":"遮蔽物很大，正午竟看见北斗；前往会遭疑忌，有诚信能够启发、感通则吉。遮蔽与疑虑不是不存在，吉须与孚发的条件一起理解。","focus":"先说明可见度不足与被疑风险，不以末尾吉抹去障碍。"},{"label":"九三","text":"丰其沛，日中见沫，折其右肱，无咎。","meaning":"遮蔽物浓厚，正午能见微小星象，又折断右臂，却无咎。沛、沫的具体字义有异说，明确的受蔽与失能应保留，不用于预测现实肢体损伤。","focus":"保留字义疑处，无咎并不等于没有损害或能力限制。"},{"label":"九四","text":"丰其蔀，日中见斗，遇其夷主，吉。","meaning":"遮蔽物使正午见到北斗，却遇到相匹的主人，吉。与前爻受蔽情景相近，差别在获得合适的相遇；不能据此保证黑暗处境一定已有贵人等候。","focus":"相遇带来不同条件，须有现实回应才可联系具体人物。"},{"label":"六五","text":"来章，有庆誉，吉。","meaning":"招来有文采、才能或显明之人，获得庆贺和声誉，吉。来章有不同语法理解，可保留明德彰显的方向，不补成指定人才、职位或必得名声。","focus":"庆誉属原文吉意，不把来章直接换成某人的到来。"},{"label":"上六","text":"丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。","meaning":"屋宇宏大，家中遮蔽，窥门却寂静无人，三年不见，凶。外表丰盛与内部空寂强烈相对，不能淡化成单纯喜欢独处，也不推断现实住宅会空置。","focus":"形式盛大与实质空缺要并读，三岁非当前事件期限。"}],"extra":null},{"n":56,"name":"火山旅","sym":"䷷","upper":"离","lower":"艮","guaci":"小亨，旅贞吉。","theme":"客居的依托与分寸","summary":"旅讨论身处外地、暂居或依托不足时的行为分寸，卦辞只说小亨并强调旅贞。六爻围绕住处、资财、童仆、誉命与焚巢展开，显示暂时有资源不等于拥有稳固归属。它可帮助思考位置和依托，但不自动预告出差、迁居或异地恋。","gt":"有小的亨通；行旅之中守正则吉。","focus":"分别观察住处、资源与可信支持是否齐备，旅境的有限有利不能放大为万事顺利；焚舍等意象不作现实事故预报。","yao":[{"label":"初六","text":"旅琐琐，斯其所取灾。","meaning":"旅途中琐碎卑下、拘泥失度，由此招来灾患。重点是处于客地时行为不合宜的代价，不是所有小事都不值得管，更不能据此归罪遭遇困难的旅人。","focus":"辨认失度行为而非否定细节，勿用灾字编造事故。"},{"label":"六二","text":"旅即次，怀其资，得童仆贞。","meaning":"旅人到达住处，怀有资财，又获得可信的童仆。住处、资源和支持同时具备，形成相对可安的场景；童仆属于古代身份，不换成现代某人必须服侍。","focus":"三种依托分别确认，不能只因有钱就认定客居无忧。"},{"label":"九三","text":"旅焚其次，丧其童仆，贞厉。","meaning":"旅居的住处被焚，失去童仆，守持也有危险。依托与支持同时损失，是强烈警示；不能将其说成普通换地方，也不可据此预报具体火灾。","focus":"保留支持失落和贞厉，区分象征解读与现实灾害事实。"},{"label":"九四","text":"旅于处，得其资斧，我心不快。","meaning":"旅人有所停处，得到资财和斧具，心中仍不快乐。物资具备不代表归属与心境问题已解决，斧的具体物义有讨论，不宜直接换成权力或武力。","focus":"外部资源与内心安顿不同，不把有资斧一概判圆满。"},{"label":"六五","text":"射雉一矢亡，终以誉命。","meaning":"射雉时损失一支箭，最终获得声誉与任命。付出和认可并存，不能只讲箭失就判全凶，也不能把誉命解释成每次小损失都必定换来大回报。","focus":"先留住具体付出，再读终誉命，不制造稳赚交换关系。"},{"label":"上九","text":"鸟焚其巢，旅人先笑后号啕。丧牛于易，凶。","meaning":"鸟巢被焚，旅人先笑后大哭，又在易处失牛，凶。先乐后失的落差与失所之痛明显，易字仍有异解，不能用含糊乐观话把凶改成无关紧要。","foc
