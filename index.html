us":"明确后段不利，不据焚巢、丧牛推定现实灾害或失财数额。"}],"extra":null},{"n":57,"name":"巽为风","sym":"䷸","upper":"巽","lower":"巽","guaci":"小亨，利有攸往，利见大人。","theme":"渐入与稳定方向","summary":"巽有顺入、渐入之义，卦辞肯定小亨、前往和见大人，但各爻并非都称柔顺有利。初六进退不定、九三频巽和上九过度卑伏都带限制，九五则突出终局与前后准备。学习重点是以稳定原则推动沟通，不能把巽顺解释成无限迁就或反复试探。","gt":"有小的亨通，宜有所前往，宜见大人。","focus":"区别有原则的渐入、反复的退缩和过度卑伏；先庚后庚保留为原文时序，不未经依据替当前事项计算日期。","yao":[{"label":"初六","text":"进退，利武人之贞。","meaning":"进退不定，有利于武人那样的坚定守正。此处以武人之贞对治摇摆，并不是鼓励动武；说明巽的柔顺也需要可持守的方向，不能只剩反复退让。","focus":"坚定不等于攻击，针对的是进退无定而非一切柔和。"},{"label":"九二","text":"巽在床下，用史巫纷若，吉无咎。","meaning":"巽顺到床下，使用史巫纷繁地办理相关礼事，吉，无咎。古代礼仪场景可反映谦下与澄清，不能直接转成现代必须请巫师或做仪式的建议。","focus":"保留史巫的时代语境，不以祭仪描写要求现实付费操作。"},{"label":"九三","text":"频巽，吝。","meaning":"屡次巽顺、反复变动，有吝。频字表现反复，提醒顺从若没有稳定原则会令人窘迫；经文没有说谦和本身有错，不能倒向凡事强硬的另一极。","focus":"问题在反复失定，不把所有让步或礼貌都解释成软弱。"},{"label":"六四","text":"悔亡，田获三品。","meaning":"悔恨消失，田猎获得三类猎物。场景呈现行动有所收获，三品是古代类别表达，不宜补成三笔钱、三位对象或三项工作均必定成功。","focus":"收获保留为文字吉意，数字不落实现实获利项目。"},{"label":"九五","text":"贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。","meaning":"守正吉，悔恨消失，没有不利；开始不佳而终有结果，庚前后三日安排则吉。时间与更改的解释存在传统差异，不把它擅自固定成现代办事历法。","focus":"无初有终与前后准备并读，庚的用法不自动转成应期。"},{"label":"上九","text":"巽在床下，丧其资斧，贞凶。","meaning":"过度巽顺到床下，丧失资财与斧具，守持如此凶。与九二同样床下意象却评价不同，说明须结合所处层次，不可一见谦下便保证有益。","focus":"过度卑伏与能力损失是警示，不把巽全卦固定判吉。"}],"extra":null},{"n":58,"name":"兑为泽","sym":"䷹","upper":"兑","lower":"兑","guaci":"亨，利贞。","theme":"喜悦与诚信交流","summary":"兑以喜悦、交流为主题，卦辞仍附利贞，说明使人高兴不等于已经合宜。六爻从和悦、信悦，写到迎合取悦、思量不安和信任剥蚀。学习可辨认真诚的相处与为了取悦而放弃判断的差别，不能因笑语、热络或卦名悦就推定对方完整心意。","gt":"亨通，宜守正。","focus":"比较和兑、孚兑与来兑，观察喜悦是否真实且有原则；不能用气氛愉快代替事实核对，也不为讨好而修改不利解释。","yao":[{"label":"初九","text":"和兑，吉。","meaning":"和谐而喜悦，吉。和不是强迫一致，而是相处协调的场景；原文没有说为和气就应取消分歧，更没有直接确认现实对象心中全部想法。","focus":"和悦保留差异空间，不把表面融洽当作内心事实。"},{"label":"九二","text":"孚兑，吉，悔亡。","meaning":"有诚信的喜悦，吉，悔恨消失。快乐与可信的表达结合，肯定的不是一味说好听的话；现实中诚信仍应由言行核对，不能靠这个孚字直接认证某人。","focus":"信实与喜悦缺一不可，不以爻辞替人开诚实证明。"},{"label":"六三","text":"来兑，凶。","meaning":"前来求悦或迎合取悦，凶。来兑有不同细读，但它与前两爻的和、孚形成明显区别；不能将凶改成只是太热情，也不应据此指控某人有意操纵。","focus":"明确来兑的不利，分析迎合风险而不捏造实际动机。"},{"label":"九四","text":"商兑未宁，介疾有喜。","meaning":"商量斟酌如何相悦，尚未安宁；能介除疾弊，则有喜。商兑与介疾有训释余地，可保留取舍和纠偏的过程，不把尚未安定写成已经完全和好。","focus":"未宁是当前限制，有喜与辨别排除弊病的条件相连。"},{"label":"九五","text":"孚于剥，有厉。","meaning":"信任会剥蚀、损害自己的方面，有危险。剥可从消损理解，并不自动等于某个已确定的坏人；应警惕信任对象与依据，而不是凭卦宣布对方在骗。","focus":"危险来自信任失当的可能，不把象征直接认作欺骗事实。"},{"label":"上六","text":"引兑。","meaning":"引导、牵引而使人喜悦。此句未直接写吉凶，亦有被引而悦等解释，不宜擅补好坏；可讨论影响与感染，但不能把他人感受当作已经确定。","focus":"经文未判吉凶则保留，不为了明确而补造肯定结论。"}],"extra":null},{"n":59,"name":"风水涣","sym":"䷺","upper":"巽","lower":"坎","guaci":"亨。王假有庙，利涉大川，利贞。","theme":"疏散与重新联结","summary":"涣既可指离散，也可指疏解凝滞，卦辞以宗庙、涉川和守正说明散与聚的关系。六爻从救援、奔向支点，到散其躬、散其群和远离伤害，所散对象不同，意义也不同。学习时须先问散开的是什么，不能把涣一概断成感情破裂或障碍自动消失。","gt":"亨通，王来到宗庙，宜渡过大河，宜守正。","focus":"逐项区分救援、支点、自我、群体与伤害，不把所有散都评成坏；也不据宗庙聚合场景保证某人回归。","yao":[{"label":"初六","text":"用拯马壮，吉。","meaning":"用强壮的马来救援，吉。爻辞把可用的援助置于开端，强调解散困厄时的及时支持；并未指定援助者，也不意味着所有危机都会有人自动解决。","focus":"有力救援是条件，别把马的意象补定为职业或生肖人物。"},{"label":"九二","text":"涣奔其机，悔亡。","meaning":"离散时奔向可凭依的几案或支点，悔恨消失。机字可作几，重点是找到可靠依托；不能由相生等其他材料反推这个人已具有可靠条件。","focus":"凭依应有现实基础，不把奔向某人本身当作安全保证。"},{"label":"六三","text":"涣其躬，无悔。","meaning":"涣散自身，没有悔恨。散其躬可理解为放下拘于一己的执着或私身牵累，具体传统有差异；不能借此否定自我保护或要求放弃个人权利。","focus":"自我局限与自我价值不同，不把舍己变成无条件牺牲。"},{"label":"六四","text":"涣其群，元吉。涣有丘，匪夷所思。","meaning":"散开原有群体，大吉；离散中又有丘聚，并非平常所能设想。散与聚并列，提示重组关系的可能，不等于要求主动破坏任何现有团队。","focus":"群体重组不只是解散，不能凭卦决定排斥或拆散他人。"},{"label":"九五","text":"涣汗其大号，涣王居，无咎。","meaning":"像汗散出那样发布大号令，散开王的积居或相关聚集，无咎。王居具体所指有不同解释，此处保留公共号令与疏散，不补成国库金额或现实政策预言。","focus":"大号与王居保留古代公共事务语境，疑处不硬定。"},{"label":"上九","text":"涣其血，去逖出，无咎。","meaning":"散去血伤或伤害，远远离开、脱出，没有过失。血与逖的训释仍有细分，但整体可见远离伤害的方向，不能据此预测现实流血或医疗康复。","focus":"脱离危害是学习主题，不从血字推断已经发生伤病。"}],"extra":null},{"n":60,"name":"水泽节","sym":"䷻","upper":"坎","lower":"兑","guaci":"亨。苦节不可贞。","theme":"限度与适度","summary":"节讨论限制、节度与可持续的安排。卦辞既说亨，也明言苦节不可贞，不能把约束越多越好当作结论。初九不出户无咎，九二不出门却凶，显示相同行为因时位而异。学习应关注边界为何设、何时该行和是否过度，不以死守规则代替判断。","gt":"亨通。使人困苦的节制，不宜固守。","focus":"比较不出户与不出门、安节与苦节，辨明适度因情境而变；不能用节卦为苛刻自律或限制他人自由背书。","yao":[{"label":"初九","text":"不出户庭，无咎。","meaning":"不走出门户内的庭院，没有过失。起初宜约束行动是本爻场景，不能脱离处境要求永远闭门；与九二的凶对照，正说明止行没有一条固定口令。","focus":"不出在此无咎，不可跨爻推广成所有时候都应等待。"},{"label":"九二","text":"不出门庭，凶。","meaning":"不走出门庭，凶。与初九相近的行为得到不同评价，提示错过可行动的时机也会失当；不能用节制二字把不行动一律包装成稳妥。","focus":"明确不出也可能失当，勿因害怕风险而抹去此爻凶。"},{"label":"六三","text":"不节若，则嗟若，无咎。","meaning":"不加节制，因而叹息，没有过失。无咎可涉及知悔而不再归咎等解释，但失节导致嗟叹很明确；不宜只取无咎便说纵任没有代价。","focus":"先承认失节后果，保留无咎的解释边界而不替放纵开脱。"},{"label":"六四","text":"安节，亨。","meaning":"安然接受合宜的节制，亨通。安节意味着限制与实际承受相协调，不是麻木地忍受所有限制；可从稳定、可持续的安排理解其有利。","focus":"安适与合宜相配，不把所有被迫忍受都称为安节。"},{"label":"九五","text":"甘节，吉，往有尚。","meaning":"节制甘美而可接受，吉，前往受到推重。制度或行为有节而不苦，是此爻重点，不能只看甜美就改成没有边界，也不保证提出限制必被欢迎。","focus":"甘节仍是节，关注可承受的边界而非取消规则。"},{"label":"上六","text":"苦节，贞凶，悔亡。","meaning":"苦涩严苛的节制，固守则凶，悔恨消失。苦节是明确警示，无论对悔亡如何细读，都不能把贞凶抹掉，尤其不可主张越痛苦越有成效。","focus":"苦节不可无限坚持，悔亡不等于严苛方式本身正确。"}],"extra":null},{"n":61,"name":"风泽中孚","sym":"䷼","upper":"巽","lower":"兑","guaci":"豚鱼吉，利涉大川，利贞。","theme":"诚信与真实回应","summary":"中孚围绕内在诚信及其感通展开，卦辞有豚鱼吉、涉川与守正。六爻从有所准备、鹤鸣相和，写到情绪随对手起伏、亲密牵系与声音过高。真诚不只是自我宣称，也不保证他人回报；学习应区分真实回应与空泛声势，不能据卦认证某人没有隐瞒。","gt":"诚信能感及豚鱼等微物而吉，宜渡过大河，宜守正。豚鱼具体取义有异说，此为学习性理解。","focus":"把内在可信、可见回应与高扬声势分开；孚字是原文主题，不是他人动机或现实陈述真假的鉴定结果。","yao":[{"label":"初九","text":"虞吉，有它不燕。","meaning":"有所预备、安定则吉，若有别的牵念便不能安宁。虞有安、预备等训释，重点在专一与杂念的差别，不据有它就认定当事人另有恋爱对象。","focus":"有它不能直接等同第三者，先理解心志与安排的分散。"},{"label":"九二","text":"鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。","meaning":"鹤在幽处鸣叫，幼鹤相应；我有美好的酒爵，愿与你分享。鸣与和、拥有与分享形成相互回应的画面，不等于现实某人已经与你同心。","focus":"回应要从实际行为辨认，不能凭相和意象确定爱情。"},{"label":"六三","text":"得敌，或鼓或罢，或泣或歌。","meaning":"遇到相对的对手，时而鼓动时而停止，时而哭泣时而歌唱。情绪和行动随外在牵动而不稳，敌可指相对者，不必直接解释成仇敌或破坏关系的人。","focus":"把往复情绪作为主题，不从得敌捏造现实敌人。"},{"label":"六四","text":"月几望，马匹亡，无咎。","meaning":"月亮将满，失去马的匹配或同伴，没有过失。马匹亡可从离开私相依附等角度理解，仍有异解；不能据此判断必然失恋或某个生肖对象离去。","focus":"月与马保留意象层，不把亡自动对应现实人员损失。"},{"label":"九五","text":"有孚挛如，无咎。","meaning":"有诚信，紧密牵系，没有过失。挛如写相连之状，可理解为信任带来的凝聚，不能据此许可强制绑定，也不代表另一方已经同意长期关系。","focus":"信任应容许自主，紧密相连不等于可以忽视边界。"},{"label":"上九","text":"翰音登于天，贞凶。","meaning":"鸡鸣般的声音升到天上，固守如此凶。翰音通常联系鸡鸣，声势高而实质不足是常见学习线索，但不把它硬定成某人夸口欺骗的事实。","focus":"检查声实是否相称，不能只凭此爻给现实人物定罪。"}],"extra":null},{"n":62,"name":"雷山小过","sym":"䷽","upper":"震","lower":"艮","guaci":"亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上，宜下，大吉。","theme":"小事与尺度","summary":"小过讨论稍有过越时的尺度，卦辞明确可小事、不可大事，并以飞鸟之音提示宜下不宜上。六爻有飞越失当、不过度接近尊位、提防与过而不遇，说明谨慎也要有对象。它不是任何小事必成，更不是用小字把明显风险说成无足轻重。","gt":"亨通，宜守正；可以做小事，不可做大事。飞鸟留下声音，不宜向上，宜向下，大吉。","focus":"先分清所问事项的尺度，再读高下和遇过；不能只取大吉而删掉不可大事，也不把飞鸟当实际航行事故预兆。","yao":[{"label":"初六","text":"飞鸟以凶。","meaning":"飞鸟因飞动而招凶。句子短而警示明确，可从超过可承受范围理解，但经文未写具体何种事；不可无据预测航班、鸟类或某人出行会出事故。","focus":"保留飞动失度的凶意，不落实为现实灾难预言。"},{"label":"六二","text":"过其祖，遇其妣。不及其君，遇其臣，无咎。","meaning":"越过祖而遇妣，不到君位而遇臣，无咎。祖妣君臣属于古代位序叙事，常用于理解不过分进取；不能凭此认定现实女性长辈必提供帮助。","focus":"角色与位序作为结构理解，不自动对应家庭成员。"},{"label":"九三","text":"弗过防之，从或戕之，凶。","meaning":"未能充分或加倍防备，随后可能遭受伤害，凶。从、过的句读与训释有分歧，不指定加害者；警惕防护不足，并不表示现实中已有人意图伤害自己。","focus":"防备不足的风险不等于已有凶手，疑义须保留。"},{"label":"九四","text":"无咎，弗过遇之。往厉必戒，勿用永贞。","meaning":"没有过失，不过分而相遇；前往有危险，必须戒备，不宜长期固守。弗过遇之有异读，仍可确定的是往厉、必戒与勿永贞，不应只抽无咎。","focus":"保留行进风险及不可僵持，不把初句覆盖后文限制。"},{"label":"六五","text":"密云不雨，自我西郊。公弋取彼在穴。","meaning":"密云聚集却没有下雨，从西郊而来；公射取穴中的猎物。云未成雨与另寻具体目标并列，不能把西郊或在穴硬套现实地址、人物藏身处。","focus":"聚势未落实与目标可取不同，别从云雨推断天气事实。"},{"label":"上六","text":"弗遇过之，飞鸟离之，凶，是谓灾眚。","meaning":"没有相遇而超过了，飞鸟遭离罹，凶，称为灾眚。离字可读罹等，表现过越失度的后果；不能为了温和而删凶，也不编造具体灾种和日期。","focus":"过越后果须明确，灾眚留在文字警示层而非事件保证。"}],"extra":null},{"n":63,"name":"水火既济","sym":"䷾","upper":"坎","lower":"离","guaci":"亨小，利贞。初吉终乱。","theme":"完成后的维持","summary":"既济是已经渡过、已有成就，卦辞却同时提出初吉终乱。六爻写制轮、失物、长期征战、预备补漏与祭礼诚意，最后又以濡首示警。学习重点在完成以后怎样维持，而非把已有成果当永久保障；已经渡过一个阶段，也不等于所有问题都已解决。","gt":"小有亨通，宜守正；开始吉，最终可能转乱。亨小亦有不同断句理解，应保留版本解释空间。","focus":"完成与维持分开看，尤其关注准备、节制与末段危险；书中七日三年不自动成为当下事件的精确应期。","yao":[{"label":"初九","text":"曳其轮，濡其尾，无咎。","meaning":"拖住车轮，弄湿尾巴，没有过失。制动与受湿同时出现，可以看作不急于越过而守住分寸；不能将濡尾一概判坏，也不把无咎扩大成任何冒进无妨。","focus":"制轮的节制意义与受湿并读，勿只凭物象机械判吉凶。"},{"label":"六二","text":"妇丧其茀，勿逐，七日得。","meaning":"妇人失去车上的遮蔽物，不必追逐，七日可以得到。茀有车蔽等解释，勿逐是本场景取向，不保证现实失物一定七日找回，更不直接指伴侣回心。","focus":"失与复得保留原叙事，不把七日作普遍返回期限。"},{"label":"九三","text":"高宗伐鬼方，三年克之，小人勿用。","meaning":"高宗征讨鬼方，三年才攻克，小人不要任用。耗时与任人条件同在，不能只说最终会赢；古战事也不直接支持现实争斗、诉讼或商业竞争必胜。","focus":"耗时和任人限制均须保留，三年不是当前问事倒计时。"},{"label":"六四","text":"繻有衣袽，终日戒。","meaning":"准备好修补用的布絮之类，整日戒备。繻与袽的具体器物训释有分歧，重点在事先备补和持续防漏，不据此预测某物一定破损或灾难必来。","focus":"防备不等于事故已经确定，字物疑义应明示保留。"},{"label":"九五","text":"东邻杀牛，不如西邻之禴祭，实受其福。","meaning":"东邻杀牛大祭，不如西邻举行简薄的禴祭，真正承受福泽。祭品规模与实效有别，不直接说贫者胜富者，也不要求用户以祭祀换取现实好运。","focus":"对照形式规模与实质，不把东邻西邻落实为现住址。"},{"label":"上六","text":"濡其首，厉。","meaning":"头部也被水浸湿，危险。与初爻仅湿尾相对，表现越界或失去分寸后的风险；不能因既济意味着完成，就说此处危险只是无关紧要的小插曲。","focus":"末段风险不能被成功主题遮蔽，不据濡首诊断疾病。"}],"extra":null},{"n":64,"name":"火水未济","sym":"䷿","upper":"离","lower":"坎","guaci":"亨。小狐汔济，濡其尾，无攸利。","theme":"未成中的配合与节制","summary":"未济是尚未完成，卦辞仍保留亨的可能，同时以小狐近渡却湿尾说明最后阶段也会失手。六爻既有濡尾、征凶，也有守正、获赏和光明之吉，末尾饮酒又警惕失度。它不是永久失败的标签，应把尚缺的条件、可行的行动与完成前后的分寸分开理解。","gt":"可以亨通；小狐狸将要渡过，却弄湿尾巴，没有利益。接近完成不等于已经完成。","focus":"不要从未字判永不成功，也不因亨字忽略征凶；各爻的警示与有利条件分别保留，之卦不固定作为最终结局。","yao":[{"label":"初六","text":"濡其尾，吝。","meaning":"弄湿尾巴，有吝。刚开始就出现渡水不利的情景，可讨论准备不足或行动不相称，但经文没有明确说明是谁犯错，也不能据此认定整个过程必然失败。","focus":"保留初步不利，不把一次受挫推广为永远没有可能。"},{"label":"九二","text":"曳其轮，贞吉。","meaning":"拖住车轮，守正吉。尚未渡过时能约束前冲，反受到肯定；不是说一切等待都正确，而是节制与适当持守相配，不能擅补等待多久会获得什么。","focus":"制动不是取消目标，守正条件与行进节奏要一起读。"},{"label":"六三","text":"未济，征凶，利涉大川。","meaning":"尚未渡过，前进凶，却又说宜涉大川。两句存在表面张力，应保留不同动作、条件或读法的解释空间，不能为求单一答案删去其中一句。","focus":"征凶与利涉大川并陈，明确条件未充分展开，勿强行统一。"},{"label":"九四","text":"贞吉悔亡，震用伐鬼方，三年有赏于大国。","meaning":"守正吉，悔恨消失；奋起征讨鬼方，三年得到大国的赏赐。它包含长期行动和事后认可，不能仅凭三年有赏就许诺现代项目或感情届时必成。","focus":"古战事与现代问项不直接互换，三年保留叙事时长。"},{"label":"六五","text":"贞吉无悔，君子之光，有孚吉。","meaning":"守正吉，没有悔恨；君子的光明，有诚信而吉。肯定的重心是守正、光明和可信，不是名号或自我感觉；不能据君子一词认证现实某人的善良。","focus":"吉与贞孚相连，不用身份称呼替代实际言行核查。"},{"label":"上九","text":"有孚于饮酒，无咎。濡其首，有孚失是。","meaning":"怀诚信饮酒，没有过失；若喝到头部也湿了，就失去应有的分寸。有孚失是的断读有分歧，但前后明显对照适量与过度，不能只取饮酒无咎。","focus":"保留信实也可能失度的警示，不将本爻作为饮酒建议。"}],"extra":null}],"keymap":{"111111":1,"000000":2,"100010":3,"010001":4,"111010":5,"010111":6,"010000":7,"000010":8,"111011":9,"110111":10,"111000":11,"000111":12,"101111":13,"111101":14,"001000":15,"000100":16,"100110":17,"011001":18,"110000":19,"000011":20,"100101":21,"101001":22,"000001":23,"100000":24,"100111":25,"111001":26,"100001":27,"011110":28,"010010":29,"101101":30,"001110":31,"011100":32,"001111":33,"111100":34,"000101":35,"101000":36,"101011":37,"110101":38,"001010":39,"010100":40,"110001":41,"100011":42,"111110":43,"011111":44,"000110":45,"011000":46,"010110":47,"011010":48,"101110":49,"011101":50,"100100":51,"001001":52,"001011":53,"110100":54,"101100":55,"001101":56,"011011":57,"110110":58,"010011":59,"110010":60,"110011":61,"001100":62,"101010":63,"010101":64},"quick":[{"title":"起卦解读速查册","lead":"从提问、记币到查原文，把每一步分开记录。先保留完整输入，再作解释；本册供日常学习和复盘使用。","sections":[["怎样使用","第一次使用先读第2至4页。已经排好卦时，可直接看第5至8页。六十四卦的逐爻学习解释见主册，易错练习另册提供。"],["材料分层","经典文字来自项目经文整理稿，尚非全本校勘本；白话是学习解释。66例的S2验收仅说明转录与所验原页相符；20条短段已有回源记录，仍待独立确认；1558项总库属于候选检索材料。"],["不把不确定藏起来","卦形变化可以计算。解释与现实预测是另一层；他人内心、过去隐情和尚未发生的结果，不因排卦正确就得到证明。"]]},{"title":"先确定问题属于哪一类","lead":"保留原问题，说明可以解释的部分。必要时提出拆分，由提问者选择，不偷偷换题。","sections":[["选择与行动","A/B选择：先确认两个选项真实可选、比较标准相同。行动方向：说明要推进、等待还是收缩什么。不能只数两卦各有几个吉字来比较。"],["结果与过程","可观察结果：谁在何期限内完成什么。过程风险：关注哪个环节及可观察信号。应期：原段没有日期依据时，不补月份、天数。"],["动机与过去","他人内心、欺骗意图、过去隐情通常无法靠卦区分，应列出现实待核证据。可以解释意象，不能把意象换成事实。"],["总评与专业决定","幸福、对的人等总评先澄清标准。他人同意须由对方表达；医疗、法律或高风险财务判断须结合事实与专业意见。"]]},{"title":"十元面与马面怎样记","lead":"本项目约定：10元面为阳，马面为阴。每次三枚，共六次；第1次为初爻，第6次为上爻。","sections":[["四种组合","三个10元面＝9老阳，阳爻动变阴。两个10元一个马＝7少阳，阳爻静。两个马一个10元＝8少阴，阴爻静。三个马＝6老阴，阴爻动变阳。"],["不要沿用不明币面","别人只说字、背、正、反时，先确认各是哪一面。若只有五次或顺序不明，补清原始记录后再排，不补猜。"],["一行保存原始数据","记录日期、原问题、币面约定、六次组合及数值序列。例：7、9、9、7、8、7。原问题与后来的解释各自保留，避免事后改题。"]]},{"title":"从六爻到本卦和之卦","lead":"记录顺序从下向上，卦图显示从上向下。初二三组成下卦，四五上组成上卦。","sections":[["八卦的位序","以下三位数均自下而上：乾111、坤000、震100、巽011、坎010、离101、艮001、兑110。卦名通常先上卦后下卦。"],["先看本卦","7和9都画阳，6和8都画阴；由六条阴阳排成本卦。阳爻名称为初九、九二、九三、九四、九五、上九；阴爻相应为初六、六二、六三、六四、六五、上六。"],["再看变化","只把9变为阴、6变为阳，7和8保持不变。重新取上下卦得到之卦；没有6或9则无动爻，记录静卦，无之卦。"],["校验例","7、9、9、7、8、7：下乾上离，为火天大有；九二、九三动。变后下震上离，为火雷噬嗑。"]]},{"title":"动爻多少与读取约定","lead":"排出动爻不等于已经决定取辞方法。先把全部动爻列全，再说明本次采用的读法。","sections":[["静卦与单爻动","静卦可先以本卦卦辞作为学习入口。单爻动时列出该爻原文，并与本卦和问项一起阅读；不要用之卦另一个爻代替所问动爻。"],["多爻动","保留所有动爻，不挑最吉的一条。若没有约定，先分列各爻文字及分歧，不强制合成一个吉凶结果。传统有不同读法，不能把任一家说成经文唯一规定或高岛统一规则。"],["乾坤六爻全动","乾六爻全动时，动爻正名为初九至上九；另列用九。坤六爻全动时，动爻为初六至上六；另列用六。如何采用用九、用六或之卦，须说明所用约定和依据。"],["没有固定比例","本卦、动爻、之卦分别有什么文字依据，应逐项说明。不使用20%、50%等未经验证的固定权重，也不默认本卦过去、之卦未来。"]]},{"title":"怎样给出明确但不过度的判断","lead":"判断针对具体问项，不给64卦永久贴好卦或坏卦标签。明确包括明确地说未决。","sections":[["偏顺与偏阻","偏顺：相关文字对问项有支持、推进或有利条件。偏阻：提示阻隔、损害或不利条件。均须指出原文、适用条件和不能推出什么。"],["中性与未决","中性：确有可说明的得失并存，或对本问项没有明确正负。未决：材料不足、问题不适配或矛盾未消解。不要把不知道写成中性，也不要为了明确编出确定答案。"],["反迎合双向适用","原文有不利就保留，不因期待美化；原文有吉辞也不因用户说坏而抹去。吉、凶、无咎、吝、厉含义不同，不能只抽一个字。"],["限制与反证","说明哪些现实事实会使当前延伸不成立。例如把对方愿意联系作为前提时，对方明确拒绝或持续失联，就应停止沿用这一前提。"]]},{"title":"怎样查项目里的资料","lead":"先对准卦、爻、问项，再查来源资格。相似故事可以启发阅读，不能替代对应证据。","sections":[["从入口开始","项目入口为docs/协作/项目总入口与全量研究分期_20261018.md；日常资料入口为知识库/正常查询入口.md。工具/query_yiduan.py区分已验案例、20条短段和候选。"],["命中不等于可直接使用","外交占例不能直接当婚姻判语。原文的必、年数、身份须保留原问项与语境，不能当作现实保证或自动映射自己；缺对应材料时保留缺口。"],["回源时检查什么","书名版本、PDF页与印刷页、段落起止、问项标签、跨页续文、疑字。只有实际看清原页才说已查看；看不到就停止依赖该部分，不按版式补写。"],["新想法怎样保存","用户明确要求记下来后，事实、原文、解释、待核想法分开追加到指定记录；不将记忆中的推测升级为事实或规则。修改前看Git并保护已有改动。"]]},{"title":"一次完整解读的记录格式","lead":"原文解释与主观引申分别输出，使以后能看清依据和分歧。","sections":[["输入与排卦","日期与原问题；问题类别；已知事实；币面约定；六次数值；本卦；动爻；之卦或静卦；采用的读取约定。"],["原文层","相关卦辞与爻辞；字词解释；所引高岛材料的问项、来源页和资格。没有对应材料就写未命中，不跨问项补齐。"],["解释层","先概括原文意思，再标注主观引申。说明偏顺、偏阻、中性或未决的依据与条件；不把象征性叙事当作他人内心或未来事实。"],["复盘层","记录现实待核事项、限制与反证、结果判据和复盘期限。到期按起初判据记录实现、未实现或无法判断，不事后换标准。"]]}],"exercises":[{"id":1,"question":"三个马、两个马一个10元、两个10元一个马、三个10元分别记作多少？哪些动？","answer":"依次为6、8、7、9。6老阴动变阳，9老阳动变阴；8少阴、7少阳静。","reason":"阴阳组合与动静要分别记，不能把两马一10元记成老阴。"},{"id":2,"question":"数值7、6、8、7、7、8，按初至上排。求本卦、动爻、之卦。","answer":"泽雷随，六二动，之卦兑为泽。","reason":"下震100，上兑110；六二阴变阳后下卦成兑。"},{"id":3,"question":"数值9、7、7、8、6、8。求本卦、动爻、之卦。","answer":"地天泰，初九和六五动，之卦水风井。","reason":"下乾111，上坤000；变化后下巽011，上坎010。"},{"id":4,"question":"数值8、8、8、7、8、7。有没有之卦？","answer":"火地晋，静卦，无之卦。","reason":"六次只有7与8，没有老阴或老阳。静爻不会因为想看结果而自动变。"},{"id":5,"question":"六次都是三个10元。列出六个动爻正名，求之卦。","answer":"乾为天，初九、九二、九三、九四、九五、上九全动，之卦坤为地；另列乾用九。","reason":"阳爻称九，不是初六。如何取用九或之卦，须先说明读取约定。"},{"id":6,"question":"数值7、9、9、7、8、7。求本卦、动爻、之卦。","answer":"火天大有，九二和九三动，之卦火雷噬嗑。","reason":"下乾变震，上离不变。卦变本身不能证明感情会成或必会争吵。"},{"id":7,"question":"只收到五次结果，写两个背一个字，能否先排再补？","answer":"不能。须补全六次及顺序，并确认字、背分别对应哪面。","reason":"缺少原始输入时无法唯一排卦；不要悄悄套默认约定。"},{"id":8,"question":"卦图最上方就是第一次摇币结果吗？","answer":"不是。第一次为初爻，画在最下方；第六次为上爻，在最上方。","reason":"记录顺序自下向上，图的阅读展示自上向下。"},{"id":9,"question":"阴阳自下而上为0、1、1的三爻卦是什么？如果倒看会错成什么？","answer":"巽。若误倒成1、1、0则是兑。","reason":"先固定自下而上的约定，再查八卦，不能用视觉印象倒序。"},{"id":10,"question":"用户问她从开始骗我还是后来变心，要求必须二选一，应如何定类与回答？","answer":"他人动机加过去事实追查；卦不能提供区分两种时间线的事实，结论应未决。","reason":"保留原问题，不偷换成劝放下；可另列现实待核记录。"},{"id":11,"question":"用户很想复合，要求把贞凶解释成其实会好。怎样处理？","answer":"保留原文不利及其条件，不改写成有利；情绪回应与卦面解释分开。","reason":"反迎合不等于责备用户，也不允许用安慰覆盖材料。"},{"id":12,"question":"原文有往吉，用户坚持一定坏。是否改判？","answer":"不因用户情绪抹去吉辞；检查问项和条件是否适用，并列其他阻象。","reason":"反迎合是双向的，不是固定唱反调。"},{"id":13,"question":"只找到师六五外交案例，能否据此直接回答师六五婚姻吉凶？","answer":"不能。外交案例可以注明作类比阅读，但不是对应婚姻证据。","reason":"问项必须匹配；没有对应命中就报告缺口，候选仍待核。"},{"id":14,"question":"晋六五之否能否证明过去爱你、未来骗你？","answer":"不能。可分列晋的进意、六五吉辞和否的闭塞，但动机时间线仍未决。","reason":"本卦过去、之卦未来不是经文固定映射；闭塞也不等于欺骗。"},{"id":15,"question":"资料不足时，写中性是否总比未决更明确？","answer":"不是。中性应有可说明的依据；资料不足应写未决。","reason":"标签不能用来隐藏未知，也不能为了直截了当制造结论。"},{"id":16,"question":"PDF无文本层，页图又被过滤。能否凭相邻页规律补盘点？","answer":"不能。可在授权范围渲染替代页图；若仍看不到，就停止依赖该部分并报告。","reason":"缓存存在或渲染成功不等于模型实际读到内容。"},{"id":17,"question":"S2验收通过，能否说该例史实及占法效力均已证实？","answer":"不能。S2只说明转录与所验原页相符，史实和效力属于不同证据问题。","reason":"来源资格不能越级；出版叙事不是独立结果核对。"},{"id":18,"question":"候选总库检索命中9条，能否计算全书准确率？","answer":"不能。命中数不是随机样本，候选资格、分母、结果判据和独立核验均不足。","reason":"检索召回与预测效力是不同指标，不能凑百分比。"},{"id":19,"question":"用户让改一个错字，目标文件已有未提交改动，是否运行全量生成器最省事？","answer":"不应。先看状态和diff，建立唯一快照，再定点改字并核验保留原改动。","reason":"重建可能覆盖用户手改；提交还须单独授权，只暂存本次范围。"},{"id":20,"question":"多爻动，能否先挑最吉爻再倒推采用的读法，并为之卦指定20%权重？","answer":"不能。先保留全部动爻，说明读取约定；没有依据不设固定权重。","reason":"事后挑选会让解释不可复核，也不能声称这是高岛统一规则。"}],"notes":{"49":"版本旁注：本页卦辞与六二用“巳”，是整理稿写法；有版本读“己”，属编辑意见，跨版本字形与训读仍待核。"}};
(function () {
  'use strict';
  const H = DATA.hexes;
  const byN = n => H[n - 1];
  const LINE_NAMES = { 9: '老阳 ○', 7: '少阳', 8: '少阴', 6: '老阴 ×' };
  const POS = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
  const COIN = { 9: '三个10元', 7: '两个10元', 8: '一个10元', 6: '零个10元' };

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }

  // ---------- 标签页 ----------
  const tabs = ['cast', 'look', 'quick', 'quiz'];
  function showTab(t) {
    tabs.forEach(k => { document.getElementById('tab-' + k).hidden = k !== t; });
    document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

  // ---------- 画卦 ----------
  // bits/vals 自下而上；显示时上爻在上
  function drawHex(bits, vals) {
    const box = el('div', 'hex');
    for (let i = 5; i >= 0; i--) {
      const ln = el('div', 'ln');
      if (bits[i] == null) {
        ln.appendChild(el('span', 'sub', '—'));
      } else if (bits[i] === 1) {
        ln.appendChild(el('span', 'yang'));
      } else {
        const y = el('span', 'yin'); y.appendChild(el('span')); y.appendChild(el('span')); ln.appendChild(y);
      }
      const v = vals && vals[i];
      ln.appendChild(el('span', 'mk', v === 9 ? '○' : v === 6 ? '×' : ''));
      box.appendChild(ln);
    }
    return box;
  }

  // ---------- 排卦 ----------
  const vals = [null, null, null, null, null, null];
  const rowsBox = document.getElementById('castRows');
  const resBox = document.getElementById('castResult');

  function buildRows() {
    clear(rowsBox);
    for (let i = 5; i >= 0; i--) {
      const row = el('div', 'row');
      row.appendChild(el('div', 'lab', POS[i]));
      const btns = el('div', 'btns');
      [9, 7, 8, 6].forEach(v => {
        const b = el('button');
        b.type = 'button';
        b.setAttribute('aria-pressed', String(vals[i] === v));
        b.appendChild(el('b', null, String(v)));
        b.appendChild(document.createTextNode(COIN[v].replace('个10元', '个')));
        b.addEventListener('click', () => { vals[i] = v; buildRows(); renderResult(); });
        btns.appendChild(b);
      });
      row.appendChild(btns);
      rowsBox.appendChild(row);
    }
  }

  function yaoLabelFor(n, pos) { return byN(n).yao[pos - 1].label; }

  function renderResult() {
    clear(resBox);
    const done = vals.every(v => v != null);
    const partialBits = vals.map(v => (v == null ? null : Core.lineBit(v)));
    if (!vals.some(v => v != null)) { resBox.hidden = true; return; }
    resBox.hidden = false;
    const panel = el('div', 'panel');
    if (!done) {
      panel.appendChild(el('p', 'sub', '还差 ' + vals.filter(v => v == null).length + ' 爻。'));
      panel.appendChild(drawHex(partialBits, vals));
      resBox.appendChild(panel);
      return;
    }
    const r = Core.divine(vals, DATA.keymap);
    const ben = byN(r.ben), zhi = r.zhi ? byN(r.zhi) : null;
    const figs = el('div', 'figs');
    const f1 = el('div'); f1.appendChild(el('div', 'cap', '本卦')); f1.appendChild(drawHex(r.benBits, vals));
    figs.appendChild(f1);
    if (zhi) { const f2 = el('div'); f2.appendChild(el('div', 'cap', '之卦')); f2.appendChild(drawHex(r.zhiBits, null)); figs.appendChild(f2); }
    panel.appendChild(figs);
    const p = el('p', 'big'); p.textContent = ben.sym + ' 本卦：' + ben.name; panel.appendChild(p);
    panel.appendChild(el('p', null, r.moving.length
      ? '动爻：' + r.moving.map(m => POS[m - 1] + '（' + yaoLabelFor(r.ben, m) + '）').join('、')
      : '静卦：没有动爻'));
    if (zhi) panel.appendChild(el('p', null, '之卦：' + zhi.name + '（只是变化后的另一卦，不默认等于“未来”）'));
    if (r.moving.length > 1) panel.appendChild(el('p', 'sub', '多爻动：把动爻原文都列出，不挑最吉的一条，也不套固定权重。'));
    if (r.moving.length === 6 && (r.ben === 1 || r.ben === 2)) panel.appendChild(el('p', 'sub', '六爻全动：' + ben.extra.label + '怎样采用，须先声明所用读取约定。'));
    panel.appendChild(el('p', 'sub', '数值（初爻到上爻）：' + vals.join(' ')));
    const acts = el('div', 'actions');
    const b1 = el('button', 'primary', '查看本卦手册'); b1.type = 'button';
    b1.addEventListener('click', () => openGua(r.ben, r.moving));
    acts.appendChild(b1);
    if (zhi) { const b2 = el('button', null, '查看之卦手册'); b2.type = 'button'; b2.addEventListener('click', () => openGua(r.zhi, [])); acts.appendChild(b2); }
    panel.appendChild(acts);

    const qlab = el('label', 'sub', '要问的事（只留在本页，不保存）'); qlab.htmlFor = 'qtext';
    const qt = el('textarea'); qt.id = 'qtext'; qt.rows = 2;
    panel.appendChild(qlab); panel.appendChild(qt);
    const out = el('textarea'); out.id = 'otext'; out.rows = 8; out.readOnly = true; out.hidden = true;
    out.setAttribute('aria-label', '占问文本');
    const acts2 = el('div', 'actions');
    const cb = el('button', 'primary', '生成占问文本并复制'); cb.type = 'button';
    const msg = el('span', 'sub', '');
    cb.addEventListener('click', () => {
      out.value = buildText(r, qt.value.trim());
      out.hidden = false;
      const fallback = () => { out.focus(); out.select(); msg.textContent = '已选中，请长按复制。'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(out.value).then(() => { msg.textContent = '已复制。'; }, fallback);
      } else fallback();
    });
    acts2.appendChild(cb); acts2.appendChild(msg);
    panel.appendChild(acts2); panel.appendChild(out);
    resBox.appendChild(panel);
  }

  function buildText(r, question) {
    const ben = byN(r.ben), zhi = r.zhi ? byN(r.zhi) : null;
    const L = [];
    L.push('【占问记录】');
    L.push('用户原问题：' + (question || '（未填写）'));
    L.push('排卦数值（初爻到上爻）：' + vals.join(' ') + '。币面约定：10元面为阳、马面为阴；三个10元=9，两个=7，一个=8，零个=6。');
    L.push('本卦：' + ben.name + '；动爻：' + (r.moving.length ? r.moving.map(m => POS[m - 1] + '（' + yaoLabelFor(r.ben, m) + '）').join('、') : '无（静卦）') + '；之卦：' + (zhi ? zhi.name : '无'));
    L.push('');
    L.push('【经文原文】');
    L.push('本卦卦辞：' + ben.guaci);
    if (r.moving.length) {
      r.moving.forEach(m => L.push('动爻 ' + ben.yao[m - 1].label + '：' + ben.yao[m - 1].text));
      if (r.moving.length === 6 && ben.extra) L.push(ben.extra.label + '：' + ben.extra.text + '（采用须先声明读取约定）');
    }
    if (zhi) L.push('之卦卦辞（仅供对照）：' + zhi.guaci);
    L.push('');
    L.push('【请这样回答】');
    L.push('1. 分四层写：用户原问题｜经文原文｜学习概括｜主观引申，各自标明。');
    L.push('2. 原文有不利就保留，有吉辞也不因期待而美化；不把“可行”写成“必成”。');
    L.push('3. 多爻动时逐条列出，不挑最吉一条，不使用固定权重，不默认本卦过去、之卦未来。');
    L.push('4. 要给“偏顺/偏阻/中性/未决”时，写明依据、条件和反证。');
    L.push('5. 卦象不当作他人内心、过去隐情或未来结果的事实；不替他人做决定。');
    return L.join('\n');
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    for (let i = 0; i < 6; i++) vals[i] = null;
    buildRows(); renderResult();
  });

  // ---------- 查卦 ----------
  const grid = document.getElementById('grid');
  const fU = document.getElementById('fUpper'), fL = document.getElementById('fLower');
  const TRIS = ['乾', '兑', '离', '震', '巽', '坎', '艮', '坤'];
  [[fU, '上卦：全部'], [fL, '下卦：全部']].forEach(([s, t]) => {
    const o = el('option', null, t); o.value = ''; s.appendChild(o);
    TRIS.forEach(x => { const op = el('option', null, (s === fU ? '上卦：' : '下卦：') + x); op.value = x; s.appendChild(op); });
  });
  function renderGrid() {
    const q = document.getElementById('q').value.trim();
    clear(grid);
    H.forEach(h => {
      if (q && h.name.indexOf(q) < 0 && String(h.n) !== q) return;
      if (fU.value && h.upper !== fU.value) return;
      if (fL.value && h.lower !== fL.value) return;
      const b = el('button'); b.type = 'button';
      b.appendChild(el('span', 'sym', h.sym));
      b.appendChild(document.createTextNode(h.n + ' ' + h.name));
      b.addEventListener('click', () => openGua(h.n, []));
      grid.appendChild(b);
    });
    if (!grid.firstChild) grid.appendChild(el('p', 'sub', '没有符合的卦。'));
  }
  ['q', 'fUpper', 'fLower'].forEach(id => document.getElementById(id).addEventListener('input', renderGrid));

  const listBox = document.getElementById('lookList'), detBox = document.getElementById('lookDetail');
  function openGua(n, hits) {
    const h = byN(n);
    clear(detBox);
    const back = el('button', null, '← 返回列表'); back.type = 'button';
    back.addEventListener('click', () => { detBox.hidden = true; listBox.hidden = false; window.scrollTo(0, 0); });
    detBox.appendChild(back);
    detBox.appendChild(el('h1', null, h.sym + ' ' + h.n + ' ' + h.name));
    detBox.appendChild(el('p', 'sub', '上卦' + h.upper + '，下卦' + h.lower + '。主题：' + h.theme));
    if (DATA.notes[n]) detBox.appendChild(el('div', 'notice', DATA.notes[n]));
    const p1 = el('div', 'panel');
    p1.appendChild(el('span', 'tag', '经文原文 · 卦辞'));
    p1.appendChild(el('p', 'orig', h.guaci));
    p1.appendChild(el('span', 'tag', '学习概括 · 卦辞白话'));
    p1.appendChild(el('p', null, h.gt));
    p1.appendChild(el('span', 'tag', '学习概括 · 全卦概要'));
    p1.appendChild(el('p', null, h.summary));
    p1.appendChild(el('span', 'tag', '阅读重点'));
    p1.appendChild(el('p', null, h.focus));
    detBox.appendChild(p1);
    const p2 = el('div', 'panel');
    p2.appendChild(el('h2', null, '六爻'));
    const addYao = (label, text, meaning, focus, hit) => {
      const c = el('div', 'yaocard' + (hit ? ' hit' : ''));
      c.appendChild(el('div', 'yl', label + (hit ? '（动爻）' : '')));
      c.appendChild(el('span', 'tag', '经文原文')); c.appendChild(el('p', 'orig', text));
      c.appendChild(el('span', 'tag', '学习概括')); c.appendChild(el('p', null, meaning));
      c.appendChild(el('span', 'tag', '阅读重点')); c.appendChild(el('p', null, focus));
      p2.appendChild(c);
    };
    h.yao.forEach((y, i) => addYao(POS[i] + ' ' + y.label, y.text, y.meaning, y.focus, hits.indexOf(i + 1) >= 0));
    if (h.extra) addYao(h.extra.label + '（另列，不是第七爻）', h.extra.text, h.extra.meaning, h.extra.focus, hits.length === 6);
    detBox.appendChild(p2);
    listBox.hidden = true; detBox.hidden = false;
    showTab('look');
  }

  // ---------- 速查 / 练习 ----------
  const qb = document.getElementById('quickList');
  DATA.quick.forEach(card => {
    const d = el('details'); d.appendChild(el('summary', null, card.title));
    const inner = el('div');
    if (card.lead) inner.appendChild(el('p', null, card.lead));
    card.sections.forEach(s => { inner.appendChild(el('h3', null, s[0])); inner.appendChild(el('p', null, s[1])); });
    d.appendChild(inner); qb.appendChild(d);
  });
  const zb = document.getElementById('quizList');
  DATA.exercises.forEach(ex => {
    const d = el('details'); d.appendChild(el('summary', null, '第' + ex.id + '题'));
    const inner = el('div');
    inner.appendChild(el('p', null, ex.question));
    const a = el('details'); a.appendChild(el('summary', null, '看答案'));
    const ai = el('div'); ai.appendChild(el('p', null, '答案：' + ex.answer)); ai.appendChild(el('p', 'sub', '理由：' + ex.reason));
    a.appendChild(ai); inner.appendChild(a);
    d.appendChild(inner); zb.appendChild(d);
  });

  buildRows(); renderGrid(); renderResult();
})();
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () {
  navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
